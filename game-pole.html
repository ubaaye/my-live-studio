<script>
GAME3D['pole'] = { create: function(THREE) { const T = THREE; const scene = new T.Scene(); const SKY_COL = 0xffcb8c; scene.background = new T.Color(SKY_COL); scene.fog = new T.Fog(SKY_COL, 22, 46);



const camera = new T.PerspectiveCamera(55, 0.5625, 0.2, 80);
camera.position.set(0, 6.5, 17);
camera.lookAt(0, 4.6, 0);
const camPosT = new T.Vector3(0, 6.5, 17);
const camLookT = new T.Vector3(0, 4.6, 0);
const camLook = new T.Vector3(0, 4.6, 0);

const hemi = new T.HemisphereLight(0xffe9c4, 0x996238, 0.95);
scene.add(hemi);

const sun = new T.DirectionalLight(0xfff1d0, 1.45);
sun.position.set(7.5, 15.5, 10.5);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -5.5;
sun.shadow.camera.right = 5.5;
sun.shadow.camera.top = 12.2;
sun.shadow.camera.bottom = -1.5;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 32;
sun.shadow.bias = -0.0012;
sun.target.position.set(0, 4.5, 0);
scene.add(sun);
scene.add(sun.target);

const matCache = {};
function stdMat(key, color, rough, metal, dbl) {
  if (!matCache[key]) {
    matCache[key] = new T.MeshStandardMaterial({
      color: color,
      roughness: rough !== undefined ? rough : 0.82,
      metalness: metal || 0,
      side: dbl ? T.DoubleSide : T.FrontSide
    });
  }
  return matCache[key];
}

const MAT = {
  ground: stdMat('ground', 0xdba86c, 0.9),
  dirt: stdMat('dirt', 0xc2894c, 0.9),
  wood: stdMat('wood', 0x8b5630, 0.86),
  bambooDry: stdMat('bambooDry', 0xbca258, 0.82),
  skin: stdMat('skin', 0xe2a878, 0.8),
  thanaka: stdMat('thanaka', 0xf9ebb0, 0.85),
  eye: stdMat('eye', 0x241914, 0.6),
  redTop: stdMat('redTop', 0xe53434, 0.8),
  redLongyi: stdMat('redLongyi', 0x911820, 0.85, 0, true),
  blueTop: stdMat('blueTop', 0x2472e8, 0.8),
  blueLongyi: stdMat('blueLongyi', 0x153e8c, 0.85, 0, true),
  gold: new T.MeshPhongMaterial({ color: 0xffc628, specular: 0xfff5c0, shininess: 90 }),
  goldTrim: stdMat('goldTrim', 0xf5b822, 0.76),
  tentRed: stdMat('tentRed', 0xd4312c, 0.82, 0, true),
  tentGold: stdMat('tentGold', 0xe89f24, 0.82, 0, true),
  poleGrease: new T.MeshPhongMaterial({ color: 0xb7c954, specular: 0xffffff, shininess: 120 }),
  poleRing: new T.MeshPhongMaterial({ color: 0x899a36, specular: 0xf4ffd4, shininess: 80 }),
  palmTrunk: stdMat('palmTrunk', 0x7a5638, 0.88),
  palmLeaf: stdMat('palmLeaf', 0x42913e, 0.82, 0, true),
  rope: stdMat('rope', 0x5c3e26, 0.9),
  whiteInst: new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, side: T.DoubleSide }),
  partMat: new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide }),
  flashRed: new T.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: 0, side: T.DoubleSide }),
  flashBlue: new T.MeshBasicMaterial({ color: 0xffd84a, transparent: true, opacity: 0, side: T.DoubleSide }),
  boltRed: new T.MeshBasicMaterial({ color: 0xfff07a, transparent: true, opacity: 0, side: T.DoubleSide }),
  boltBlue: new T.MeshBasicMaterial({ color: 0x8ae8ff, transparent: true, opacity: 0, side: T.DoubleSide })
};

const GEO = {
  head: new T.SphereGeometry(0.185, 10, 8),
  eye: new T.SphereGeometry(0.024, 6, 5),
  thanaka: new T.CylinderGeometry(0.056, 0.056, 0.016, 8),
  gaung: new T.TorusGeometry(0.172, 0.044, 7, 14),
  torso: new T.CylinderGeometry(0.20, 0.175, 0.54, 10),
  longyi: new T.CylinderGeometry(0.195, 0.255, 0.52, 10, 1, true),
  armSeg: new T.CylinderGeometry(0.054, 0.048, 0.30, 7),
  armFull: new T.CylinderGeometry(0.054, 0.045, 0.54, 7),
  legSeg: new T.CylinderGeometry(0.072, 0.058, 0.37, 7),
  legFull: new T.CylinderGeometry(0.072, 0.052, 0.70, 7),
  pole: new T.CylinderGeometry(0.16, 0.175, 10, 14),
  poleRing: new T.TorusGeometry(0.168, 0.022, 6, 14),
  collar: new T.CylinderGeometry(0.28, 0.42, 0.24, 10),
  crossbar: new T.CylinderGeometry(0.032, 0.032, 0.92, 8),
  flagStick: new T.CylinderGeometry(0.022, 0.022, 0.95, 6),
  bill: new T.BoxGeometry(0.15, 0.34, 0.015),
  flashRing: new T.TorusGeometry(0.6, 0.08, 8, 20),
  boltSpiral: new T.CylinderGeometry(0.36, 0.24, 2.2, 8, 1, true),
  crowdBody: new T.CylinderGeometry(0.175, 0.195, 0.66, 7),
  crowdHead: new T.SphereGeometry(0.15, 8, 6),
  crowdArm: new T.CylinderGeometry(0.038, 0.045, 0.46, 5).translate(0, 0.23, 0),
  trunkSeg: new T.CylinderGeometry(0.14, 0.22, 1.0, 7),
  frond: new T.ConeGeometry(0.28, 2.3, 4),
  fencePost: new T.CylinderGeometry(0.055, 0.06, 1.0, 6),
  partBox: new T.BoxGeometry(0.14, 0.14, 0.14)
};

const bagPts = [
  new T.Vector2(0.01, -0.26),
  new T.Vector2(0.20, -0.22),
  new T.Vector2(0.25, -0.05),
  new T.Vector2(0.17, 0.10),
  new T.Vector2(0.08, 0.16),
  new T.Vector2(0.15, 0.25),
  new T.Vector2(0.04, 0.26)
];
GEO.bag = new T.LatheGeometry(bagPts, 10);

const triGeo = new T.BufferGeometry();
triGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([
  -0.21, 0, 0,
   0.21, 0, 0,
   0, -0.46, 0
]), 3));
triGeo.computeVertexNormals();
GEO.pennant = triGeo;

const flagGeo = new T.BufferGeometry();
flagGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([
  0, 0.22, 0,
  0.62, 0.04, 0,
  0, -0.18, 0
]), 3));
flagGeo.computeVertexNormals();
GEO.flag = flagGeo;

const dummy = new T.Object3D();
const tmpCol = new T.Color();

// Ground & arena
const ground = new T.Mesh(new T.PlaneGeometry(46, 46), MAT.ground);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const arena = new T.Mesh(new T.CircleGeometry(4.3, 28), MAT.dirt);
arena.rotation.x = -Math.PI / 2;
arena.position.set(0, 0.01, 0.2);
arena.receiveShadow = true;
scene.add(arena);

function makePerson(team, articulatedLimbs) {
  const topMat = team === 'red' ? MAT.redTop : MAT.blueTop;
  const longyiMat = team === 'red' ? MAT.redLongyi : MAT.blueLongyi;
  const root = new T.Group();
  const hips = new T.Group();
  hips.position.y = 0.72;
  root.add(hips);

  const torso = new T.Group();
  hips.add(torso);
  const torsoMesh = new T.Mesh(GEO.torso, topMat);
  torsoMesh.position.y = 0.27;
  torsoMesh.castShadow = true;
  torso.add(torsoMesh);

  const longyiMesh = new T.Mesh(GEO.longyi, longyiMat);
  longyiMesh.position.y = -0.18;
  longyiMesh.castShadow = true;
  hips.add(longyiMesh);

  const head = new T.Group();
  head.position.y = 0.56;
  torso.add(head);
  const headMesh = new T.Mesh(GEO.head, MAT.skin);
  headMesh.position.y = 0.185;
  headMesh.castShadow = true;
  head.add(headMesh);

  const eyeL = new T.Mesh(GEO.eye, MAT.eye);
  eyeL.position.set(-0.068, 0.205, 0.165);
  head.add(eyeL);
  const eyeR = new T.Mesh(GEO.eye, MAT.eye);
  eyeR.position.set(0.068, 0.205, 0.165);
  head.add(eyeR);

  const thL = new T.Mesh(GEO.thanaka, MAT.thanaka);
  thL.position.set(-0.115, 0.15, 0.135);
  thL.rotation.set(Math.PI / 2, 0, 0.58);
  head.add(thL);
  const thR = new T.Mesh(GEO.thanaka, MAT.thanaka);
  thR.position.set(0.115, 0.15, 0.135);
  thR.rotation.set(Math.PI / 2, 0, -0.58);
  head.add(thR);

  const gb = new T.Mesh(GEO.gaung, topMat);
  gb.position.set(0, 0.275, -0.01);
  gb.rotation.set(Math.PI / 2 - 0.18, 0, 0.08);
  head.add(gb);

  const armL = new T.Group();
  armL.position.set(-0.24, 0.48, 0);
  torso.add(armL);
  const armR = new T.Group();
  armR.position.set(0.24, 0.48, 0);
  torso.add(armR);

  let handL = armL;
  let handR = armR;

  if (articulatedLimbs) {
    const uL = new T.Mesh(GEO.armSeg, MAT.skin);
    uL.position.set(0, -0.14, 0.03);
    uL.rotation.x = -0.2;
    uL.castShadow = true;
    armL.add(uL);
    const fL = new T.Mesh(GEO.armSeg, MAT.skin);
    fL.position.set(0.08, -0.34, 0.15);
    fL.rotation.set(-0.75, 0, 0.45);
    fL.castShadow = true;
    armL.add(fL);
    handL = new T.Group();
    handL.position.set(0.12, -0.44, 0.24);
    armL.add(handL);

    const uR = new T.Mesh(GEO.armSeg, MAT.skin);
    uR.position.set(0, -0.14, 0.03);
    uR.rotation.x = -0.2;
    uR.castShadow = true;
    armR.add(uR);
    const fR = new T.Mesh(GEO.armSeg, MAT.skin);
    fR.position.set(-0.08, -0.34, 0.15);
    fR.rotation.set(-0.75, 0, -0.45);
    fR.castShadow = true;
    armR.add(fR);
    handR = new T.Group();
    handR.position.set(-0.12, -0.44, 0.24);
    armR.add(handR);
  } else {
    const mAL = new T.Mesh(GEO.armFull, MAT.skin);
    mAL.position.y = -0.26;
    mAL.castShadow = true;
    armL.add(mAL);
    const mAR = new T.Mesh(GEO.armFull, MAT.skin);
    mAR.position.y = -0.26;
    mAR.castShadow = true;
    armR.add(mAR);
  }

  const legL = new T.Group();
  legL.position.set(-0.12, 0, 0);
  hips.add(legL);
  const legR = new T.Group();
  legR.position.set(0.12, 0, 0);
  hips.add(legR);

  if (articulatedLimbs) {
    const tL = new T.Mesh(GEO.legSeg, MAT.skin);
    tL.position.set(-0.03, -0.17, 0.05);
    tL.rotation.set(-0.35, 0, -0.15);
    tL.castShadow = true;
    legL.add(tL);
    const sL = new T.Mesh(GEO.legSeg, MAT.skin);
    sL.position.set(0.02, -0.48, 0.04);
    sL.rotation.set(0.32, 0, 0.22);
    sL.castShadow = true;
    legL.add(sL);

    const tR = new T.Mesh(GEO.legSeg, MAT.skin);
    tR.position.set(0.03, -0.17, 0.05);
    tR.rotation.set(-0.35, 0, 0.15);
    tR.castShadow = true;
    legR.add(tR);
    const sR = new T.Mesh(GEO.legSeg, MAT.skin);
    sR.position.set(-0.02, -0.48, 0.04);
    sR.rotation.set(0.32, 0, -0.22);
    sR.castShadow = true;
    legR.add(sR);
  } else {
    const mLL = new T.Mesh(GEO.legFull, MAT.skin);
    mLL.position.y = -0.35;

function updateSide(st, targetH, dt, running, over, winner) {
  const isWin = over && winner === st.team;
  const isLose = over && winner && winner !== st.team;

  if (st.slideToBase) {
    st.hSmooth = Math.max(0, st.hSmooth - dt * 1.9);
    if (st.hSmooth <= 0.002) {
      st.hSmooth = 0;
      st.slideToBase = false;
    }
  } else {
    const desired = isWin ? 1.0 : Math.min(1, Math.max(0, targetH));
    const rate = st.lightningT > 0 ? 12 : 7;
    st.hSmooth += (desired - st.hSmooth) * Math.min(1, dt * rate);
  }

  const rawVel = dt > 0.0001 ? (targetH - st.prevH) / dt : 0;
  st.prevH = targetH;
  st.climbVel += (rawVel - st.climbVel) * Math.min(1, dt * 8);

  if (st.scrambleT > 0) st.scrambleT = Math.max(0, st.scrambleT - dt);
  if (st.greaseT > 0) st.greaseT = Math.max(0, st.greaseT - dt);
  if (st.windT > 0) st.windT = Math.max(0, st.windT - dt);
  if (st.lightningT > 0) st.lightningT = Math.max(0, st.lightningT - dt);
  if (st.flashT > 0) st.flashT = Math.max(0, st.flashT - dt);
  if (st.cheerT > 0) st.cheerT = Math.max(0, st.cheerT - dt);
  if (st.tugT > 0) st.tugT = Math.max(0, st.tugT - dt);
  if (st.ladderT > 0) st.ladderT = Math.max(0, st.ladderT - dt);
  if (st.fallT > 0) { st.fallT = Math.max(0, st.fallT - dt); if (st.fallT <= 0) st.scrambleT = Math.max(st.scrambleT, 0.9); }

  // Human-tower sequence (T3): the climber on the pole comes DOWN, the
  // gift giver takes over, the team stacks a human ladder and boosts
  // him all the way to the TOP of the pole
  const lad = { a: 0, moveB: 0, up: 0, form: 0, lp: -1 };
  if (st.ladderT > 0) {
    const lp2 = 1 - st.ladderT / 7.0;
    lad.lp = lp2;
    const sg2 = function(a, b, x) { return Math.max(0, Math.min(1, (x - a) / (b - a))); };
    lad.a = sg2(0, 0.14, lp2) * (1 - sg2(0.86, 1, lp2));
    lad.moveB = sg2(0.10, 0.24, lp2) * (1 - sg2(0.86, 0.97, lp2));
    lad.up = sg2(0.16, 0.30, lp2) * (1 - sg2(0.86, 0.97, lp2));
    lad.form = sg2(0.28, 0.40, lp2) * (1 - sg2(0.86, 0.97, lp2));
  }

  // Visual grease dip
  if (st.greaseT > 0) {
    const gProg = 1 - st.greaseT / 0.8;
    st.greaseDip = Math.sin(Math.min(1, gProg) * Math.PI) * 0.85;
    if (Math.random() < dt * 24) {
      const cy = Math.max(0.4, st.hSmooth * 8.4 - st.greaseDip + 0.9);
      spawnP(
        st.px + (Math.random() - 0.5) * 0.45,
        cy,
        (Math.random() - 0.5) * 0.45,
        (Math.random() - 0.5) * 1.4,
        0.5 + Math.random() * 1.2,
        (Math.random() - 0.5) * 1.4,
        0.55,
        0xf6f7b0,
        0.65, 0.9, 0.65,
        6.5, 4
      );
    }
  } else {
    st.greaseDip *= Math.max(0, 1 - dt * 10);
  }

  // Wind leaf/sparkle particles
  if (st.windT > 0 && Math.random() < dt * 32) {
    const a = timeAcc * 8 + Math.random() * 6.28;
    const cy = st.hSmooth * 8.4 + 0.5;
    const isLeaf = Math.random() < 0.55;
    spawnP(
      st.px + Math.cos(a) * 0.55,
      cy + (Math.random() - 0.5) * 0.8,
      Math.sin(a) * 0.55,
      -Math.sin(a) * 1.4,
      2.4 + Math.random() * 1.6,
      Math.cos(a) * 1.4,
      0.75,
      isLeaf ? 0x52c44e : 0xfff5b8,
      isLeaf ? 1.2 : 0.7, isLeaf ? 0.65 : 0.7, 0.2,
      -0.6, 8
    );
  }

  // Lightning spiral particles & aura
  if (st.lightningT > 0) {
    st.climberPivot.rotation.y += dt * 13.5 * st.sign;
    st.boltGlow.visible = true;
    st.boltGlow.position.y = Math.min(9.2, Math.max(1.2, st.hSmooth * 8.4 + 0.9));
    st.boltGlow.rotation.y += dt * 14;
    st.boltGlow.material.opacity = 0.55 * Math.min(1, st.lightningT * 2);
    if (Math.random() < dt * 42) {
      const a = timeAcc * 14 + Math.random() * 6.28;
      spawnP(
        st.px + Math.cos(a) * 0.45,
        st.hSmooth * 8.4 + 0.6 + Math.random() * 0.9,
        Math.sin(a) * 0.45,
        Math.cos(a) * 1.5,
        1.6 + Math.random() * 2.2,
        Math.sin(a) * 1.5,
        0.55,
        Math.random() < 0.6 ? 0xffdf38 : 0xffffff,
        0.85, 0.85, 0.85,
        1.5, 10
      );
    }
  } else {
    st.boltGlow.visible = false;
    const targetYaw = isWin ? st.sign * 0.68 : st.baseYaw;
    let diff = targetYaw - st.climberPivot.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    st.climberPivot.rotation.y += diff * Math.min(1, dt * 8);
  }

  // Top flash ring (T4)
  if (st.flashT > 0) {
    st.flashRing.visible = true;
    const p = 1 - st.flashT / 0.7;
    const sc = 0.5 + p * 2.4;
    st.flashRing.scale.set(sc, sc, sc);
    st.flashRing.material.opacity = (1 - p) * 0.9;
  } else {
    st.flashRing.visible = false;
  }

  // Position climber on 0..9 range (feet at 0..8.45, hands reach 10)
  const c = st.climber;
  let yPos = Math.max(0, st.hSmooth * 8.45 - st.greaseDip);
  const fallP = st.fallT > 0 ? 1 - st.fallT / 2.6 : 1;
  const falling = st.fallT > 0 && fallP < 0.25;
  const downed = st.fallT > 0 && fallP >= 0.25;
  st.downedNow = downed;
  if (st.fallT > 0) {
    if (falling) { const fk = fallP / 0.25; yPos = st.fallFrom * (1 - fk * fk); }
    else yPos = 0;
  }
  // Ladder height path: down → base → onto the tower → TOP (8.45) → back
  let ladPhase = '';
  st.ladderLpNow = st.ladderT > 0 ? lad.lp : -1;
  if (st.ladderT > 0 && st.fallT <= 0 && lad.lp >= 0) {
    const lp = lad.lp;
    ladPhase = lp < 0.16 ? 'down' : lp < 0.30 ? 'base' : lp < 0.46 ? 'tower' : lp < 0.66 ? 'climb' : lp < 0.84 ? 'top' : 'return';
    const keys = [[0, st.ladderFromY], [0.16, 0], [0.30, 0], [0.46, st.ladderTopY], [0.66, 8.45], [0.84, 8.45], [1, yPos]];
    for (let ki = 0; ki < keys.length - 1; ki++) {
      if (lp >= keys[ki][0] && lp <= keys[ki + 1][0]) {
        const kk = (lp - keys[ki][0]) / Math.max(0.0001, keys[ki + 1][0] - keys[ki][0]);
        const ee = kk * kk * (3 - 2 * kk);
        yPos = keys[ki][1] + (keys[ki + 1][1] - keys[ki][1]) * ee;
        break;
      }
    }
  }
  const isClimbing = st.fallT <= 0 && (st.scrambleT > 0 || st.windT > 0 || st.lightningT > 0 || st.tugT > 0 || st.climbVel > 0.015 || ladPhase === 'down' || ladPhase === 'climb' || ladPhase === 'return');

  if (isWin) {
    yPos = 8.45;
    if (!st.bagHeld) {
      const grabHand = st.team === 'red' ? c.handL : c.handR;
      grabHand.add(st.bag);
      st.bag.position.set(0, -0.05, 0.08);
      st.bag.rotation.set(0.3, 0, 0);
      st.bagHeld = true;
    }
    const wave = Math.sin(timeAcc * 9);
    c.hips.position.y = 0.72 + Math.abs(wave) * 0.06;
    c.torso.rotation.set(0.08, st.sign * 0.35, wave * 0.08);
    c.head.rotation.set(-0.1, st.sign * 0.4, wave * 0.1);
    if (st.team === 'red') {
      c.armR.rotation.set(-1.65, 0, 0.15);
      c.armL.rotation.set(-2.65 + wave * 0.35, 0, -0.55 + wave * 0.25);
    } else {
      c.armL.rotation.set(-1.65, 0, -0.15);
      c.armR.rotation.set(-2.65 + wave * 0.35, 0, 0.55 - wave * 0.25);
    }
    c.legL.rotation.set(-0.95, 0, -0.25);
    c.legR.rotation.set(-0.95, 0, 0.25);
  } else if (downed) {
    // Flat on the ground, DIZZY — head rolling in a circle, stars orbit
    const dz = timeAcc * 2.6;
    c.hips.position.y = 0.62;
    c.torso.rotation.set(0.38, Math.sin(dz) * 0.14, Math.cos(dz) * 0.10);
    c.head.rotation.set(0.42, Math.sin(dz) * 0.55, Math.cos(dz) * 0.40);
    c.armL.rotation.set(-0.7, 0, -0.9);
    c.armR.rotation.set(-0.7, 0, 0.9);
    c.legL.rotation.set(-0.35, 0, -0.55);
    c.legR.rotation.set(-0.35, 0, 0.55);
  } else if (falling || st.greaseT > 0) {
    // Squeak-flail wobble
    const fl = Math.sin(timeAcc * 32);
    c.hips.position.y = 0.72;
    c.torso.rotation.set(0.18, fl * 0.18, fl * 0.26);
    c.head.rotation.set(0.25, -fl * 0.35, fl * 0.2);
    c.armL.rotation.set(-1.35 + fl * 0.75, 0, -0.55 - Math.abs(fl) * 0.45);
    c.armR.rotation.set(-1.35 - fl * 0.75, 0, 0.55 + Math.abs(fl) * 0.45);
    c.legL.rotation.set(-0.6 - fl * 0.65, 0, -0.5);
    c.legR.rotation.set(-0.6 + fl * 0.65, 0, 0.5);
  } else if (ladPhase === 'base') {
    // At the base, crouched ready while the tower forms under him
    c.hips.position.y = 0.52;
    c.torso.rotation.set(0.16, st.sign * 0.2, 0);
    c.head.rotation.set(-0.4, st.sign * 0.3, 0);
    c.armL.rotation.set(-2.2, 0, -0.5);
    c.armR.rotation.set(-2.2, 0, 0.5);
    c.legL.rotation.set(-1.15, 0, -0.3);
    c.legR.rotation.set(-1.15, 0, 0.3);
  } else if (ladPhase === 'tower' || ladPhase === 'top') {
    // Standing on top of the human tower / at the pole top, reaching for the prize
    const wv2 = Math.sin(timeAcc * 6);
    c.hips.position.y = 0.72;
    c.torso.rotation.set(-0.04, st.sign * 0.2, wv2 * 0.05);
    c.head.rotation.set(-0.42, st.sign * 0.3, 0);
    c.armL.rotation.set(-1.5, 0, -0.3);
    c.armR.rotation.set(-2.95 + Math.sin(timeAcc * 5) * 0.12, 0, 0.25);
    c.legL.rotation.set(-0.07, 0, -0.09);
    c.legR.rotation.set(-0.07, 0, 0.09);
  } else if (isClimbing) {
    const speed = st.lightningT > 0 ? 22 : (st.scrambleT > 0 || st.windT > 0 ? 18 : 11);
    st.climbPhase += dt * speed;
    const ph = st.climbPhase;
    const s1 = Math.sin(ph);
    const c1 = Math.cos(ph);
    c.hips.position.y = 0.72 + Math.abs(s1) * 0.08;
    c.torso.rotation.set(0.08, s1 * 0.14, s1 * 0.11);
    c.head.rotation.set(-0.32, st.sign * 0.35, -s1 * 0.08);
    c.armL.rotation.set(-1.65 + s1 * 0.55, 0, -0.1 + c1 * 0.12);
    c.armR.rotation.set(-1.65 - s1 * 0.55, 0, 0.1 - c1 * 0.12);
    c.legL.rotation.set(-0.95 - s1 * 0.42, 0, -0.28);
    c.legR.rotation.set(-0.95 + s1 * 0.42, 0, 0.28);
  } else if (isLose) {
    const sl = Math.sin(timeAcc * 2.5);
    c.hips.position.y = 0.68;
    c.torso.rotation.set(0.22, 0, sl * 0.05);
    c.head.rotation.set(0.32, sl * 0.35, 0);
    c.armL.rotation.set(-1.35, 0, -0.12);
    c.armR.rotation.set(-1.35, 0, 0.12);
    c.legL.rotation.set(-0.78, 0, -0.22);
    c.legR.rotation.set(-0.78, 0, 0.22);
  } else {
    // Grease sliding shiver or breathing idle
    const shiv = running && st.hSmooth > 0.02 ? Math.sin(timeAcc * 28) * 0.035 : 0;
    const br = Math.sin(timeAcc * 3.4 + (st.team === 'red' ? 0 : 1.5));
    c.hips.position.y = 0.72 + br * 0.025;
    c.torso.rotation.set(0.06, shiv, shiv * 1.4);
    c.head.rotation.set(-0.22 + br * 0.04, st.sign * 0.38, 0);
    c.armL.rotation.set(-1.62 + br * 0.05 + shiv, 0, -0.14);
    c.armR.rotation.set(-1.62 - br * 0.05 - shiv, 0, 0.14);
    c.legL.rotation.set(-0.92 + shiv, 0, -0.25);
    c.legR.rotation.set(-0.92 - shiv, 0, 0.25);
  }

  st.climberPivot.position.y = yPos;

  // Gift-giver name rides above the climber's head (hidden while the
  // previous climber slides down — the giver takes over at the base)
  if (st.labelT > 0) st.labelT = Math.max(0, st.labelT - dt);
  st.nameSpr.visible = st.labelT > 0 && ladPhase !== 'down';
  if (st.nameSpr.visible) st.nameSpr.position.y = yPos + 2.15;

  // Dizzy stars orbit the fallen climber's head
  st.starGrp.visible = downed;
  if (downed) {
    st.starGrp.position.set(0, yPos + 1.62, 0.45);
    for (let si = 0; si < st.stars.length; si++) {
      const an = timeAcc * 3.4 + si * 2.094;
      st.stars[si].position.set(Math.cos(an) * 0.38, Math.sin(an * 1.3) * 0.12, Math.sin(an) * 0.2);
    }
  }

  // Pole top flag & hanging bag sway
  st.flag.rotation.y = Math.sin(timeAcc * 4.5 + st.px) * 0.32;
  if (!st.bagHeld) {
    st.bag.rotation.z = Math.sin(timeAcc * 2.6 + st.px) * 0.12;
  }

  // Supporters cheering & boost-ready bounce
  const boost = isWin ? 1.8 : (st.cheerT > 0 ? 1.6 : 1.0);
  const bA = Math.abs(Math.sin(timeAcc * (4.8 * boost) + (st.team === 'red' ? 0 : 1.1)));
  const bB = Math.abs(Math.sin(timeAcc * (5.3 * boost) + (st.team === 'red' ? 1.4 : 2.5)));

  // Supporter A: shoulders-ready boost stance with arms up bounce
  const sA = st.supA;
  sA.root.position.y = bA * (isWin || st.cheerT > 0 ? 0.26 : 0.09);
  sA.hips.position.y = 0.66 + bA * 0.06;
  sA.torso.rotation.set(0.14, 0, Math.sin(timeAcc * 5) * 0.07);
  sA.head.rotation.set(-0.28, 0, 0);
  sA.armL.rotation.set(-0.4, 0, -2.35 - bA * 0.35);
  sA.armR.rotation.set(-0.4, 0, 2.35 + bA * 0.35);
  sA.legL.rotation.set(-0.22, 0, -0.16);
  sA.legR.rotation.set(-0.22, 0, 0.16);

  // Supporter B: energetic cheering bounce
  const sB = st.supB;
  sB.root.position.y = bB * (isWin || st.cheerT > 0 ? 0.32 : 0.12);
  sB.hips.position.y = 0.72;
  sB.torso.rotation.set(-0.06, Math.sin(timeAcc * 4) * 0.12, Math.sin(timeAcc * 6) * 0.08);
  sB.head.rotation.set(-0.32, 0, 0);
  sB.armL.rotation.set(0, 0, -2.55 - bB * 0.35);
  sB.armR.rotation.set(0, 0, 2.55 + bB * 0.35);
  sB.legL.rotation.set(bB * 0.18, 0, -0.08);
  sB.legR.rotation.set(-bB * 0.18, 0, 0.08);

  // Human tower ON the pole (T3): A sits at the base hugging the pole,
  // B stands on A's shoulders hugging the pole, climber stands on B
  if (st.ladderT > 0) {
    const lerp = function(a, b, k) { return a + (b - a) * k; };
    const ez = function(k) { return k * k * (3 - 2 * k); };
    const aK = ez(lad.a), bM = ez(lad.moveB), bU = ez(lad.up);
    // A — base anchor: seated at the pole, legs folded, arms hugging the pole
    sA.root.position.set(lerp(st.supAH.x, st.px + st.sign * 0.05, aK), 0, lerp(st.supAH.z, 0.37, aK));
    sA.root.rotation.y = lerp(-st.sign * 0.35, Math.PI, aK);
    sA.hips.position.y = lerp(0.66, 0.40, aK);
    sA.torso.rotation.set(lerp(0.14, 0.10, aK), 0, 0);
    sA.head.rotation.set(lerp(-0.28, -0.30, aK), 0, 0);
    sA.armL.rotation.set(lerp(-0.4, -1.45, aK), 0, lerp(-2.35, -0.38, aK));
    sA.armR.rotation.set(lerp(-0.4, -1.45, aK), 0, lerp(2.35, 0.38, aK));
    sA.legL.rotation.set(lerp(-0.22, -1.85, aK), 0, lerp(-0.16, -0.55, aK));
    sA.legR.rotation.set(lerp(-0.22, -1.85, aK), 0, lerp(0.16, 0.55, aK));
    // B — stands on A's shoulders, hugging the pole
    sB.root.position.set(lerp(st.supBH.x, st.px + st.sign * 0.05, bM), 1.04 * bU, lerp(st.supBH.z, 0.37, bM));
    sB.root.rotation.y = lerp(st.sign * 0.45, Math.PI, bM);
    sB.hips.position.y = 0.72;
    sB.torso.rotation.set(lerp(-0.06, 0.06, bU), 0, Math.sin(timeAcc * 7) * 0.04 * bU);
    sB.head.rotation.set(-0.38, 0, 0);
    sB.armL.rotation.set(lerp(0, -1.5, bM), 0, lerp(-2.55, -0.32, bM));
    sB.armR.rotation.set(lerp(0, -1.5, bM), 0, lerp(2.55, 0.32, bM));
    const midB = bU > 0.05 && bU < 0.95 ? 1 : 0;
    sB.legL.rotation.set(midB ? -0.55 : -0.05, 0, -0.09);
    sB.legR.rotation.set(midB ? 0.35 : 0.05, 0, 0.09);
  }

  // Joined viewers' helper figures: cheer at the base; during the ladder
  // they ALL stack into the human tower itself (levels by join order)
  const STACK = [
    { dx: -0.78, y: 0, z: 0.60, lv: 0 }, { dx: -0.26, y: 0, z: 0.66, lv: 0 }, { dx: 0.26, y: 0, z: 0.66, lv: 0 }, { dx: 0.78, y: 0, z: 0.60, lv: 0 },
    { dx: -0.52, y: 1.04, z: 0.55, lv: 1 }, { dx: 0.0, y: 1.04, z: 0.68, lv: 1 }, { dx: 0.52, y: 1.04, z: 0.55, lv: 1 },
    { dx: -0.27, y: 2.35, z: 0.48, lv: 2 }, { dx: 0.27, y: 2.35, z: 0.48, lv: 2 },
    { dx: 0.0, y: 3.65, z: 0.44, lv: 3 }
  ];
  for (let ei = 0; ei < st.extras.length; ei++) {
    const ex = st.extras[ei], ep = ex.p;
    const bb2 = Math.abs(Math.sin(timeAcc * 5 + ex.ph));
    if (st.ladderT > 0 && lad.lp >= 0) {
      const sgK = function(a, b, x) { return Math.max(0, Math.min(1, (x - a) / (b - a))); };
      let k2 = sgK(0.10, 0.34, lad.lp) * (1 - sgK(0.86, 0.97, lad.lp));
      k2 = k2 * k2 * (3 - 2 * k2);
      const slot = STACK[Math.min(ei, STACK.length - 1)];
      const sx = st.px + slot.dx, sy = slot.y, sz = slot.z;
      ep.root.position.set(ex.hx + (sx - ex.hx) * k2, sy * k2, ex.hz + (sz - ex.hz) * k2);
      ep.root.rotation.y = Math.atan2(st.px - ep.root.position.x, -ep.root.position.z);
      if (slot.lv === 0) {
        // Ground level: crouched solid, arms up holding the level above
        ep.hips.position.y = 0.72 - 0.27 * k2;
        ep.torso.rotation.set(0.14 * k2, 0, 0);
        ep.head.rotation.set(-0.35, 0, 0);
        ep.armL.rotation.set(-0.3, 0, -2.3 - 0.4 * k2);
        ep.armR.rotation.set(-0.3, 0, 2.3 + 0.4 * k2);
        ep.legL.rotation.set(-1.80 * k2, 0, -0.45 * k2);
        ep.legR.rotation.set(-1.80 * k2, 0, 0.45 * k2);
      } else {
        // Upper levels: standing on shoulders, arms up supporting
        ep.hips.position.y = 0.72;
        ep.torso.rotation.set(0.05 * k2, 0, Math.sin(timeAcc * 7 + ex.ph) * 0.04 * k2);
        ep.head.rotation.set(-0.38, 0, 0);
        ep.armL.rotation.set(-0.3, 0, -2.35 - 0.35 * k2);
        ep.armR.rotation.set(-0.3, 0, 2.35 + 0.35 * k2);
        ep.legL.rotation.set(-0.14, 0, -0.10);
        ep.legR.rotation.set(0.10, 0, 0.10);
      }
    } else {
      ep.root.position.set(ex.hx, bb2 * 0.12, ex.hz);
      ep.root.rotation.y = st.sign * 0.3;
      ep.hips.position.y = 0.72;
      ep.torso.rotation.set(-0.05, Math.sin(timeAcc * 4 + ex.ph) * 0.1, 0);
      ep.head.rotation.set(-0.3, 0, 0);
      ep.armL.rotation.set(0, 0, -2.5 - bb2 * 0.35);
      ep.armR.rotation.set(0, 0, 2.5 + bb2 * 0.35);
      ep.legL.rotation.set(bb2 * 0.15, 0, -0.08);
      ep.legR.rotation.set(-bb2 * 0.15, 0, 0.08);
    }
  }
}

const game = {
  scene: scene,
  camera: camera,

  update: function(dt, S) {
    dt = Math.min(Math.max(dt || 0, 0), 0.05);
    timeAcc += dt;

    const hR = S && typeof S.hR === 'number' ? S.hR : 0;
    const hB = S && typeof S.hB === 'number' ? S.hB : 0;
    const running = !!(S && S.running);
    const over = !!(S && S.over);
    const winner = S && S.winner ? S.winner : null;

    updateSide(sides.red, hR, dt, running, over, winner);
    updateSide(sides.blue, hB, dt, running, over, winner);

    // Camera: pull in CLOSE on a fallen, dizzy climber — or on the gift
    // giver at the base just before he climbs the human ladder
    let focus = null;
    ['red', 'blue'].forEach(function(tk) {
      const s2 = sides[tk];
      if (s2.downedNow && (!focus || s2.fallT > focus.fallT)) focus = s2;
    });
    if (!focus) {
      ['red', 'blue'].forEach(function(tk) {
        const s2 = sides[tk];
        if (s2.ladderLpNow >= 0.06 && s2.ladderLpNow <= 0.42) focus = s2;
      });
    }
    if (focus) {
      camPosT.set(focus.px * 0.60, 2.7, 8.8);
      camLookT.set(focus.px, 1.15, 0);
    } else {
      camPosT.set(0, 6.5, 17);
      camLookT.set(0, 4.6, 0);
    }
    const ck = 1 - Math.exp(-dt * 3.0);
    camera.position.lerp(camPosT, ck);
    camLook.lerp(camLookT, ck);
    camera.lookAt(camLook);

    // Win confetti burst
    if (over && winner && (winner === 'red' || winner === 'blue')) {
      const wpx = POLE_X[winner];
      if (!winDone) {
        winDone = true;
        burstConfetti(wpx, 10.1, 46);
        winConfettiCD = 0.65;
      } else {
        winConfettiCD -= dt;
        if (winConfettiCD <= 0) {
          winConfettiCD = 0.85;
          burstConfetti(wpx, 10.1, 14);
        }
      }
    } else if (!over) {
      winDone = false;
    }

    // Banknote fan flutter
    for (let i = 0; i < billBase.length; i++) {
      const b = billBase[i];
      dummy.position.set(b.x, b.y, b.z);
      dummy.rotation.set(Math.sin(timeAcc * 3.8 + b.phase) * 0.18, 0, b.ang + Math.sin(timeAcc * 2.5 + b.phase) * 0.05);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      billInst.setMatrixAt(b.idx, dummy.matrix);
    }
    billInst.instanceMatrix.needsUpdate = true;

    // Crowd gentle bounce
    const crowdMult = over ? 1.8 : 1.0;
    for (let i = 0; i < CROWD_N; i++) {
      const cd = crowdData[i];
      const hop = Math.abs(Math.sin(timeAcc * cd.sp * crowdMult + cd.ph)) * (over ? 0.16 : 0.07);
      dummy.position.set(cd.x, cd.y + hop, cd.z);
      dummy.rotation.set(0, 0, Math.sin(timeAcc * 2.4 + cd.ph) * 0.06);
      dummy.scale.set(cd.sc, cd.sc, cd.sc);
      dummy.updateMatrix();
      crowdBody.setMatrixAt(i, dummy.matrix);
      dummy.position.set(cd.x, cd.y + 0.44 * cd.sc + hop, cd.z);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      crowdHead.setMatrixAt(i, dummy.matrix);
      const wv = Math.sin(timeAcc * cd.sp * crowdMult + cd.ph) * 0.28;
      dummy.position.set(cd.x - 0.20 * cd.sc, cd.y + 0.26 * cd.sc + hop, cd.z);
      dummy.rotation.set(0, 0, 0.6 + wv);
      dummy.updateMatrix();
      crowdArmL.setMatrixAt(i, dummy.matrix);
      dummy.position.set(cd.x + 0.20 * cd.sc, cd.y + 0.26 * cd.sc + hop, cd.z);
      dummy.rotation.set(0, 0, -0.6 + wv);
      dummy.updateMatrix();
      crowdArmR.setMatrixAt(i, dummy.matrix);
    }
    crowdBody.instanceMatrix.needsUpdate = true;
    crowdHead.instanceMatrix.needsUpdate = true;
    crowdArmL.instanceMatrix.needsUpdate = true;
    crowdArmR.instanceMatrix.needsUpdate = true;

    // Palm fronds breeze
    for (let i = 0; i < frondData.length; i++) {
      const fd = frondData[i];
      const sw = Math.sin(timeAcc * 1.9 + fd.ph) * 0.1;
      dummy.position.set(fd.x + Math.cos(fd.yaw) * 0.85, fd.y + 0.15, fd.z + Math.sin(fd.yaw) * 0.85);
      dummy.rotation.set(0, -fd.yaw, -1.25 + sw);
      dummy.scale.set(1, 1, 0.15);
      dummy.updateMatrix();
      frondInst.setMatrixAt(fd.idx, dummy.matrix);
    }
    frondInst.instanceMatrix.needsUpdate = true;

    // Pennants waving
    for (let i = 0; i < penData.length; i++) {
      const pd = penData[i];
      dummy.position.set(pd.x, pd.y, pd.z);
      dummy.rotation.set(Math.sin(timeAcc * 3.8 + pd.ph) * 0.34, Math.cos(timeAcc * 2.2 + pd.ph) * 0.16, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      penInst.setMatrixAt(pd.idx, dummy.matrix);
    }
    penInst.instanceMatrix.needsUpdate = true;

    // Update particles
    let pDirty = false;
    for (let i = 0; i < MAX_P; i++) {
      if (!pAct[i]) continue;
      pDirty = true;
      pLife[i] -= dt;
      if (pLife[i] <= 0) {
        pAct[i] = 0;
        dummy.position.set(0, -50, 0);
        dummy.scale.set(0.001, 0.001, 0.001);
        dummy.updateMatrix();
        partInst.setMatrixAt(i, dummy.matrix);
        continue;
      }
      pVy[i] -= pGrav[i] * dt;
      pX[i] += pVx[i] * dt;
      pY[i] += pVy[i] * dt;
      pZ[i] += pVz[i] * dt;
      const sc = Math.min(1, (pLife[i] / pMax[i]) * 2.2);
      dummy.position.set(pX[i], pY[i], pZ[i]);
      const sp = timeAcc * pSpin[i] + i;
      dummy.rotation.set(sp, sp * 0.7, sp * 0.4);
      dummy.scale.set(pSx[i] * sc, pSy[i] * sc, pSz[i] * sc);
      dummy.updateMatrix();
      partInst.setMatrixAt(i, dummy.matrix);
    }
    if (pDirty) partInst.instanceMatrix.needsUpdate = true;
  },

  onJoin: function(team) {
    const st = sides[team === 'blue' ? 'blue' : 'red'];
    st.cheerT = 0.7;
    // Every joined viewer gets a helper figure at the pole base (max 10 shown)
    if (st.extras.length < 10) {
      const idx = st.extras.length;
      const row = idx < 5 ? 0 : 1, colI = idx % 5;
      const person = makePerson(st.team, false);
      person.root.scale.setScalar(0.9);
      const hx = st.px + (colI - 2) * 0.44 + (row ? 0.22 : 0);
      const hz = row ? 1.52 : 1.06;
      person.root.position.set(hx, 0, hz);
      scene.add(person.root);
      st.extras.push({ p: person, hx: hx, hz: hz, ph: idx * 1.93 });
    }
    const col = st.team === 'red' ? 0xff5a5a : 0x5aa0ff;
    for (let i = 0; i < 6; i++) {
      spawnP(
        st.px + (Math.random() - 0.5) * 1.6,
        0.3 + Math.random() * 0.5,
        0.6 + (Math.random() - 0.5) * 0.5,
        (Math.random() - 0.5) * 1.2,
        1.4 + Math.random() * 1.2,
        (Math.random() - 0.5) * 0.8,
        0.55,
        i % 2 === 0 ? col : 0xffe066,
        0.75, 0.75, 0.75,
        2.2, 6
      );
    }
  },

  onLike: function(team) {
    const st = sides[team === 'blue' ? 'blue' : 'red'];
    st.cheerT = Math.max(st.cheerT, 0.45);
    st.tugT = Math.max(st.tugT, 0.25);
    const col = st.team === 'red' ? 0xff4d6a : 0x4da6ff;
    const cy = st.hSmooth * 8.45 + 1.2;
    for (let i = 0; i < 4; i++) {
      spawnP(
        st.px + (Math.random() - 0.5) * 0.6,
        cy,
        0.3 + (Math.random() - 0.5) * 0.3,
        (Math.random() - 0.5) * 1.1,
        1.6 + Math.random() * 1.2,
        (Math.random() - 0.5) * 0.6,
        0.5,
        col,
        0.7, 0.7, 0.7,
        1.8, 5
      );
    }
  },

  onGift: function(team, tier, name) {
    const tk = team === 'blue' ? 'blue' : 'red';
    const ok = tk === 'red' ? 'blue' : 'red';
    const st = sides[tk];
    const ost = sides[ok];
    st.cheerT = Math.max(st.cheerT, 0.9);
    if (name) { setNameLabel(st, name); st.labelT = Math.max(st.labelT, tier >= 3 ? 7.4 : 3.2); }

    if (tier === 1) {
      st.scrambleT = Math.max(st.scrambleT, 0.6);
      const col = tk === 'red' ? 0xff6247 : 0x47a0ff;
      for (let i = 0; i < 8; i++) {
        spawnP(
          st.px + (Math.random() - 0.5) * 0.6,
          st.hSmooth * 8.45 + 0.8,
          (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 1.8,
          1.6 + Math.random() * 1.6,
          (Math.random() - 0.5) * 1.4,
          0.55,
          i % 2 === 0 ? col : 0xffe266,
          0.8, 0.8, 0.8,
          2.5, 7
        );
      }
    } else if (tier === 2) {
      // Grease attack on OTHER pole — climber slips and FALLS
      ost.greaseT = Math.max(ost.greaseT, 0.8);
      ost.fallFrom = Math.max(0, ost.hSmooth * 8.45 - ost.greaseDip);
      ost.fallT = 2.6;
      for (let i = 0; i < 14; i++) {
        spawnP(
          ost.px + (Math.random() - 0.5) * 0.5,
          ost.hSmooth * 8.45 + 1.0 + (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 0.5,
          (Math.random() - 0.5) * 2.2,
          0.8 + Math.random() * 1.8,
          (Math.random() - 0.5) * 2.2,
          0.65,
          i % 2 === 0 ? 0xf5f59c : 0xffffff,
          0.7, 1.05, 0.7,
          7.0, 5
        );
      }
    } else if (tier === 3) {
      // Human ladder: current climber comes down, the GIVER climbs,
      // ALL joined members stack up and boost him to the very top
      st.ladderFromY = Math.max(0, st.hSmooth * 8.45 - st.greaseDip);
      const nEx = st.extras.length;
      st.ladderTopY = nEx >= 10 ? 5.0 : nEx >= 8 ? 3.7 : nEx >= 5 ? 2.39 : 2.28;
      st.ladderT = 7.0;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        spawnP(
          st.px + Math.cos(a) * 0.6,
          st.hSmooth * 8.45 + 0.5,
          Math.sin(a) * 0.6,
          -Math.sin(a) * 1.8,
          2.6 + Math.random() * 1.8,
          Math.cos(a) * 1.8,
          0.85,
          i % 2 === 0 ? 0x54cc50 : 0xfff5b0,
          1.1, 0.65, 0.2,
          -0.4, 9
        );
      }
    } else {
      // Tier 4 lightning spiral climb
      st.lightningT = Math.max(st.lightningT, 1.4);
      st.scrambleT = Math.max(st.scrambleT, 1.4);
      st.flashT = 0.7;
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        spawnP(
          st.px + Math.cos(a) * 0.4,
          9.9,
          Math.sin(a) * 0.4,
          Math.cos(a) * 2.6,
          0.8 + Math.random() * 2.0,
          Math.sin(a) * 2.6,
          0.75,
          i % 2 === 0 ? 0xffd838 : 0xffffff,
          0.95, 0.95, 0.95,
          2.8, 10
        );
      }
    }
  },

  reset: function() {
    winDone = false;
    winConfettiCD = 0;
    ['red', 'blue'].forEach(function(tk) {
      const st = sides[tk];
      resetBag(st);
      st.slideToBase = st.hSmooth > 0.01;
      st.prevH = 0;
      st.climbVel = 0;
      st.scrambleT = 0;
      st.greaseT = 0;
      st.greaseDip = 0;
      st.windT = 0;
      st.lightningT = 0;
      st.flashT = 0;
      st.cheerT = 0;
      st.tugT = 0;
      st.fallT = 0;
      st.ladderT = 0;
      st.ladderFromY = 0;
      st.ladderTopY = 2.28;
      st.ladderLpNow = -1;
      st.downedNow = false;
      st.starGrp.visible = false;
      st.supA.root.position.set(st.supAH.x, 0, st.supAH.z);
      st.supB.root.position.set(st.supBH.x, 0, st.supBH.z);
      st.flashRing.visible = false;
      st.boltGlow.visible = false;
      st.climberPivot.rotation.y = st.baseYaw;
    });
    for (let i = 0; i < MAX_P; i++) {
      pAct[i] = 0;
      dummy.position.set(0, -50, 0);
      dummy.scale.set(0.001, 0.001, 0.001);
      dummy.updateMatrix();
      partInst.setMatrixAt(i, dummy.matrix);
    }
    partInst.instanceMatrix.needsUpdate = true;
  }
};

return game;

} };

<script>
(function(){
"use strict";
var CFG = {"id": "pole", "metric": "h", "guide": [["Gift 1–99", "တက်အား ဖြည့်"], ["Gift 100–499", "ချောဆီ ဆွဲချ — တက်သူ ပြုတ်ကျ"], ["Gift 500–999", "လူလှေကား — အပေါ်ဆုံးထိ တက်"], ["Gift 1000+", "မိုးကြိုး တက် — ထိပ်နား ခုန်တက်"]], "btn": ["ချောဆီဆွဲချ", "လူလှေကား"], "climb": "တိုင်ပေါ်တက်"};

});
// ---------- guide ----------
CFG.guide.forEach(function(g){ var d=document.createElement('div'); d.innerHTML='<b>'+g[0]+'</b> — '+g[1]; $('gRows').appendChild(d); });
$('gTog').addEventListener('click', function(e){ e.stopPropagation(); $('guide').classList.toggle('closed'); $('gTog').textContent = $('guide').classList.contains('closed') ? '▸' : '▾'; });
// ---------- state ----------
var S = { p:0, hpR:100, hpB:100, hR:0, hB:0, balR:100, balB:100, scoreR:0, scoreB:0, t:0, running:false, over:false, winner:null };
var M = { red:{members:0, gifts:0, power:0, names:[]}, blue:{members:0, gifts:0, power:0, names:[]} };
var round = 1, timeLeft = 90, goldUntil = {red:0, blue:0}, lastHit = {red:-9, blue:-9};
var game = null;
try { game = GAME3D[CFG.id].create(THREE); } catch(e){ showPop('Error', String(e).slice(0,80)); }
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
function resize(){ var w=innerWidth, h=innerHeight; renderer.setSize(w,h); if(game){ game.camera.aspect=w/h; game.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);
// ---------- helpers ----------
function tierOf(coins){ return coins>=1000?4 : coins>=500?3 : coins>=100?2 : 1; }
var GC = { red:{}, blue:{} };
var GIFT_EMOJI = [['rose','🌹'],['finger','🫰'],['heart','❤️'],['love','💗'],['crown','👑'],['lion','🦁'],['whale','🐳'],['rocket','🚀'],['car','🏎️'],['money','💸'],['star','⭐'],['tiktok','🎶'],['flower','🌸'],['diamond','💎'],['ring','💍'],['cake','🎂'],['beer','🍺'],['coffee','☕']];
function giftEmoji(name){ var s=(name||'').toLowerCase(); for (var i=0;i<GIFT_EMOJI.length;i++) if (s.indexOf(GIFT_EMOJI[i][0])>=0) return GIFT_EMOJI[i][1]; return '🎁'; }
function renderGifts(team){
  var box = $(team==='red' ? 'giftsR' : 'giftsB');
  var items = Object.keys(GC[team]).map(function(k){ return [k, GC[team][k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,4);
  box.innerHTML = '';
  items.forEach(function(it){ var d=document.createElement('div'); d.className='grow';
    d.innerHTML = '<span>'+giftEmoji(it[0])+'</span><span class="n"></span><span class="c">×'+num(it[1])+'</span>';
    d.querySelector('.n').textContent = it[0]; box.appendChild(d); });

}
// ---------- members: everyone in the LIVE is a viewer; join = team member (no limit) ----------
var MEMBERS = { red: [], blue: [] };
function mOther(team){ return team==='red' ? 'blue' : 'red'; }
function mHas(team, name){ return MEMBERS[team].indexOf(name) >= 0; }

function renderSide(team){ renderGifts(team); }
function showPop(big, sub, ms){ $('popBig').textContent=big; $('popSub').textContent=sub||''; var p=$('popup'); p.classList.add('show'); clearTimeout(showPop._t); showPop._t=setTimeout(function(){ p.classList.remove('show'); }, ms||2100); }
var FXC = ['#ffd54d','#ff5a8a','#4da3ff','#7dff8a','#ff9d2e','#ffffff'];
function burst(team, tier){
  var box = $('fx'); var n = [0,0,14,24,42][tier]; if (!n) return;

    var d = document.createElement('div'); d.className='cf';
    d.style.background = FXC[i % FXC.length];

    d.style.top = (innerHeight*0.16 + Math.random()*30) + 'px';

    var anim = d.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)', opacity:0.15 }
    ], { duration: 950+Math.random()*650, easing:'cubic-bezier(.2,.7,.3,1)' });
    (function(el, a){ a.onfinish = function(){ el.remove(); }; })(d, anim);
  }
  if (tier>=4){
    var f = $('flash'); f.style.borderColor = team==='red' ? '#ff4d7e' : '#3fa9ff';
    f.animate([{opacity:0},{opacity:0.85, offset:0.25},{opacity:0}], { duration: 900, easing:'ease-out' });
  }
}
function tick(txt){ var d=document.createElement('div'); d.textContent=txt; var box=$('ticker'); box.appendChild(d); while(box.children.length>4) box.removeChild(box.firstChild); setTimeout(function(){ d.style.opacity='0.35'; }, 6000); setTimeout(function(){ d.remove(); }, 9000); }
function num(n){ return String(n).replace(/\d/g, function(c){ return '၀၁၂၃၄၅၆၇၈၉'[+c]; }); }
// ---------- game numbers ----------
function applyGift(team, tier, name, giftName){
  var foe = team==='red' ? 'blue' : 'red';
  M[team].gifts++; M[team].power += tier;
  GC[team][giftName] = (GC[team][giftName]||0) + 1; renderGifts(team);
  if (game) game.onGift(team, tier, name);
  var feat = CFG.guide[tier-1][1];
  if (CFG.metric==='p'){ S.p += (team==='red'?1:-1) * [0,.10,.22,.40,.70][tier]; }
  else if (CFG.metric==='h'){ if(team==='red') S.hR=Math.min(1,S.hR+[0,.03,.07,.13,.22][tier]); else S.hB=Math.min(1,S.hB+[0,.03,.07,.13,.22][tier]);
    if (tier===2){ if(foe==='red') S.hR=Math.max(0,S.hR-.04); else S.hB=Math.max(0,S.hB-.04); } }
  else if (CFG.metric==='hp'){ var dmg=[0,4,9,16,30][tier]; if(foe==='red') S.hpR=Math.max(0,S.hpR-dmg); else S.hpB=Math.max(0,S.hpB-dmg); lastHit[foe]=S.t; }
  else if (CFG.metric==='bal'){ var bd=[0,6,13,22,40][tier]; if(foe==='red') S.balR=Math.max(0,S.balR-bd); else S.balB=Math.max(0,S.balB-bd); lastHit[foe]=S.t; }
  else if (CFG.metric==='goal'){ S.p += (team==='red'?1:-1) * [0,.12,.26,.45,.85][tier]; if(tier===3) goldUntil[team]=S.t+5; if(tier===4 && Math.abs(S.p)>0.55){ goal(team); } }
  showPop(tn(team)+' — '+feat, name+' က '+giftName+' ပို့တယ်', tier>=4 ? 2600 : tier>=3 ? 2100 : 1500);
  burst(team, tier);
  tick('🎁 '+name+' → '+tn(team)+' · '+feat);
  syncHud();
}
function goal(team){ if(team==='red') S.scoreR++; else S.scoreB++; showPop('ဂိုး!!!', tn(team)+' ဂိုး ဝင်တယ်'); S.p=0; if(game) game.reset(); syncHud(); }
function winCheck(){
  if (S.over) return;
  var w=null;
  if (CFG.metric==='p' && Math.abs(S.p)>=1) w = S.p>0?'red':'blue';
  else if (CFG.metric==='h'){ if(S.hR>=1) w='red'; else if(S.hB>=1) w='blue'; }
  else if (CFG.metric==='hp'){ if(S.hpR<=0) w='blue'; else if(S.hpB<=0) w='red'; }
  else if (CFG.metric==='bal'){ if(S.balR<=0) w='blue'; else if(S.balB<=0) w='red'; }
  else if (CFG.metric==='goal' && timeLeft<=0){ w = S.scoreR===S.scoreB ? null : (S.scoreR>S.scoreB?'red':'blue'); if(!w){ timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); return; } }
  if (w) endRound(w);
}
function endRound(w){ S.over=true; S.winner=w; S.running=false; if(w==='red') M.red.wins=(M.red.wins||0)+1; else M.blue.wins=(M.blue.wins||0)+1;
  showPop('🏆 '+tn(w)+' အနိုင်ရ!', 'ပွဲစဉ် '+num(round)+' ပြီးပြီ — နောက် ပွဲစဉ် မကြာမီ');
  setTimeout(newRound, 6000); syncHud(); }
function newRound(){ round++;
  S.p=0; S.hpR=S.hpB=100; S.hR=S.hB=0; S.balR=S.balB=100; S.t=0; S.over=false; S.winner=null; S.running=true; timeLeft=90; if(game) game.reset(); $('rd').textContent=num(round); syncHud(); }
function syncHud(){
  $('pR').textContent=num(MEMBERS.red.length); $('pB').textContent=num(MEMBERS.blue.length);
  $('gR').textContent=num(M.red.gifts); $('gB').textContent=num(M.blue.gifts);
  $('sc').textContent = num(M.red.wins||0)+' — '+num(M.blue.wins||0);
  var pctR=50, pctB=50;

  else if (CFG.metric==='hp'){ pctR=S.hpR; pctB=S.hpB; }

  else if (CFG.metric==='goal'){ pctR=50+S.p*50; pctB=100-pctR; $('sc').textContent=num(S.scoreR)+' — '+num(S.scoreB); }
  $('bR').style.width=pctR+'%'; $('bB').style.width=pctB+'%';
  var vsR = pctR;
  if (CFG.metric!=='p' && CFG.metric!=='goal'){ var tot = pctR+pctB; vsR = tot>0 ? pctR/tot*100 : 50; }
  $('vsR').style.width=vsR+'%'; $('vsB').style.width=(100-vsR)+'%';
  $('vsL').textContent=num(Math.round(vsR))+'%'; $('vsRp').textContent=num(Math.round(100-vsR))+'%';
}
// ---------- events ----------
function onEvent(ev){
  if (!ev || !ev.kind) return;
  var team = ev.team==='blue' ? 'blue' : 'red';
  if (ev.kind==='join'){ var jn = ev.name||'Viewer'; var jo = mOther(team); var was = mHas(team, jn);
    mAdd(team, jn);
    if (!was) tick('👋 '+jn+' → '+tn(team)+' ဝင်ပြီ');
    if(game) game.onJoin(team); renderSide(team); renderSide(jo); }
  else if (ev.kind==='gift'){ var gn = ev.name||'Viewer';
    if (!mHas(team, gn)){ mAdd(team, gn); renderSide(mOther(team)); }
    renderSide(team);
    applyGift(team, tierOf(ev.coins||1), gn, ev.gift||'Gift'); }
  else if (ev.kind==='like'){ if(game) game.onLike(team); var tr = (M.red.power<M.blue.power)?'red':(M.blue.power<M.red.power?'blue':null); if(tr && CFG.metric==='p') S.p += (tr==='red'?1:-1)*0.02; }
  else if (ev.kind==='chat'){ tick('💬 '+ev.name+': '+(ev.text||'').slice(0,40)); }
  syncHud();
}
addEventListener('message', function(e){ var d=e.data; if(d && d.nlo===1) onEvent(d); });
if (parent && parent!==window) parent.postMessage({nlo:1, kind:'ready', game:CFG.id}, '*');
// ---------- demo (standalone debug) ----------
if (window.parent===window){
  document.body.classList.add('standalone');
  $('demoR').classList.add('show'); $('demoB').classList.add('show');
  var names=['Aung Aung','May May','Ko Ko','Thiri','Zaw Zaw','Nilar'];
  var demoDefs=[
   ['demoR','Join',function(){ onEvent({kind:'join',team:'red',name:names[Math.random()*6|0]}); }],
   ['demoB','Join',function(){ onEvent({kind:'join',team:'blue',name:names[Math.random()*6|0]}); }]
  ];
  if (CFG.climb){
    demoDefs.push(['demoR',CFG.climb,function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Heart',coins:99}); }]);
    demoDefs.push(['demoB',CFG.climb,function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Heart',coins:99}); }]);
  }
  demoDefs.push(['demoR',CFG.btn[0],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoR',CFG.btn[1],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.push(['demoB',CFG.btn[0],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoB',CFG.btn[1],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.forEach(function(b){ var btn=document.createElement('button'); btn.textContent=b[1]; btn.addEventListener('click', b[2]); $(b[0]).appendChild(btn); });
}
// ---------- loop ----------
S.running = true;
var last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  if (S.running && !S.over){
    S.t += dt; timeLeft -= dt;
    if (CFG.metric==='bal'){ ['red','blue'].forEach(function(tm){ var k=tm==='red'?'balR':'balB'; if (S.t-lastHit[tm]>2.5) S[k]=Math.min(100, S[k]+dt*2.2); }); }
    if (timeLeft<=0 && CFG.metric!=='goal'){ var w=null;
      if(CFG.metric==='p') w = S.p===0?null:(S.p>0?'red':'blue');
      else if(CFG.metric==='h') w = S.hR===S.hB?null:(S.hR>S.hB?'red':'blue');
      else if(CFG.metric==='hp') w = S.hpR===S.hpB?null:(S.hpR>S.hpB?'red':'blue');
      else if(CFG.metric==='bal') w = S.balR===S.balB?null:(S.balR>S.balB?'red':'blue');
      if (w) endRound(w); else { timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); }
    }
    if (timeLeft<=0 && CFG.metric==='goal') winCheck();
    winCheck();
    var mm = Math.max(0, Math.ceil(timeLeft)); $('tm').textContent = Math.floor(mm/60)+':'+('0'+(mm%60)).slice(-2);
    if ((frame._s||0) < S.t-0.25){ frame._s = S.t; syncHud(); }
  }
  if (game){ game.update(dt, S); renderer.render(game.scene, game.camera); }
}
resize(); applyNames(); syncHud(); requestAnimationFrame(frame);
})();
</script>
