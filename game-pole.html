<script src="three.min.js"></script>
<script>window.GAME3D = {};</script>
<script>
/* Greased pole climb — 2D side view (user-supplied design, 2026-11-28).
   Drawn on an offscreen 2D canvas (450x800 logical, 2x backing) shown via a
   CanvasTexture quad, so the standard NLO wrapper works unchanged.
   Heights live in the wrapper state S (hR/hB, 0..1 of a 30ft pole); this
   module eases a display height toward them and plays the scenes:
   T1 climb, T2 grease (foe slips), T3 HUMAN LADDER (members stack at the
   base, the giver climbs the tower onto the pole), T4 lightning climb.
   Camera follows the leader up the pole, like the source game. */
GAME3D['pole'] = { create: function(THREE) {
  var T = THREE;
  var LW = 450, LH = 800, DPR = 2;
  var cv = document.createElement('canvas');
  cv.width = LW * DPR; cv.height = LH * DPR;
  var ctx = cv.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var viewW = LW, viewH = LH;

  var tex = new T.CanvasTexture(cv);
  if ('colorSpace' in tex && T.SRGBColorSpace) tex.colorSpace = T.SRGBColorSpace;
  tex.generateMipmaps = false;
  tex.minFilter = T.LinearFilter;
  var scene = new T.Scene();
  var camera = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  scene.add(new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial({ map: tex })));

  var POLE_FT = 30;
  var OIL_ZONES = [ {start:6.0,end:9.2}, {start:13.0,end:16.5}, {start:20.0,end:23.2}, {start:25.5,end:28.2} ];
  var MYA = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
  function myaNum(n) { return String(n).replace(/\d/g, function(c){ return MYA[+c]; }); }
  function inOil(ft) { for (var i=0;i<OIL_ZONES.length;i++) if (ft>=OIL_ZONES[i].start && ft<=OIL_ZONES[i].end) return true; return false; }

  var G = {
    time: 0, cameraFt: 0, crowdExcitement: 0,
    oilDrops: [], sparks: [], popups: [], confetti: [],
    crowd: [], birds: [],
    flagColors: ['#ef4444','#facc15','#3b82f6','#22c55e','#ffffff','#f97316'],
    joins: { red: 0, blue: 0 }, overPlayed: false
  };
  (function initScenery() {
    var shirts = ['#ffffff','#fef08a','#bae6fd','#fbcfe8','#bbf7d0','#fed7aa','#e2e8f0'];
    var longyis = ['#1e3a5f','#7c2d12','#14532d','#581c87','#881337','#334155','#0f766e'];
    for (var i = 0; i < 24; i++) G.crowd.push({ xNorm: (i+0.5)/24 + (Math.random()-0.5)*0.02, scale: 0.8+Math.random()*0.28, phase: Math.random()*Math.PI*2, shirt: shirts[i%shirts.length], longyi: longyis[(i*3)%longyis.length], cheering: Math.random() > 0.45 });
    for (var j = 0; j < 6; j++) G.birds.push({ xNorm: Math.random(), ft: 14+Math.random()*17, speed: 0.025+Math.random()*0.025, dir: j%2===0?1:-1, wingPhase: Math.random()*Math.PI*2, size: 0.75+Math.random()*0.45 });
  })();

  function createClimber(team, facing) {
    return {
      team: team, facing: facing,
      dispFt: 0, climbPose: -0.7, targetPose: -0.7, strokePulse: 0,
      slipStretch: 0, slipping: false, strokeT: 0,
      tagName: '', tagUntil: 0,
      ladder: null,        // active human-ladder sequence state
      boltT: 0,            // lightning climb timer
      won: false, lostSlide: false
    };
  }
  var L = createClimber('red', 1);    // left pole, climber on its left side
  var R = createClimber('blue', -1);  // right pole, climber on its right side
  function climber(team) { return team === 'red' ? L : R; }
  function foeOf(c) { return c === L ? R : L; }

  function metrics() {
    var s = Math.max(0.7, Math.min(viewW / 410, 1.32));
    var pxPerFt = 62;
    var centerX = viewW * 0.5;
    var spread = Math.min(viewW * 0.2, 82 * s);
    return { s: s, pxPerFt: pxPerFt, centerX: centerX, p1X: centerX - spread, p2X: centerX + spread, baseY: viewH * 0.77 };
  }
  function poleXOf(c, m) { return c === L ? m.p1X : m.p2X; }
  function ftY(ft, m) { return m.baseY - (ft - G.cameraFt) * m.pxPerFt; }

  /* ---------------- particles & popups ---------------- */
  function spawnOil(x, ft, facing, n) {
    for (var i = 0; i < (n||4); i++) G.oilDrops.push({ x: x - facing*(6+Math.random()*14), ft: ft + (Math.random()-0.3)*0.5, vx: -facing*(25+Math.random()*55), vFt: 1.2+Math.random()*2.4, size: 2.8+Math.random()*3.4, life: 0.55+Math.random()*0.4 });
  }
  function spawnSparks(x, ft, n) {
    for (var i = 0; i < (n||6); i++) G.sparks.push({ x: x + (Math.random()-0.5)*36, ft: ft + (Math.random()-0.5)*1.6, vx: (Math.random()-0.5)*90, vFt: (Math.random()-0.5)*3, life: 0.3+Math.random()*0.3, maxLife: 0.6 });
  }
  function spawnPopup(x, ft, text, color, stroke) {
    G.popups.push({ x: x, ft: ft, text: text, color: color||'#fef08a', stroke: stroke||'#78350f', life: 0.95, maxLife: 0.95 });
    if (G.popups.length > 6) G.popups.shift();
  }
  function spawnConfetti() {
    var colors = ['#ef4444','#facc15','#3b82f6','#22c55e','#f97316','#ec4899','#ffffff'];
    for (var i = 0; i < 95; i++) G.confetti.push({ x: Math.random()*viewW, y: -20 - Math.random()*viewH*0.4, vx: (Math.random()-0.5)*36, vy: 55+Math.random()*85, size: 5+Math.random()*6, rot: Math.random()*Math.PI*2, rotVel: (Math.random()-0.5)*7, color: colors[i%colors.length], life: 3.4+Math.random()*1.6 });
  }

  /* ---------------- human ladder (T3) ---------------- */
  // Tower levels (figure counts) by joined members: base row, then up.
  function ladderLevels(team) {
    var n = Math.max(3, Math.min(9, G.joins[team] + 3)); // giver + members, at least a small tower
    if (n >= 8) return [4, 3, 2];
    if (n >= 6) return [3, 2, 1];
    return [3, 2];
  }
  function startLadder(c, name) {
    var levels = ladderLevels(c.team);
    var rows = levels.length;
    c.ladder = { t: 0, levels: levels, rows: rows, fromFt: c.dispFt, targetFt: 0, giver: name || '' };
    G.crowdExcitement = 1.0;
  }
  // Tower top height in ft for a ladder with `rows` rows (one row ≈ one
  // figure standing on the shoulders below ≈ 1.03 ft at stage scale)
  var ROW_FT = 1.03;
  function towerFt(rows) { return rows * ROW_FT; }

  function updateClimber(c, dt, S) {
    var target = (c.team === 'red' ? S.hR : S.hB) * POLE_FT;
    if (c.strokePulse > 0) c.strokePulse = Math.max(0, c.strokePulse - dt * 5.5);
    c.climbPose += (c.targetPose - c.climbPose) * Math.min(1, dt * 16);
    if (c.boltT > 0) c.boltT = Math.max(0, c.boltT - dt);

    if (c.ladder) {
      var ld = c.ladder;
      ld.t += dt;
      ld.targetFt = target;
      var twFt = Math.min(target, towerFt(ld.rows)); // tower top (giver steps to pole there)
      function ease(k) { return k * k * (3 - 2 * k); }
      // phases: 0-0.7 slide down to base · 0.7-1.6 tower forms · 1.6-3.0 climb tower ·
      //         3.0-3.8 step onto pole + fast climb to target · scatter 3.4-4.2
      if (ld.t < 0.7) {
        c.dispFt = ld.fromFt * Math.max(0, 1 - ld.t / 0.7);
        c.slipping = c.dispFt > 0.2;
      } else if (ld.t < 1.6) {
        c.dispFt = 0;
        c.slipping = false;
      } else if (ld.t < 3.0) {
        c.dispFt = twFt * ease((ld.t - 1.6) / 1.4);
        c.slipping = false;
        c.strokeT -= dt;
        if (c.strokeT <= 0) { c.targetPose = c.targetPose > 0 ? -0.85 : 0.85; c.strokePulse = 1; c.strokeT = 0.22; }
      } else if (ld.t < 3.8) {
        c.dispFt = twFt + (target - twFt) * ease((ld.t - 3.0) / 0.8);
        c.strokeT -= dt;
        if (c.strokeT <= 0) { c.targetPose = c.targetPose > 0 ? -0.85 : 0.85; c.strokePulse = 1; c.strokeT = 0.16; }
      } else if (ld.t >= 4.2) {
        c.ladder = null;
        c.dispFt = target;
      }
      var st2 = c.slipping ? 1 : 0;
      c.slipStretch += (st2 - c.slipStretch) * Math.min(1, dt * 10);
      return;
    }

    var diff = target - c.dispFt;
    if (diff > 0.02) {
      // climbing up: speed by mode (lightning = very fast)
      var speed = c.boltT > 0 ? 16 : 5.2;
      c.dispFt = Math.min(target, c.dispFt + speed * dt);
      c.strokeT -= dt;
      if (c.strokeT <= 0) { c.targetPose = c.targetPose > 0 ? -0.85 : 0.85; c.strokePulse = 1; c.strokeT = c.boltT > 0 ? 0.09 : 0.19; }
      c.slipping = false;
      if (c.boltT > 0 && Math.random() < dt * 30) { var mm = metrics(); spawnSparks(poleXOf(c, mm), c.dispFt + 1, 3); }
    } else if (diff < -0.02) {
      // grease slip down
      c.dispFt = Math.max(target, c.dispFt - 7.5 * dt);
      c.slipping = true;
      if (Math.random() < dt * 10) { var m2 = metrics(); spawnOil(poleXOf(c, m2), c.dispFt + 0.3, c.facing, 1); }
    } else {
      c.slipping = false;
      // idle life: tiny sway; in an oil zone a slow nervous slide-wobble
      if (inOil(c.dispFt) && c.dispFt > 0.4) c.dispFt += Math.sin(G.time * 2.2 + (c === L ? 0 : 2)) * 0.12 * dt;
    }
    var targetStretch = c.slipping ? 1 : 0;
    c.slipStretch += (targetStretch - c.slipStretch) * Math.min(1, dt * 10);
  }

  function updateParticles(dt) {
    var i;
    for (i = G.oilDrops.length - 1; i >= 0; i--) { var d = G.oilDrops[i]; d.life -= dt; if (d.life <= 0) { G.oilDrops.splice(i, 1); continue; } d.vFt -= 11 * dt; d.x += d.vx * dt; d.ft += d.vFt * dt; }
    for (i = G.sparks.length - 1; i >= 0; i--) { var sp = G.sparks[i]; sp.life -= dt; if (sp.life <= 0) { G.sparks.splice(i, 1); continue; } sp.x += sp.vx * dt; sp.ft += sp.vFt * dt; }
    for (i = G.popups.length - 1; i >= 0; i--) { var p = G.popups[i]; p.life -= dt; if (p.life <= 0) { G.popups.splice(i, 1); continue; } p.ft += 1.6 * dt; }

  /* small chibi figure (helpers / tower members) in team colours */

  function drawHelpers(c, m) {

    var poleX = poleXOf(c, m), groundY = ftY(0, m);

      x = poleX + (i - (n - 1) / 2) * 24 * m.s;

  function drawTower(c, m) {

  /* side-profile climber, two passes (far limbs behind pole, rest in front) */
  function poseOf(c, s) {

    return {
      hipX: (-26 - stretch * 4) * s, hipY: (-24 + stretch * 14 - pulse * 3) * s,

      else if (t >= 1.6 && t < 3.0) xOff = -c.facing * 17 * m.s;

    ctx.fillStyle = '#d99a6c';
    ctx.beginPath(); ctx.arc(hx, hy, 13.5 * s, 0, Math.PI * 2); ctx.fill();

    if (c.slipping || c.lostSlide) {
      ctx.beginPath();
      ctx.moveTo(hx + 3 * s, hy - 4 * s); ctx.lineTo(hx + 8 * s, hy + 1 * s);
      ctx.moveTo(hx + 8 * s, hy - 4 * s); ctx.lineTo(hx + 3 * s, hy + 1 * s); ctx.stroke();
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath(); ctx.arc(hx + 7 * s, hy + 7 * s, 3.2 * s, 0, Math.PI * 2); ctx.fill();
    } else if (c.won) {
      ctx.beginPath(); ctx.arc(hx + 5 * s, hy - 1 * s, 2.2 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + 5 * s, hy + 3 * s, 4.4 * s, 0.1, Math.PI * 0.9); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(hx + 5 * s, hy - 1 * s, 2.2 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 2 * s, hy - 6 * s); ctx.lineTo(hx + 9 * s, hy - 4 * s); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + 6 * s, hy + 5 * s, 3.4 * s, 0, Math.PI); ctx.stroke();
    }
    // near arm to pole
    ctx.strokeStyle = '#d99a6c'; ctx.lineWidth = 8.5 * s;
    ctx.beginPath(); ctx.moveTo(P.shX, P.shY); ctx.lineTo(-1 * s, P.nearHandY); ctx.stroke();
    // lightning bolts while zipping
    if (c.boltT > 0) {
      ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3 * s;
      for (var i = 0; i < 3; i++) {
        var bx = (Math.random() - 0.5) * 54 * s, by = -40 * s + i * 34 * s;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 9 * s, by + 12 * s); ctx.lineTo(bx + 2 * s, by + 13 * s); ctx.lineTo(bx + 11 * s, by + 26 * s); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBadge(c, m) {
    var p = climberXY(c, m);
    if (p.y < 40 || p.y > viewH + 40) return;
    var poleX = poleXOf(c, m);
    var x = poleX + c.facing * 52 * m.s, y = p.y - 6 * m.s;
    var txt = '▲ ' + myaNum(Math.round(c.dispFt)) + ' ပေ';
    ctx.save();
    ctx.font = '800 ' + Math.round(12.5 * m.s) + 'px "Noto Sans Myanmar", sans-serif';
    var w = ctx.measureText(txt).width + 16 * m.s, h = 20 * m.s;
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.strokeStyle = c.team === 'red' ? '#dc2626' : '#2563eb'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y + 1);
    ctx.restore();
  }
  function drawTag(c, m) {
    if (!c.tagName || G.time > c.tagUntil) return;
    var p = climberXY(c, m);
    var x = p.x - c.facing * 16 * m.s, y = p.y - 118 * m.s;
    if (y < 16) y = 16;
    ctx.save();
    ctx.font = '700 ' + Math.round(13 * m.s) + 'px "Noto Sans Myanmar", system-ui, sans-serif';
    var w = ctx.measureText(c.tagName).width + 18 * m.s, h = 21 * m.s;
    ctx.fillStyle = 'rgba(10,12,24,0.72)';
    ctx.strokeStyle = c.team === 'red' ? '#ff4d7e' : '#3fa9ff'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.tagName, x, y + 1);
    ctx.restore();
  }

  function drawEffects(m) {
    G.oilDrops.forEach(function(d) {
      ctx.fillStyle = 'rgba(250,204,21,0.9)';
      ctx.beginPath(); ctx.arc(d.x, ftY(d.ft, m), d.size * m.s * 0.6, 0, Math.PI * 2); ctx.fill();
    });
    G.sparks.forEach(function(sp) {
      ctx.fillStyle = 'rgba(253,224,71,' + Math.max(0, sp.life / sp.maxLife) + ')';
      ctx.fillRect(sp.x, ftY(sp.ft, m), 5 * m.s, 2.4 * m.s);
    });
    G.popups.forEach(function(pop) {
      var t = 1 - pop.life / pop.maxLife;
      var scale = t < 0.18 ? 0.6 + (t / 0.18) * 0.55 : 1.05;
      ctx.save();
      ctx.translate(pop.x, ftY(pop.ft, m)); ctx.scale(scale, scale);
      ctx.globalAlpha = pop.life < 0.25 ? pop.life / 0.25 : 1;
      ctx.font = '800 ' + Math.round(19 * m.s) + 'px "Noto Sans Myanmar", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5 * m.s; ctx.strokeStyle = pop.stroke; ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color; ctx.fillText(pop.text, 0, 0);
      ctx.restore();
    });
    G.confetti.forEach(function(cf) {
      ctx.save(); ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
      ctx.fillStyle = cf.color; ctx.fillRect(-cf.size / 2, -cf.size / 4, cf.size, cf.size / 2);
      ctx.restore();
    });
  }

  function render() {
    var m = metrics();
    drawSky(m);
    drawGroundAndCrowd(m);
    drawBunting(m);
    drawHelpers(L, m); drawHelpers(R, m);
    drawTower(L, m); drawTower(R, m);
    drawClimberBack(L, m); drawPole(m.p1X, L, m, true); drawClimberFront(L, m);
    drawClimberBack(R, m); drawPole(m.p2X, R, m, false); drawClimberFront(R, m);
    drawBadge(L, m); drawBadge(R, m);
    drawTag(L, m); drawTag(R, m);
    drawEffects(m);
  }

  /* ---------------- wrapper interface ---------------- */
  function reset() {
    var jr = G.joins.red, jb = G.joins.blue;
    L = createClimber('red', 1); R = createClimber('blue', -1);
    G.joins.red = jr; G.joins.blue = jb;
    G.cameraFt = 0; G.oilDrops = []; G.sparks = []; G.popups = []; G.confetti = [];
    G.overPlayed = false;
  }

  function update(dt, S) {
    G.time += dt;
    if (S.over && !G.overPlayed) {
      G.overPlayed = true;
      var w = S.winner === 'red' ? L : R, l = S.winner === 'red' ? R : L;
      w.won = true; l.lostSlide = true;
      G.crowdExcitement = 1.0;
      spawnConfetti();
    }
    if (!S.over && G.overPlayed) G.overPlayed = false;
    [L, R].forEach(function(c) {
      if (c.lostSlide) {
        c.dispFt = Math.max(0, c.dispFt - 11 * dt);
        c.slipping = c.dispFt > 0.1;
        c.slipStretch += ((c.slipping ? 1 : 0) - c.slipStretch) * Math.min(1, dt * 10);
      } else {
        updateClimber(c, dt, S);
      }
    });
    var focus = Math.max(L.dispFt, R.dispFt);
    if (L.ladder) focus = L.dispFt; else if (R.ladder) focus = R.dispFt;
    var camTarget = Math.max(0, Math.min(22.2, focus - 6.8));
    var cd = camTarget - G.cameraFt;
    G.cameraFt += Math.max(-10 * dt, Math.min(10 * dt, cd));
    if (G.crowdExcitement > 0) G.crowdExcitement = Math.max(0, G.crowdExcitement - 0.6 * dt);
    updateParticles(dt);
    render();
    tex.needsUpdate = true;
  }

  return {
    scene: scene, camera: camera, update: update,
    onJoin: function(team) {
      G.joins[team] = Math.min(12, G.joins[team] + 1);
      G.crowdExcitement = Math.min(1, G.crowdExcitement + 0.4);
    },
    onGift: function(team, tier, name) {
      var c = climber(team), f = foeOf(c), m = metrics();
      c.tagName = name || ''; c.tagUntil = G.time + 1.9;
      if (tier === 2) {
        spawnOil(poleXOf(f, m), f.dispFt + 0.4, f.facing, 7);
        spawnPopup(poleXOf(f, m) - f.facing * 20 * m.s, f.dispFt + 3.4, 'ချောဆီ!', '#fde047', '#92400e');
      } else if (tier === 3) {
        startLadder(c, name);
      } else if (tier === 4) {
        c.boltT = 0.9;
        spawnPopup(poleXOf(c, m) - c.facing * 20 * m.s, c.dispFt + 3.4, 'မိုးကြိုး!', '#fde047', '#1e293b');
      }
    },
    onLike: function(team) { G.crowdExcitement = Math.min(1, G.crowdExcitement + 0.25); },
    reset: reset
  };
} };

(function(){

function mAdd(team, name){ var o = mOther(team); var i = MEMBERS[o].indexOf(name); if (i>=0) MEMBERS[o].splice(i,1); if (!mHas(team, name)) MEMBERS[team].push(name); }

var FXC = ['#ffd54d','#ff5a8a','#4da3ff','#7dff8a','#ff9d2e','#ffffff'];

function tick(txt){ var d=document.createElement('div'); d.textContent=txt; var box=$('ticker'); box.appendChild(d); while(box.children.length>4) box.removeChild(box.firstChild); setTimeout(function(){ d.style.opacity='0.35'; }, 6000); setTimeout(function(){ d.remove(); }, 9000); }
function num(n){ return String(n).replace(/\d/g, function(c){ return '၀၁၂၃၄၅၆၇၈၉'[+c]; }); }
// ---------- game numbers ----------

}
function goal(team){ if(team==='red') S.scoreR++; else S.scoreB++; showPop('ဂိုး!!!', tn(team)+' ဂိုး ဝင်တယ်'); S.p=0; if(game) game.reset(); syncHud(); }
function winCheck(){

function endRound(w){ S.over=true; S.winner=w; S.running=false; if(w==='red') M.red.wins=(M.red.wins||0)+1; else M.blue.wins=(M.blue.wins||0)+1;
  showPop('🏆 '+tn(w)+' အနိုင်ရ!', 'ပွဲစဉ် '+num(round)+' ပြီးပြီ — နောက် ပွဲစဉ် မကြာမီ');

// ---------- events ----------
function onEvent(ev){
  if (!ev || !ev.kind) return;

  if (ev.kind==='join'){ var jn = ev.name||'Viewer'; var jo = mOther(team); var was = mHas(team, jn);

    renderSide(team);
    applyGift(team, tierOf(ev.coins||1), gn, ev.gift||'Gift'); }
  else if (ev.kind==='like'){ if(game) game.onLike(team); var tr = (M.red.power<M.blue.power)?'red':(M.blue.power<M.red.power?'blue':null); if(tr && CFG.metric==='p') S.p += (tr==='red'?1:-1)*0.02; }
  else if (ev.kind==='chat'){ tick('💬 '+ev.name+': '+(ev.text||'').slice(0,40)); }
  syncHud();
}
addEventListener('message', function(e){ var d=e.data; if(d && d.nlo===1) onEvent(d); });
if (parent && parent!==window) parent.postMessage({nlo:1, kind:'ready', game:CFG.id}, '*');
// ---------- demo (standalone debug) ----------
if (window.parent===window){
  document.body.classList.add('standalone');
  $('demoR').classList.add('show'); $('demoB').classList.add('show');
  var names=['Aung Aung','May May','Ko Ko','Thiri','Zaw Zaw','Nilar'];
  var demoDefs=[
   ['demoR','Join',function(){ onEvent({kind:'join',team:'red',name:names[Math.random()*6|0]}); }],
   ['demoB','Join',function(){ onEvent({kind:'join',team:'blue',name:names[Math.random()*6|0]}); }]
  ];
  if (CFG.climb){
    demoDefs.push(['demoR',CFG.climb,function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Heart',coins:99}); }]);
    demoDefs.push(['demoB',CFG.climb,function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Heart',coins:99}); }]);
  }
  demoDefs.push(['demoR',CFG.btn[0],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoR',CFG.btn[1],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.push(['demoB',CFG.btn[0],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoB',CFG.btn[1],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.forEach(function(b){ var btn=document.createElement('button'); btn.textContent=b[1]; btn.addEventListener('click', b[2]); $(b[0]).appendChild(btn); });
}
// ---------- loop ----------
S.running = true;
var last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  if (S.running && !S.over){
    S.t += dt; timeLeft -= dt;
    if (CFG.metric==='bal'){ ['red','blue'].forEach(function(tm){ var k=tm==='red'?'balR':'balB'; if (S.t-lastHit[tm]>2.5) S[k]=Math.min(100, S[k]+dt*2.2); }); }
    if (timeLeft<=0 && CFG.metric!=='goal'){ var w=null;
      if(CFG.metric==='p') w = S.p===0?null:(S.p>0?'red':'blue');
      else if(CFG.metric==='h') w = S.hR===S.hB?null:(S.hR>S.hB?'red':'blue');
      else if(CFG.metric==='hp') w = S.hpR===S.hpB?null:(S.hpR>S.hpB?'red':'blue');
      else if(CFG.metric==='bal') w = S.balR===S.balB?null:(S.balR>S.balB?'red':'blue');
      if (w) endRound(w); else { timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); }
    }
    if (timeLeft<=0 && CFG.metric==='goal') winCheck();
    winCheck();
    var mm = Math.max(0, Math.ceil(timeLeft)); $('tm').textContent = Math.floor(mm/60)+':'+('0'+(mm%60)).slice(-2);
    if ((frame._s||0) < S.t-0.25){ frame._s = S.t; syncHud(); }
  }
  if (game){ game.update(dt, S); renderer.render(game.scene, game.camera); }
}
resize(); applyNames(); syncHud(); requestAnimationFrame(frame);
var _cb=$('cleanBtn'),_cx=$('cleanExit');
function setClean(on){ document.body.classList.toggle('clean',on);
  if(on){ try{ var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
  else { try{ if(document.exitFullscreen)document.exitFullscreen(); }catch(e){} } }
if(_cb) _cb.onclick=function(){ setClean(true); };
if(_cx) _cx.onclick=function(){ setClean(false); };
if(/[?&](clean|live)(=|&|$)/.test(location.search)) document.body.classList.add('clean');
})();
