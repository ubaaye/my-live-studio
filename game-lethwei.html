<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>မြန်မာ့ လက်ဝှေ့ (LETHWEI) — NLO Live Studio</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#070a18;overflow:hidden;
 font-family:"Optimistic AI VF",system-ui,sans-serif;color:#eef1ff;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0} #stage canvas{display:block}
.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;z-index:5;pointer-events:none}
.team{flex:1;background:rgba(10,14,34,.72);border:1.5px solid #ffffff2a;border-radius:14px;padding:7px 10px;backdrop-filter:blur(6px)}
.team.red{border-color:#ff5a5a88}.team.blue{border-color:#4da3ff88}
.team .nm{font-weight:800;font-size:15px} .team .st{font-size:12px;opacity:.85;margin-top:1px}
.bar{height:6px;background:#ffffff22;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .25s}
.red .bar i{background:#ff5a5a}.blue .bar i{background:#4da3ff}
.mid{width:86px;text-align:center;background:rgba(10,14,34,.72);border:1.5px solid #ffd54d66;border-radius:14px;padding:7px 4px;backdrop-filter:blur(6px)}
.mid .tm{font-size:21px;font-weight:900;line-height:1} .mid .sc{font-size:13px;margin-top:2px} .mid .rd{font-size:11px;opacity:.8}
#ticker{position:fixed;left:10px;bottom:64px;z-index:5;font-size:12.5px;line-height:1.5;pointer-events:none;text-shadow:0 1px 3px #000}
#ticker div{background:rgba(5,8,20,.55);display:inline-block;padding:2px 8px;border-radius:8px;margin-top:3px}
#guide{position:fixed;left:8px;right:8px;bottom:8px;z-index:6;background:rgba(10,14,34,.82);border:1px solid #ffffff26;
 border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px);font-size:12.5px}
#guide .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;cursor:pointer}
#guide .rows{margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
#guide .rows div b{color:#ffd54d;font-weight:700}
#guide.closed .rows{display:none}
#howto{position:fixed;top:96px;left:0;right:0;text-align:center;z-index:4;pointer-events:none}
#howto span{background:rgba(5,8,20,.5);padding:3px 12px;border-radius:999px;font-size:13px}
#popup{position:fixed;top:38%;left:0;right:0;text-align:center;z-index:8;pointer-events:none;opacity:0;transform:scale(.9);transition:all .18s}
#popup.show{opacity:1;transform:scale(1)}
#popup .big{display:inline-block;background:linear-gradient(180deg,#ffd54d,#ff9d2e);color:#431c00;font-weight:900;
 font-size:21px;padding:10px 22px;border-radius:16px;box-shadow:0 8px 30px #000a}
#popup .sub{display:block;margin-top:7px;font-size:14px;color:#fff;text-shadow:0 1px 4px #000}
#demo{position:fixed;right:8px;top:110px;z-index:9;display:none;flex-direction:column;gap:5px}
#demo button{background:#1b2350;color:#fff;border:1px solid #ffffff33;border-radius:9px;padding:6px 9px;font-size:12px}
#demo.show{display:flex}
</style></head><body>
<div id="stage"></div>
<div class="hud">
  <div class="team red"><div class="nm">🔴 အနီ</div><div class="st"><span id="mR">0</span> ယောက် · 🎁 <span id="gR">0</span></div><div class="bar"><i id="bR" style="width:50%"></i></div></div>
  <div class="mid"><div class="tm" id="tm">1:30</div><div class="sc" id="sc">0 — 0</div><div class="rd">ပွဲစဉ် <span id="rd">1</span></div></div>
  <div class="team blue"><div class="nm">🔵 အပြာ</div><div class="st"><span id="mB">0</span> ယောက် · 🎁 <span id="gB">0</span></div><div class="bar"><i id="bB" style="width:50%"></i></div></div>
</div>
<div id="howto"><span>မန့် ၁ = အနီ · မန့် ၂ = အပြာ ဝင်ပါ</span></div>
<div id="ticker"></div>
<div id="popup"><span class="big" id="popBig"></span><span class="sub" id="popSub"></span></div>
<div id="guide"><div class="hd"><span>🎁 Gift လမ်းညွှန် — မြန်မာ့ လက်ဝှေ့ (LETHWEI)</span><span id="gTog">▾</span></div><div class="rows" id="gRows"></div></div>
<div id="demo"></div>
<script src="three.min.js"></script>
<script>window.GAME3D = {};</script>
<script>
GAME3D['lethwei'] = {
  create: function(THREE) {
    const T = THREE;
    const scene = new T.Scene();
    scene.background = new T.Color(0xf49e54);
    scene.fog = new T.FogExp2(0xf49e54, 0.035);

    const camera = new T.PerspectiveCamera(55, 0.5, 0.1, 100);
    camera.position.set(0, 2.5, 5.8);
    camera.lookAt(0, 0.9, 0);

    const hemiLight = new T.HemisphereLight(0xffe8c5, 0x553311, 0.85);
    scene.add(hemiLight);

    const dirLight = new T.DirectionalLight(0xffffff, 1.25);
    dirLight.position.set(4, 9, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 20;
    dirLight.shadow.camera.left = -4;
    dirLight.shadow.camera.right = 4;
    dirLight.shadow.camera.top = 5;
    dirLight.shadow.camera.bottom = -2;
    scene.add(dirLight);

    // Shared Materials & Geometries
    const matWood = new T.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.85 });
    const matBamboo = new T.MeshStandardMaterial({ color: 0xa88e44, roughness: 0.75 });
    const matSand = new T.MeshStandardMaterial({ color: 0xd9b26e, roughness: 0.9 });
    const matRope = new T.MeshStandardMaterial({ color: 0xc2a679, roughness: 0.9 });
    const matSkin = new T.MeshStandardMaterial({ color: 0xe09f67, roughness: 0.8 });
    const matThanaka = new T.MeshStandardMaterial({ color: 0xf4e285, roughness: 0.9 });
    const matWrap = new T.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 });
    const matHair = new T.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const matRed = new T.MeshStandardMaterial({ color: 0xd62828, roughness: 0.8 });
    const matBlue = new T.MeshStandardMaterial({ color: 0x00509d, roughness: 0.8 });
    const matGold = new T.MeshStandardMaterial({ color: 0xfca311, roughness: 0.6 });
    const matLeaf = new T.MeshStandardMaterial({ color: 0x2a9d8f, roughness: 0.8 });

    const geoBox = new T.BoxGeometry(1, 1, 1);
    const geoCyl = new T.CylinderGeometry(1, 1, 1, 12);
    const geoSphere = new T.SphereGeometry(1, 12, 12);

    // Environment: Sand Ring & Platform
    const ringGround = new T.Mesh(new T.CylinderGeometry(3.6, 4.0, 0.5, 24), matSand);
    ringGround.position.y = -0.25;
    ringGround.receiveShadow = true;
    scene.add(ringGround);

    const outerGround = new T.Mesh(new T.PlaneGeometry(30, 30), new T.MeshStandardMaterial({ color: 0xbf8b43, roughness: 0.95 }));
    outerGround.rotation.x = -Math.PI / 2;
    outerGround.position.y = -0.5;
    outerGround.receiveShadow = true;
    scene.add(outerGround);

    // Bamboo Posts & Ropes
    const posts = [];
    const postCoords = [[-2.3, -2.3], [2.3, -2.3], [2.3, 2.3], [-2.3, 2.3]];
    postCoords.forEach(([px, pz]) => {
      const post = new T.Mesh(geoCyl, matBamboo);
      post.scale.set(0.1, 2.2, 0.1);
      post.position.set(px, 1.1, pz);
      post.castShadow = true;
      scene.add(post);
      posts.push(post);
    });

    [0.6, 1.2].forEach(rh => {
      const ropePoints = [
        new T.Vector3(-2.3, rh, -2.3), new T.Vector3(2.3, rh, -2.3),
        new T.Vector3(2.3, rh, 2.3), new T.Vector3(-2.3, rh, 2.3),
        new T.Vector3(-2.3, rh, -2.3)
      ];
      const ropeGeo = new T.BufferGeometry().setFromPoints(ropePoints);
      const ropeLine = new T.Line(ropeGeo, new T.LineBasicMaterial({ color: 0xcc4433, linewidth: 3 }));
      scene.add(ropeLine);
    });

    // Background Stands & Crowd
    const crowdGroup = new T.Group();
    const crowdMembers = [];
    for (let row = 0; row < 3; row++) {
      const bench = new T.Mesh(geoBox, matWood);
      bench.scale.set(7.5, 0.15, 0.5);
      bench.position.set(0, 0.4 + row * 0.4, -3.2 - row * 0.5);
      scene.add(bench);

      const colors = [0xd62828, 0x00509d, 0xfca311, 0x2a9d8f, 0xe76f51, 0xffb703];
      for (let i = -6; i <= 6; i++) {
        const person = new T.Group();
        const matC = new T.MeshStandardMaterial({ color: colors[Math.abs(i + row * 3) % colors.length], roughness: 0.8 });
        const body = new T.Mesh(geoCyl, matC);
        body.scale.set(0.18, 0.45, 0.18);
        body.position.y = 0.225;
        person.add(body);

        const head = new T.Mesh(geoSphere, matSkin);
        head.scale.set(0.13, 0.13, 0.13);
        head.position.y = 0.52;
        person.add(head);

        const turban = new T.Mesh(new T.TorusGeometry(0.13, 0.04, 6, 12), matC);
        turban.rotation.x = Math.PI / 2;
        turban.position.y = 0.56;
        person.add(turban);

        person.position.set(i * 0.55 + (row % 2) * 0.2, 0.45 + row * 0.4, -3.2 - row * 0.5);
        crowdGroup.add(person);
        crowdMembers.push({ group: person, offset: Math.random() * 6.28, baseScaleY: 1 });
      }
    }
    scene.add(crowdGroup);

    // Palm Trees
    const makePalm = (x, z) => {
      const palm = new T.Group();
      const trunk = new T.Mesh(geoCyl, matWood);
      trunk.scale.set(0.15, 3.5, 0.15);
      trunk.position.y = 1.75;
      palm.add(trunk);
      for (let i = 0; i < 5; i++) {
        const leaf = new T.Mesh(new T.ConeGeometry(0.7, 2, 4), matLeaf);
        leaf.rotation.z = 1.2;
        leaf.rotation.y = (i * Math.PI * 2) / 5;
        leaf.position.set(0, 3.4, 0);
        palm.add(leaf);
      }
      palm.position.set(x, 0, z);
      scene.add(palm);
    };
    makePalm(-4.2, -2.2);
    makePalm(4.2, -2.2);

    // Banners & Flags
    const flagGroup = new T.Group();
    const flagGeo = new T.ConeGeometry(0.15, 0.3, 3);
    for (let i = -5; i <= 5; i++) {
      const flag = new T.Mesh(flagGeo, i % 2 === 0 ? matRed : matGold);
      flag.rotation.z = Math.PI;
      flag.position.set(i * 0.7, 3.0 - Math.cos(i * 0.3) * 0.25, -2.2);
      flagGroup.add(flag);
    }
    scene.add(flagGroup);

    // Articulated Fighter Creator
    function makeFighter(teamMat, darkMat) {
      const root = new T.Group();

      const bodyGroup = new T.Group();
      root.add(bodyGroup);

      // Torso & Shorts
      const torso = new T.Mesh(geoBox, matSkin);
      torso.scale.set(0.42, 0.5, 0.24);
      torso.position.y = 0.95;
      torso.castShadow = true;
      bodyGroup.add(torso);

      const shorts = new T.Mesh(geoCyl, teamMat);
      shorts.scale.set(0.25, 0.35, 0.22);
      shorts.position.y = 0.65;
      shorts.castShadow = true;
      bodyGroup.add(shorts);

      // Head + Thanaka
      const headPivot = new T.Group();
      headPivot.position.set(0, 1.25, 0);
      bodyGroup.add(headPivot);

      const head = new T.Mesh(geoSphere, matSkin);
      head.scale.set(0.17, 0.19, 0.17);
      head.castShadow = true;
      headPivot.add(head);

      const hair = new T.Mesh(geoSphere, matHair);
      hair.scale.set(0.175, 0.1, 0.175);
      hair.position.y = 0.08;
      headPivot.add(hair);

      [-0.14, 0.14].forEach(x => {
        const thanaka = new T.Mesh(geoCyl, matThanaka);
        thanaka.scale.set(0.04, 0.01, 0.04);
        thanaka.rotation.x = Math.PI / 2;
        thanaka.position.set(x, -0.02, 0.14);
        headPivot.add(thanaka);
      });

      // Arms
      function makeArm(isLeft) {
        const side = isLeft ? -1 : 1;
        const armPivot = new T.Group();
        armPivot.position.set(side * 0.26, 1.15, 0);

        const upper = new T.Mesh(geoCyl, matSkin);
        upper.scale.set(0.07, 0.3, 0.07);
        upper.position.y = -0.15;
        upper.castShadow = true;
        armPivot.add(upper);

        const forearmPivot = new T.Group();
        forearmPivot.position.y = -0.3;
        armPivot.add(forearmPivot);

        const lower = new T.Mesh(geoCyl, matSkin);
        lower.scale.set(0.065, 0.28, 0.065);
        lower.position.y = -0.14;
        lower.castShadow = true;
        forearmPivot.add(lower);

        const wrap = new T.Mesh(geoBox, matWrap);
        wrap.scale.set(0.1, 0.15, 0.1);
        wrap.position.y = -0.24;
        forearmPivot.add(wrap);

        bodyGroup.add(armPivot);
        return { armPivot, forearmPivot };
      }

      // Legs
      function makeLeg(isLeft) {
        const side = isLeft ? -1 : 1;
        const legPivot = new T.Group();
        legPivot.position.set(side * 0.13, 0.5, 0);

        const thigh = new T.Mesh(geoCyl, matSkin);
        thigh.scale.set(0.085, 0.32, 0.085);
        thigh.position.y = -0.16;
        thigh.castShadow = true;
        legPivot.add(thigh);

        const shinPivot = new T.Group();
        shinPivot.position.y = -0.32;
        legPivot.add(shinPivot);

        const shin = new T.Mesh(geoCyl, matSkin);
        shin.scale.set(0.075, 0.32, 0.075);
        shin.position.y = -0.16;
        shin.castShadow = true;
        shinPivot.add(shin);

        bodyGroup.add(legPivot);
        return { legPivot, shinPivot };
      }

      const armL = makeArm(true);
      const armR = makeArm(false);
      const legL = makeLeg(true);
      const legR = makeLeg(false);

      return {
        root, bodyGroup, headPivot,
        armL, armR, legL, legR,
        actionTimer: 0, actionType: null,
        hitTimer: 0, hitType: null,
        baseX: 0
      };
    }

    const fighterR = makeFighter(matRed, matRed);
    const fighterB = makeFighter(matBlue, matBlue);
    scene.add(fighterR.root);
    scene.add(fighterB.root);

    // Stars & Impact FX
    const starsGroup = new T.Group();
    for (let i = 0; i < 3; i++) {
      const star = new T.Mesh(geoBox, matGold);
      star.scale.set(0.08, 0.08, 0.08);
      starsGroup.add(star);
    }
    starsGroup.visible = false;
    scene.add(starsGroup);

    const dustPuffs = [];
    for (let i = 0; i < 6; i++) {
      const dust = new T.Mesh(geoSphere, new T.MeshStandardMaterial({ color: 0xe8d5b7, transparent: true, opacity: 0.8, roughness: 1.0 }));
      dust.visible = false;
      scene.add(dust);
      dustPuffs.push({ mesh: dust, t: 0, maxT: 0.4 });
    }

    function spawnDust(x, y, z) {
      const p = dustPuffs.find(d => !d.mesh.visible) || dustPuffs[0];
      p.mesh.position.set(x, y, z);
      p.mesh.scale.set(0.1, 0.1, 0.1);
      p.mesh.visible = true;
      p.t = 0.4;
    }

    let crowdEruptTimer = 0;

    function resetFighters() {
      fighterR.baseX = -1.2;
      fighterB.baseX = 1.2;
      [fighterR, fighterB].forEach((f, isB) => {
        f.root.position.set(f.baseX, 0, 0);
        f.root.rotation.set(0, isB ? -Math.PI / 2 : Math.PI / 2, 0);
        f.bodyGroup.position.set(0, 0, 0);
        f.bodyGroup.rotation.set(0, 0, 0);
        f.actionTimer = 0;
        f.actionType = null;
        f.hitTimer = 0;
        f.hitType = null;
      });
      starsGroup.visible = false;
    }
    resetFighters();

    function triggerAttack(attacker, defender, tier) {
      attacker.actionType = 'tier' + tier;
      attacker.actionTimer = 0.55;

      defender.hitType = 'tier' + tier;
      defender.hitTimer = 0.55;

      const impactX = (attacker.root.position.x + defender.root.position.x) * 0.5;
      spawnDust(impactX, 1.2, 0);

      if (tier >= 3) crowdEruptTimer = 1.5;
    }

    const tempV3 = new T.Vector3();

    return {
      scene: scene,
      camera: camera,

      onJoin: function(team) {
        const f = team === 'red' ? fighterR : fighterB;
        f.actionType = 'shadowbox';
        f.actionTimer = 0.8;
      },

      onGift: function(team, tier) {
        if (team === 'red') triggerAttack(fighterR, fighterB, tier);
        else triggerAttack(fighterB, fighterR, tier);
      },

      onLike: function(team) {
        const f = team === 'red' ? fighterR : fighterB;
        f.actionType = 'jab';
        f.actionTimer = 0.3;
      },

      reset: function() {
        resetFighters();
      },

      update: function(dt, S) {
        dt = Math.min(dt, 0.05);
        const time = S ? S.t : 0;

        // Map S axis position
        const pShift = (S && typeof S.p === 'number') ? S.p * 0.4 : 0;
        fighterR.baseX = -1.1 + pShift;
        fighterB.baseX = 1.1 + pShift;

        // Flag animation
        flagGroup.children.forEach((fl, idx) => {
          fl.rotation.x = Math.sin(time * 3 + idx) * 0.15;
        });

        // Crowd animation
        if (crowdEruptTimer > 0) crowdEruptTimer -= dt;
        const crowdAmp = crowdEruptTimer > 0 ? 0.22 : 0.05;
        crowdMembers.forEach(m => {
          m.group.position.y = (0.45 + Math.floor((m.group.position.z + 3.2) / -0.5) * -0.4) + Math.sin(time * 8 + m.offset) * crowdAmp;
        });

        // Dust particle update
        dustPuffs.forEach(p => {
          if (p.t > 0) {
            p.t -= dt;
            const progress = 1 - p.t / p.maxT;
            p.mesh.scale.setScalar(0.1 + progress * 0.6);
            p.mesh.material.opacity = 0.8 * (1 - progress);
            if (p.t <= 0) p.mesh.visible = false;
          }
        });

        // Fighter updates
        const hpR = S ? S.hpR : 100;
        const hpB = S ? S.hpB : 100;
        const isOver = S ? S.over : false;
        const winner = S ? S.winner : null;

        [fighterR, fighterB].forEach((f, idx) => {
          const isRed = idx === 0;
          const hp = isRed ? hpR : hpB;
          const opp = isRed ? fighterB : fighterR;

          // Action timers
          if (f.actionTimer > 0) f.actionTimer -= dt;
          if (f.hitTimer > 0) f.hitTimer -= dt;

          // Base Toe Bounce / Idle / Hurt wobble
          const bounceSpeed = hp < 40 ? 4 : 8;
          const bounceAmp = hp < 40 ? 0.02 : 0.04;
          const bounce = Math.sin(time * bounceSpeed) * bounceAmp;

          f.root.position.x = T.MathUtils.lerp(f.root.position.x, f.baseX, 0.1);
          f.root.position.y = Math.max(0, bounce);

          // Stance Guard default angles
          let gArmL = 0.8, gForeL = -1.4;
          let gArmR = 0.6, gForeR = -1.2;
          let gLegL = -0.1, gLegR = 0.1;
          let gHeadX = 0, gHeadY = 0;
          let gBodyZ = 0, gBodyX = 0;

          // Hurt State
          if (hp < 40 && hp > 0) {
            gBodyX = 0.2;
            gHeadX = -0.2;
            gArmL = 0.3; gArmR = 0.2;
          }

          // KO / Over State
          if (hp <= 0 || (isOver && winner && winner !== (isRed ? 'red' : 'blue'))) {
            f.bodyGroup.rotation.z = isRed ? -Math.PI / 2 : Math.PI / 2;
            f.bodyGroup.position.y = -0.6;
            gArmL = 0; gArmR = 0;

            // Stars over KO head
            if (hp <= 0) {
              starsGroup.visible = true;
              tempV3.set(f.root.position.x, 0.4, f.root.position.z);
              starsGroup.position.copy(tempV3);
              starsGroup.children.forEach((st, sIdx) => {
                const ang = time * 5 + (sIdx * Math.PI * 2) / 3;
                st.position.set(Math.cos(ang) * 0.3, 0, Math.sin(ang) * 0.3);
              });
            }
          } else if (isOver && winner === (isRed ? 'red' : 'blue')) {
            // Victory Pose
            gArmL = 2.8; gArmR = 2.8;
            gForeL = -0.2; gForeR = -0.2;
            f.bodyGroup.rotation.set(0, 0, 0);
            f.bodyGroup.position.set(0, 0, 0);
          } else {
            // Normal / Action blend
            f.bodyGroup.rotation.set(0, 0, 0);
            f.bodyGroup.position.set(0, 0, 0);

            // Shadowboxing
            if (f.actionType === 'shadowbox' && f.actionTimer > 0) {
              const phase = (0.8 - f.actionTimer) / 0.8;
              gArmR = 0.5 + Math.sin(phase * Math.PI * 4) * 0.8;
              gArmL = 0.5 + Math.cos(phase * Math.PI * 4) * 0.8;
            } else if (f.actionType === 'jab' && f.actionTimer > 0) {
              gArmR = 1.6; gForeR = -0.2;
              f.root.position.x += (isRed ? 0.3 : -0.3);
            } else if (f.actionType === 'tier1' && f.actionTimer > 0) {
              gArmR = 1.8; gForeR = -0.1;
              f.root.position.x += (isRed ? 0.5 : -0.5);
            } else if (f.actionType === 'tier2' && f.actionTimer > 0) {
              const p = 1 - f.actionTimer / 0.55;
              if (p < 0.5) { gArmL = 1.8; gForeL = -0.1; }
              else { gLegR = 1.4; gArmR = -0.5; }
              f.root.position.x += (isRed ? 0.6 : -0.6);
            } else if (f.actionType === 'tier3' && f.actionTimer > 0) {
              gLegR = 1.8; gBodyX = 0.3;
              f.root.position.y = 0.5;
              f.root.position.x += (isRed ? 0.7 : -0.7);
            } else if (f.actionType === 'tier4' && f.actionTimer > 0) {
              const p = 1 - f.actionTimer / 0.55;
              if (p < 0.3) { gArmR = -0.8; gBodyX = -0.4; }
              else { gArmR = 2.2; gForeR = 0; gBodyX = 0.5; f.root.position.x += (isRed ? 0.9 : -0.9); }
            }

            // Hit Reactions
            if (f.hitTimer > 0) {
              const p = 1 - f.hitTimer / 0.55;
              if (f.hitType === 'tier1' || f.hitType === 'jab') {
                gHeadX = -0.5;
              } else if (f.hitType === 'tier2') {
                gBodyX = -0.4; gHeadX = -0.6;
                f.root.position.x -= (isRed ? 0.4 : -0.4);
              } else if (f.hitType === 'tier3') {
                gLegL = 1.2; gLegR = 1.2; f.root.position.y = -0.3;
              } else if (f.hitType === 'tier4') {
                f.bodyGroup.rotation.x = -1.2;
                f.root.position.x -= (isRed ? 0.8 : -0.8);
              }
            }
          }

          // Apply rotations to bone pivots
          f.headPivot.rotation.x = gHeadX;
          f.headPivot.rotation.y = gHeadY;

          f.armL.armPivot.rotation.x = gArmL;
          f.armL.forearmPivot.rotation.x = gForeL;

          f.armR.armPivot.rotation.x = gArmR;
          f.armR.forearmPivot.rotation.x = gForeR;

          f.legL.legPivot.rotation.x = gLegL;
          f.legR.legPivot.rotation.x = gLegR;

          f.bodyGroup.rotation.x += gBodyX;
          f.bodyGroup.rotation.z += gBodyZ;
        });
      }
    };
  }
};

</script>
<script>
(function(){
"use strict";
var CFG = {"id": "lethwei", "metric": "hp", "guide": [["Gift 1–99", "လက်သီး တစ်ချက်"], ["Gift 100–499", "လက်သီး + ခြေကန်"], ["Gift 500–999", "ပျံ ဒူးကန်"], ["Gift 1000+", "KO လက်သီး"]]};
var $ = function(id){ return document.getElementById(id); };
// ---------- guide ----------
CFG.guide.forEach(function(g){ var d=document.createElement('div'); d.innerHTML='<b>'+g[0]+'</b> — '+g[1]; $('gRows').appendChild(d); });
$('guide').querySelector('.hd').addEventListener('click', function(){ $('guide').classList.toggle('closed'); $('gTog').textContent = $('guide').classList.contains('closed') ? '▸' : '▾'; });
// ---------- state ----------
var S = { p:0, hpR:100, hpB:100, hR:0, hB:0, balR:100, balB:100, scoreR:0, scoreB:0, t:0, running:false, over:false, winner:null };
var M = { red:{members:0, gifts:0, power:0, names:[]}, blue:{members:0, gifts:0, power:0, names:[]} };
var round = 1, timeLeft = 90, goldUntil = {red:0, blue:0}, lastHit = {red:-9, blue:-9};
var game = null;
try { game = GAME3D[CFG.id].create(THREE); } catch(e){ showPop('Error', String(e).slice(0,80)); }
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
function resize(){ var w=innerWidth, h=innerHeight; renderer.setSize(w,h); if(game){ game.camera.aspect=w/h; game.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);
// ---------- helpers ----------
function tierOf(coins){ return coins>=1000?4 : coins>=500?3 : coins>=100?2 : 1; }
function showPop(big, sub){ $('popBig').textContent=big; $('popSub').textContent=sub||''; var p=$('popup'); p.classList.add('show'); clearTimeout(showPop._t); showPop._t=setTimeout(function(){ p.classList.remove('show'); }, 2100); }
function tick(txt){ var d=document.createElement('div'); d.textContent=txt; var box=$('ticker'); box.appendChild(d); while(box.children.length>4) box.removeChild(box.firstChild); setTimeout(function(){ d.style.opacity='0.35'; }, 6000); setTimeout(function(){ d.remove(); }, 9000); }
function num(n){ return String(n).replace(/\d/g, function(c){ return '၀၁၂၃၄၅၆၇၈၉'[+c]; }); }
// ---------- game numbers ----------
function applyGift(team, tier, name, giftName){
  var foe = team==='red' ? 'blue' : 'red';
  M[team].gifts++; M[team].power += tier;
  if (game) game.onGift(team, tier);
  var feat = CFG.guide[tier-1][1];
  if (CFG.metric==='p'){ S.p += (team==='red'?1:-1) * [0,.10,.22,.40,.70][tier]; }
  else if (CFG.metric==='h'){ if(team==='red') S.hR=Math.min(1,S.hR+[0,.03,.07,.13,.22][tier]); else S.hB=Math.min(1,S.hB+[0,.03,.07,.13,.22][tier]);
    if (tier===2){ if(foe==='red') S.hR=Math.max(0,S.hR-.04); else S.hB=Math.max(0,S.hB-.04); } }
  else if (CFG.metric==='hp'){ var dmg=[0,4,9,16,30][tier]; if(foe==='red') S.hpR=Math.max(0,S.hpR-dmg); else S.hpB=Math.max(0,S.hpB-dmg); lastHit[foe]=S.t; }
  else if (CFG.metric==='bal'){ var bd=[0,6,13,22,40][tier]; if(foe==='red') S.balR=Math.max(0,S.balR-bd); else S.balB=Math.max(0,S.balB-bd); lastHit[foe]=S.t; }
  else if (CFG.metric==='goal'){ S.p += (team==='red'?1:-1) * [0,.12,.26,.45,.85][tier]; if(tier===3) goldUntil[team]=S.t+5; if(tier===4 && Math.abs(S.p)>0.55){ goal(team); } }
  if (tier>=3) showPop((team==='red'?'အနီ':'အပြာ')+' — '+feat, name+' က '+giftName+' ပို့တယ်');
  tick('🎁 '+name+' → '+(team==='red'?'အနီ':'အပြာ')+' · '+feat);
  syncHud();
}
function goal(team){ if(team==='red') S.scoreR++; else S.scoreB++; showPop('ဂိုး!!!', (team==='red'?'အနီ':'အပြာ')+' ဂိုး ဝင်တယ်'); S.p=0; if(game) game.reset(); syncHud(); }
function winCheck(){
  if (S.over) return;
  var w=null;
  if (CFG.metric==='p' && Math.abs(S.p)>=1) w = S.p>0?'red':'blue';
  else if (CFG.metric==='h'){ if(S.hR>=1) w='red'; else if(S.hB>=1) w='blue'; }
  else if (CFG.metric==='hp'){ if(S.hpR<=0) w='blue'; else if(S.hpB<=0) w='red'; }
  else if (CFG.metric==='bal'){ if(S.balR<=0) w='blue'; else if(S.balB<=0) w='red'; }
  else if (CFG.metric==='goal' && timeLeft<=0){ w = S.scoreR===S.scoreB ? null : (S.scoreR>S.scoreB?'red':'blue'); if(!w){ timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); return; } }
  if (w) endRound(w);
}
function endRound(w){ S.over=true; S.winner=w; S.running=false; if(w==='red') M.red.wins=(M.red.wins||0)+1; else M.blue.wins=(M.blue.wins||0)+1;
  showPop('🏆 '+(w==='red'?'အနီ':'အပြာ')+' အနိုင်ရ!', 'ပွဲစဉ် '+num(round)+' ပြီးပြီ — နောက် ပွဲစဉ် မကြာမီ');
  setTimeout(newRound, 6000); syncHud(); }
function newRound(){ round++; S.p=0; S.hpR=S.hpB=100; S.hR=S.hB=0; S.balR=S.balB=100; S.t=0; S.over=false; S.winner=null; S.running=true; timeLeft=90; if(game) game.reset(); $('rd').textContent=num(round); syncHud(); }
function syncHud(){
  $('mR').textContent=num(M.red.members); $('mB').textContent=num(M.blue.members);
  $('gR').textContent=num(M.red.gifts); $('gB').textContent=num(M.blue.gifts);
  $('sc').textContent = num(M.red.wins||0)+' — '+num(M.blue.wins||0);
  var pctR=50, pctB=50;
  if (CFG.metric==='p'){ pctR=50+S.p*50; pctB=100-pctR; }
  else if (CFG.metric==='h'){ pctR=S.hR*100; pctB=S.hB*100; }
  else if (CFG.metric==='hp'){ pctR=S.hpR; pctB=S.hpB; }
  else if (CFG.metric==='bal'){ pctR=S.balR; pctB=S.balB; }
  else if (CFG.metric==='goal'){ pctR=50+S.p*50; pctB=100-pctR; $('sc').textContent=num(S.scoreR)+' — '+num(S.scoreB); }
  $('bR').style.width=pctR+'%'; $('bB').style.width=pctB+'%';
}
// ---------- events ----------
function onEvent(ev){
  if (!ev || !ev.kind) return;
  var team = ev.team==='blue' ? 'blue' : 'red';
  if (ev.kind==='join'){ M[team].members++; if(ev.name && M[team].names.indexOf(ev.name)<0) M[team].names.push(ev.name); if(game) game.onJoin(team); tick('👋 '+ev.name+' → '+(team==='red'?'အနီ':'အပြာ')+' ဝင်တယ်'); }
  else if (ev.kind==='gift'){ applyGift(team, tierOf(ev.coins||1), ev.name||'ပရိသတ်', ev.gift||'Gift'); }
  else if (ev.kind==='like'){ if(game) game.onLike(team); var tr = (M.red.power<M.blue.power)?'red':(M.blue.power<M.red.power?'blue':null); if(tr && CFG.metric==='p') S.p += (tr==='red'?1:-1)*0.02; }
  else if (ev.kind==='chat'){ tick('💬 '+ev.name+': '+(ev.text||'').slice(0,40)); }
  syncHud();
}
addEventListener('message', function(e){ var d=e.data; if(d && d.nlo===1) onEvent(d); });
if (parent && parent!==window) parent.postMessage({nlo:1, kind:'ready', game:CFG.id}, '*');
// ---------- demo (standalone debug) ----------
if (window.parent===window){
  $('demo').classList.add('show');
  var names=['Aung Aung','May May','Ko Ko','Thiri','Zaw Zaw','Nilar'];
  [['R1','အနီ ၁ join',function(){ onEvent({kind:'join',team:'red',name:names[Math.random()*6|0]}); }],
   ['B1','အပြာ ၂ join',function(){ onEvent({kind:'join',team:'blue',name:names[Math.random()*6|0]}); }],
   ['GR','အနီ gift',function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Rose',coins:[1,30,199,599,2150][Math.random()*5|0]}); }],
   ['GB','အပြာ gift',function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Rose',coins:[1,30,199,599,2150][Math.random()*5|0]}); }]
  ].forEach(function(b){ var btn=document.createElement('button'); btn.textContent=b[1]; btn.addEventListener('click', b[2]); $('demo').appendChild(btn); });
}
// ---------- loop ----------
S.running = true;
var last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  if (S.running && !S.over){
    S.t += dt; timeLeft -= dt;
    if (CFG.metric==='bal'){ ['red','blue'].forEach(function(tm){ var k=tm==='red'?'balR':'balB'; if (S.t-lastHit[tm]>2.5) S[k]=Math.min(100, S[k]+dt*2.2); }); }
    if (timeLeft<=0 && CFG.metric!=='goal'){ var w=null;
      if(CFG.metric==='p') w = S.p===0?null:(S.p>0?'red':'blue');
      else if(CFG.metric==='h') w = S.hR===S.hB?null:(S.hR>S.hB?'red':'blue');
      else if(CFG.metric==='hp') w = S.hpR===S.hpB?null:(S.hpR>S.hpB?'red':'blue');
      else if(CFG.metric==='bal') w = S.balR===S.balB?null:(S.balR>S.balB?'red':'blue');
      if (w) endRound(w); else { timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); }
    }
    if (timeLeft<=0 && CFG.metric==='goal') winCheck();
    winCheck();
    var mm = Math.max(0, Math.ceil(timeLeft)); $('tm').textContent = Math.floor(mm/60)+':'+('0'+(mm%60)).slice(-2);
    if ((frame._s||0) < S.t-0.25){ frame._s = S.t; syncHud(); }
  }
  if (game){ game.update(dt, S); renderer.render(game.scene, game.camera); }
}
resize(); syncHud(); requestAnimationFrame(frame);
})();
</script>
