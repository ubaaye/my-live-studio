<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#070a18;overflow:hidden;
 font-family:"Optimistic AI VF",system-ui,sans-serif;color:#eef1ff;-webkit-user-select:none;user-select:none}

.bar{height:6px;background:#ffffff22;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .25s}
.red .bar i{background:linear-gradient(90deg,#ff2e63,#ff7aa8)}.blue .bar i{background:linear-gradient(90deg,#2e9bff,#7ac2ff)}
.mid{width:86px;text-align:center;background:rgba(8,10,26,.55);border:1.5px solid #ffd54dcc;border-radius:16px;padding:7px 4px;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 12px #ffd54d33}
#vsbar{position:fixed;top:94px;left:10px;right:10px;height:15px;z-index:5;border-radius:999px;overflow:hidden;pointer-events:none;
 background:rgba(8,10,26,.45);border:1px solid #ffffff40;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#vsR{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff2e63,#ff7aa8);transition:width .3s}

#vsL{left:7px} #vsRp{right:7px}
.mid .tm{font-size:21px;font-weight:900;line-height:1} .mid .sc{font-size:13px;margin-top:2px} .mid .rd{font-size:11px;opacity:.8}
#ticker{position:fixed;left:10px;bottom:64px;z-index:5;font-size:12.5px;line-height:1.5;pointer-events:none;text-shadow:0 1px 3px #000}
#ticker div{background:rgba(5,8,20,.55);display:inline-block;padding:2px 8px;border-radius:8px;margin-top:3px}
#guide{position:fixed;left:8px;right:8px;bottom:8px;z-index:6;background:rgba(10,14,34,.82);border:1px solid #ffffff26;
 border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px);font-size:12.5px}
#guide .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;cursor:pointer}
#guide .rows{margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
#guide .rows div b{color:#ffd54d;font-weight:700}
#guide.closed .rows{display:none}
#howto{position:fixed;top:116px;left:0;right:0;text-align:center;z-index:4;pointer-events:none}
#howto span{background:rgba(5,8,20,.5);padding:3px 12px;border-radius:999px;font-size:13px}
#popup{position:fixed;top:38%;left:0;right:0;text-align:center;z-index:8;pointer-events:none;opacity:0;transform:scale(.9);transition:all .18s}
#popup.show{opacity:1;transform:scale(1)}
#popup .big{display:inline-block;background:rgba(255,255,255,.13);color:#fff;font-weight:800;
 font-size:15px;line-height:1.3;padding:6px 14px;border-radius:11px;box-shadow:0 5px 18px #0004,inset 0 0 12px #ffffff1f;max-width:82%;
 border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
 text-shadow:0 1px 4px #0009}
#popup .sub{display:block;margin-top:4px;font-size:11.5px;color:#fff;text-shadow:0 1px 4px #000}
#sideR,#sideB{position:fixed;top:150px;z-index:5;display:flex;flex-direction:column;gap:3px;pointer-events:none;min-width:106px}
#sideR{left:8px} #sideB{right:8px}
#giftsR,#giftsB{display:none;flex-direction:column;gap:3px}
.qbox{display:none;background:rgba(255,255,255,.10);border:1px dashed #ffffff70;border-radius:8px;padding:3px 7px;
 font-size:10.5px;color:#fff;text-shadow:0 1px 3px #000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:158px}
.grow{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.13);border:1px solid #ffffff45;border-radius:8px;
 padding:2.5px 7px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.grow .n{opacity:.92;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .c{margin-left:auto;font-weight:800}
.democol{position:fixed;top:150px;z-index:9;display:none;flex-direction:column;gap:5px}
#demoR{left:8px} #demoB{right:8px}
.democol button{background:rgba(24,20,12,.58);color:#fff;border:1px solid #ffffff40;border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:700;
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 8px #0004;text-shadow:0 1px 2px #000}
.democol.show{display:flex}
body.standalone #sideR,body.standalone #sideB{top:252px}
#gEdit{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.13);border:1px solid #ffffff59;border-radius:8px;
 padding:3px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tedit{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(4,6,16,.45)}
#tedit.show{display:flex}
#tedit .card{background:rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 border:1px solid #ffffff59;border-radius:16px;padding:16px;width:84%;max-width:320px;color:#fff;box-shadow:0 10px 34px #0007}
#tedit h3{margin:0 0 10px;font-size:15px}
#tedit label{display:block;font-size:12.5px;margin:10px 0 4px;opacity:.92}
#tedit input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid #ffffff55;background:rgba(0,0,0,.28);
 color:#fff;font-size:15px;-webkit-user-select:text;user-select:text;outline:none}
#tedit .row{display:flex;gap:8px;margin-top:14px}
#tedit button{flex:1;padding:9px;border-radius:9px;border:1px solid #ffffff59;background:rgba(255,255,255,.13);
 color:#fff;font-size:13.5px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#fx{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#fx .cf{position:absolute;width:8px;height:12px;border-radius:2px;opacity:.95}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;border:3px solid transparent;border-radius:6px}
</style></head><body>
<div id="stage"></div>
<div class="hud">
  <div class="team red"><div class="nm" id="nmR">🔴 အနီ</div><div class="st">👥 <span id="pR">0</span> · 🎁 <span id="gR">0</span></div><div class="bar"><i id="bR" style="width:50%"></i></div></div>
  <div class="mid"><div class="tm" id="tm">1:30</div><div class="sc" id="sc">0 — 0</div><div class="rd">ပွဲစဉ် <span id="rd">1</span></div></div>
  <div class="team blue"><div class="nm" id="nmB">🔵 အပြာ</div><div class="st">👥 <span id="pB">0</span> · 🎁 <span id="gB">0</span></div><div class="bar"><i id="bB" style="width:50%"></i></div></div>
</div>
<div id="vsbar"><div id="vsR" style="width:50%"></div><div id="vsB" style="width:50%"></div><span class="pc" id="vsL">၅၀%</span><span class="pc" id="vsRp">၅၀%</span></div>

<div id="howto"><span id="howtoTx">မန့် ၁ = အနီ · မန့် ၂ = အပြာ ဝင်ပါ</span></div>
<div id="ticker"></div>
<div id="flash"></div><div id="fx"></div>
<div id="popup"><span class="big" id="popBig"></span><span class="sub" id="popSub"></span></div>
<div id="guide"><div class="hd"><span>🎁 Gift လမ်းညွှန် — လွန်ဆွဲပွဲ (TUG OF WAR)</span><span style="display:flex;gap:8px;align-items:center"><span id="gEdit">✎ အသင်းပြင်</span><span id="gTog">▾</span></span></div><div class="rows" id="gRows"></div></div>
<div id="tedit"><div class="card"><h3>✎ အသင်းနာမည်များ ပြင်ရန်</h3>
<label>🔴 အသင်း ၁ (မန့် ၁)</label><input id="tnR" maxlength="24">
<label>🔵 အသင်း ၂ (မန့် ၂)</label><input id="tnB" maxlength="24">
<div class="row"><button id="tnCancel">မပြင်တော့</button><button id="tnSave">သိမ်းမယ်</button></div></div></div>

<script src="three.min.js"></script>
<script>window.GAME3D = {};</script>
<script>
GAME3D['tug'] = {

create: function(THREE) { const T = THREE; const scene = new T.Scene(); scene.background = new T.Color(0xf7c58e); scene.fog = new T.Fog(0xf7c58e, 24, 56);



const camera = new T.PerspectiveCamera(55, 0.5625, 0.5, 90);
const camBase = new T.Vector3(0, 4.5, 19.2);
const camLook = new T.Vector3(0, 2.5, 0);
camera.position.copy(camBase);
camera.lookAt(camLook);

const hemi = new T.HemisphereLight(0xfff5db, 0xc77d48, 1.05);
scene.add(hemi);

const dir = new T.DirectionalLight(0xfff0cc, 1.65);
dir.position.set(7, 14, 9);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
dir.shadow.camera.left = -6.5;
dir.shadow.camera.right = 6.5;
dir.shadow.camera.top = 5.5;
dir.shadow.camera.bottom = -4.5;
dir.shadow.camera.near = 3;
dir.shadow.camera.far = 32;
dir.shadow.bias = -0.001;
scene.add(dir);

const tmpObj = new T.Object3D();
const tmpCol = new T.Color();

// Shared materials
const matSand = new T.MeshStandardMaterial({ color: 0xdca76c, roughness: 0.88 });
const matArena = new T.MeshStandardMaterial({ color: 0xd19457, roughness: 0.9 });
const matMud = new T.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.18, metalness: 0.12 });
const matMudRim = new T.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.88 });
const matSkin = new T.MeshStandardMaterial({ color: 0xd99b6c, roughness: 0.82 });
const matThanaka = new T.MeshStandardMaterial({ color: 0xf6e7a1, roughness: 0.85 });
const matRed = new T.MeshStandardMaterial({ color: 0xe53935, roughness: 0.8 });
const matRedDark = new T.MeshStandardMaterial({ color: 0x8e1919, roughness: 0.85, side: T.DoubleSide });
const matBlue = new T.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.8 });
const matBlueDark = new T.MeshStandardMaterial({ color: 0x0f4482, roughness: 0.85, side: T.DoubleSide });
const matRope = new T.MeshStandardMaterial({ color: 0xc8a464, roughness: 0.88, emissive: new T.Color(0xffb800), emissiveIntensity: 0 });
const matGold = new T.MeshStandardMaterial({ color: 0xf6be1a, roughness: 0.75, metalness: 0.15, side: T.DoubleSide });
const matBannerRed = new T.MeshStandardMaterial({ color: 0xc62828, roughness: 0.82, side: T.DoubleSide });
const matBamboo = new T.MeshStandardMaterial({ color: 0xc49c48, roughness: 0.85 });
const matWood = new T.MeshStandardMaterial({ color: 0x8d5830, roughness: 0.88 });
const matFrond = new T.MeshStandardMaterial({ color: 0x43923e, roughness: 0.84 });
const matLineInst = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88 });
const matCrowd = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82 });
const matFlag = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, side: T.DoubleSide });
const matString = new T.MeshStandardMaterial({ color: 0x6d4c30, roughness: 0.9 });
const matDust = new T.MeshStandardMaterial({ color: 0xe7c697, roughness: 0.9, transparent: true, opacity: 0.78 });
const matHill = new T.MeshStandardMaterial({ color: 0xd99b6a, roughness: 0.9 });
const matStupa = new T.MeshStandardMaterial({ color: 0xe8b542, roughness: 0.78 });

// Shared geometries
const geoHead = new T.SphereGeometry(0.185, 10, 8);
const geoBand = new T.TorusGeometry(0.18, 0.048, 7, 14);
const geoThanaka = new T.CylinderGeometry(0.05, 0.05, 0.016, 8);
const geoTorso = new T.CapsuleGeometry(0.165, 0.28, 4, 8);
const geoLongyi = new T.CylinderGeometry(0.165, 0.22, 0.42, 10, 1, true);
const geoArm = new T.CapsuleGeometry(0.055, 0.43, 4, 6);
const geoLeg = new T.CapsuleGeometry(0.066, 0.42, 4, 6);

// Ground
const ground = new T.Mesh(new T.PlaneGeometry(46, 36), matSand);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const arenaStrip = new T.Mesh(new T.PlaneGeometry(14, 4.2), matArena);
arenaStrip.rotation.x = -Math.PI / 2;
arenaStrip.position.set(0, 0.008, 0.1);
arenaStrip.receiveShadow = true;
scene.add(arenaStrip);

// Mud pit
const mudPit = new T.Mesh(new T.CylinderGeometry(1.0, 1.0, 0.03, 22), matMud);
mudPit.scale.set(1.22, 1, 0.78);
mudPit.position.set(0, 0.015, 0);
mudPit.receiveShadow = true;
scene.add(mudPit);

const mudRim = new T.Mesh(new T.TorusGeometry(1.0, 0.11, 7, 22), matMudRim);
mudRim.rotation.x = Math.PI / 2;
mudRim.scale.set(1.22, 0.78, 0.55);
mudRim.position.set(0, 0.04, 0);
mudRim.receiveShadow = true;
scene.add(mudRim);

// Win lines at x=-3 and x=+3
const lineGeo = new T.PlaneGeometry(0.14, 3.6);
lineGeo.rotateX(-Math.PI / 2);
const winLines = new T.InstancedMesh(lineGeo, matLineInst, 4);
winLines.receiveShadow = true;
const lineDefs = [
  { x: -3.0, col: 0xe53935 },
  { x: -2.84, col: 0xfff8ee },
  { x: 3.0, col: 0x1e88e5 },
  { x: 2.84, col: 0xfff8ee }
];
for (let i = 0; i < 4; i++) {
  tmpObj.position.set(lineDefs[i].x, 0.02, 0.05);
  tmpObj.rotation.set(0, 0, 0);
  tmpObj.scale.set(i % 2 === 1 ? 0.55 : 1, 1, 1);
  tmpObj.updateMatrix();
  winLines.setMatrixAt(i, tmpObj.matrix);
  tmpCol.setHex(lineDefs[i].col);
  winLines.setColorAt(i, tmpCol);
}
winLines.instanceMatrix.needsUpdate = true;
winLines.instanceColor.needsUpdate = true;
scene.add(winLines);

// Stands and bamboo fence
const standGeo = new T.BoxGeometry(1, 1, 1);
const standPlanks = new T.InstancedMesh(standGeo, matWood, 11);
let si = 0;
for (let r = 0; r < 3; r++) {
  tmpObj.position.set(0, 0.55 + r * 0.85, -4.1 - r * 1.05);
  tmpObj.rotation.set(0, 0, 0);
  tmpObj.scale.set(10.6, 0.22, 0.95);
  tmpObj.updateMatrix();
  standPlanks.setMatrixAt(si++, tmpObj.matrix);
}
for (let c = -4; c <= 4; c += 2) {
  tmpObj.position.set(c * 1.15, 1.35, -6.5);
  tmpObj.rotation.set(0, 0, 0);
  tmpObj.scale.set(0.18, 2.9, 0.18);
  tmpObj.updateMatrix();
  standPlanks.setMatrixAt(si++, tmpObj.matrix);
}
// Foreground festival curb rails
tmpObj.position.set(-3.4, 0.18, 5.2);
tmpObj.rotation.set(0, 0.12, 0);
tmpObj.scale.set(3.2, 0.16, 0.16);
tmpObj.updateMatrix();
standPlanks.setMatrixAt(si++, tmpObj.matrix);
tmpObj.position.set(3.4, 0.18, 5.2);
tmpObj.rotation.set(0, -0.12, 0);
tmpObj.scale.set(3.2, 0.16, 0.16);
tmpObj.updateMatrix();
standPlanks.setMatrixAt(si++, tmpObj.matrix);
tmpObj.position.set(0, 0.14, 6.4);
tmpObj.rotation.set(0, 0, 0);
tmpObj.scale.set(9.2, 0.12, 0.14);
tmpObj.updateMatrix();
standPlanks.setMatrixAt(si++, tmpObj.matrix);
standPlanks.instanceMatrix.needsUpdate = true;
scene.add(standPlanks);

// Bamboo fence
const poleGeo = new T.CylinderGeometry(0.055, 0.065, 1, 6);
const bambooCount = 19;
const bambooMesh = new T.InstancedMesh(poleGeo, matBamboo, bambooCount);
let bi = 0;
for (let i = 0; i < 15; i++) {
  const x = -5.6 + i * 0.8;
  tmpObj.position.set(x, 0.58, -3.15);
  tmpObj.rotation.set(0, 0, (i % 2 === 0 ? 0.03 : -0.03));
  tmpObj.scale.set(1, 1.25, 1);
  tmpObj.updateMatrix();
  bambooMesh.setMatrixAt(bi++, tmpObj.matrix);
}
for (let r = 0; r < 2; r++) {
  tmpObj.position.set(0, 0.42 + r * 0.45, -3.12);
  tmpObj.rotation.set(0, 0, Math.PI / 2);
  tmpObj.scale.set(0.85, 11.8, 0.85);
  tmpObj.updateMatrix();
  bambooMesh.setMatrixAt(bi++, tmpObj.matrix);
}
// Foreground bamboo corner posts
tmpObj.position.set(-4.6, 0.5, 5.0);
tmpObj.rotation.set(0, 0, 0);
tmpObj.scale.set(1.2, 1.0, 1.2);
tmpObj.updateMatrix();
bambooMesh.setMatrixAt(bi++, tmpObj.matrix);
tmpObj.position.set(4.6, 0.5, 5.0);
tmpObj.rotation.set(0, 0, 0);
tmpObj.scale.set(1.2, 1.0, 1.2);
tmpObj.updateMatrix();
bambooMesh.setMatrixAt(bi++, tmpObj.matrix);
bambooMesh.instanceMatrix.needsUpdate = true;
scene.add(bambooMesh);

// Crowd on stands
const crowdTotal = 36;
const crowdBodies = new T.InstancedMesh(new T.CapsuleGeometry(0.18, 0.36, 4, 6), matCrowd, crowdTotal);
const crowdHeads = new T.InstancedMesh(new T.SphereGeometry(0.155, 8, 6), matCrowd, crowdTotal);
const crowdPalette = [0xe53935, 0xfb8c00, 0xfdd835, 0x43a047, 0x00acc1, 0x1e88e5, 0x8e24aa, 0xd81b60];
const skinPalette = [0xd99b6c, 0xcf8d5e, 0xe2ab7d, 0xc48254];
const crowdData = [];
for (let i = 0; i < crowdTotal; i++) {
  const row = Math.floor(i / 12);
  const col = i % 12;
  const x = -4.65 + col * 0.84 + (row % 2) * 0.25;
  const y = 0.96 + row * 0.85;
  const z = -4.1 - row * 1.05;
  crowdData.push({ x: x, y: y, z: z, phase: i * 1.13, spd: 3.2 + (i % 5) * 0.45 });
  tmpCol.setHex(crowdPalette[(i * 3 + row) % crowdPalette.length]);
  crowdBodies.setColorAt(i, tmpCol);
  tmpCol.setHex(skinPalette[i % skinPalette.length]);
  crowdHeads.setColorAt(i, tmpCol);
}
crowdBodies.instanceColor.needsUpdate = true;
crowdHeads.instanceColor.needsUpdate = true;
scene.add(crowdBodies);
scene.add(crowdHeads);

// Fair pavilions
const pavPoles = new T.InstancedMesh(poleGeo, matWood, 12);
const pavPos = [
  { x: -4.2, z: -7.4, h: 4.5, w: 2.4 },
  { x: 4.2, z: -7.4, h: 4.5, w: 2.4 },
  { x: 0, z: -8.0, h: 5.4, w: 3.6 }
];
let pi = 0;
for (let p = 0; p < 3; p++) {
  const pv = pavPos[p];
  const hw = pv.w * 0.48;
  const offsets = [[-hw, -0.7], [hw, -0.7], [-hw, 0.7], [hw, 0.7]];
  for (let k = 0; k < 4; k++) {
    tmpObj.position.set(pv.x + offsets[k][0], pv.h * 0.5, pv.z + offsets[k][1]);
    tmpObj.rotation.set(0, 0, 0);
    tmpObj.scale.set(1.6, pv.h, 1.6);
    tmpObj.updateMatrix();
    pavPoles.setMatrixAt(pi++, tmpObj.matrix);
  }
}
pavPoles.instanceMatrix.needsUpdate = true;
scene.add(pavPoles);

const roofGeo = new T.ConeGeometry(1.0, 1.0, 4);
roofGeo.rotateY(Math.PI / 4);
const pavRoofs = new T.InstancedMesh(roofGeo, matBannerRed, 6);
const pavFinials = new T.InstancedMesh(new T.ConeGeometry(0.14, 0.9, 6), matGold, 3);
let ri = 0;
for (let p = 0; p < 3; p++) {
  const pv = pavPos[p];
  tmpObj.position.set(pv.x, pv.h + 0.55, pv.z);
  tmpObj.rotation.set(0, 0, 0);
  tmpObj.scale.set(pv.w * 0.85, 1.35, 1.75);
  tmpObj.updateMatrix();
  pavRoofs.setMatrixAt(ri++, tmpObj.matrix);

  tmpObj.position.set(pv.x, pv.h + 1.45, pv.z);
  tmpObj.scale.set(pv.w * 0.5, 1.05, 1.05);
  tmpObj.updateMatrix();
  pavRoofs.setMatrixAt(ri++, tmpObj.matrix);

  tmpObj.position.set(pv.x, pv.h + 2.3, pv.z);
  tmpObj.scale.set(1, 1, 1);
  tmpObj.updateMatrix();
  pavFinials.setMatrixAt(p, tmpObj.matrix);
}
pavRoofs.instanceMatrix.needsUpdate = true;

// Internal animation state
let clock = 0;
let asmX = 0;
let prevP = 0;
let dpSmooth = 0;
let phaseR = 0;
let phaseB = 1.6;
let glowTimer = 0;
let creakTimer = 0;
let shakeTimer = 0;
let crowdBoost = 0;
let resetEase = 0;
let standTimer = 0;

const surge = { red: 0, blue: 0 };
const heaveTimer = { red: 0, blue: 0 };
const heaveDur = { red: 0.6, blue: 0.6 };
const heaveAmp = { red: 0, blue: 0 };
const heaveCount = { red: 1, blue: 1 };
const likeTwitch = { red: 0, blue: 0 };
const fallTimer = { red: 0, blue: 0 };
const joinIdx = { red: 0, blue: 0 };

function animateTeam(teamArr, teamKey, phase, dt, S) {
  const isRed = teamKey === 'red';
  const isWinner = S.over && S.winner === teamKey;
  const isLoser = S.over && S.winner && S.winner !== teamKey;

  let hPulse = 0;
  if (heaveTimer[teamKey] > 0) {
    heaveTimer[teamKey] = Math.max(0, heaveTimer[teamKey] - dt);
    const u = 1 - heaveTimer[teamKey] / heaveDur[teamKey];
    const wave = Math.sin(u * Math.PI * heaveCount[teamKey]);
    hPulse = Math.max(0, wave) * heaveAmp[teamKey];
  }

  let twitch = 0;
  if (likeTwitch[teamKey] > 0) {
    likeTwitch[teamKey] = Math.max(0, likeTwitch[teamKey] - dt);
    twitch = Math.sin((likeTwitch[teamKey] / 0.25) * Math.PI) * 0.22;
  }

  if (fallTimer[teamKey] > 0) {
    fallTimer[teamKey] = Math.max(0, fallTimer[teamKey] - dt);
  }

  for (let i = 0; i < 5; i++) {
    const p = teamArr[i];
    let popScale = 1;
    let popY = 0;
    if (p.popTimer > 0) {
      p.popTimer = Math.max(0, p.popTimer - dt);
      const u = 1 - p.popTimer / 0.65;
      const s = Math.sin(u * Math.PI);
      popScale = 1 + 0.38 * s;
      popY = 0.22 * s;
    }
    p.root.scale.setScalar(1.12 * popScale);

    // Front puller slip and scramble on T4
    if (i === 0 && fallTimer[teamKey] > 0) {
      const ft = fallTimer[teamKey];
      const elapsed = 1.55 - ft;
      let fallBlend = 1;
      if (elapsed < 0.35) {
        fallBlend = elapsed / 0.35;
      } else if (ft < 1.0) {
        fallBlend = ft;
      }
      const scramble = ft < 1.0 ? Math.sin(ft * 22) * 0.25 * fallBlend : 0;
      p.root.position.set(p.baseX + (isRed ? -0.22 : 0.22) * fallBlend, 0.14 * fallBlend + popY, p.baseZ);
      p.torso.rotation.x = -1.18 * fallBlend + scramble;
      p.torso.rotation.z = Math.sin(clock * 14) * 0.12 * fallBlend;
      p.head.rotation.x = 0.75 * fallBlend;
      p.armL.rotation.x = -2.25 * fallBlend + scramble;
      p.armR.rotation.x = -2.05 * fallBlend - scramble;
      p.armL.rotation.z = 0.35 * fallBlend;
      p.armR.rotation.z = -0.35 * fallBlend;
      p.legL.rotation.x = -1.35 * fallBlend + scramble;
      p.legR.rotation.x = -1.05 * fallBlend - scramble;
      p.longyi.rotation.x = -0.55 * fallBlend;
      continue;
    }

    const idxPhase = phase + i * 0.55;
    const cycle = Math.sin(idxPhase);
    const strainBob = Math.sin(clock * 4.8 + i * 0.85) * 0.035;

    if (standTimer > 0) {
      const st = Math.min(1, standTimer / 0.7);
      const ready = 1 - st;
      p.root.position.set(p.baseX, popY, p.baseZ);
      p.torso.rotation.x = -0.25 * ready;
      p.torso.rotation.z = 0;
      p.head.rotation.x = 0.15 * ready;
      p.armL.rotation.x = -0.95 * ready - 0.15 * st;
      p.armR.rotation.x = -0.95 * ready - 0.15 * st;
      p.armL.rotation.z = -0.18 * ready;
      p.armR.rotation.z = 0.18 * ready;
      p.legL.rotation.x = -0.15 * ready;
      p.legR.rotation.x = 0.1 * ready;
      p.longyi.rotation.x = -0.05 * ready;
      continue;
    }

    if (isWinner) {
      const hop = Math.abs(Math.sin(clock * 7.5 + i * 0.7));
      p.root.position.set(p.baseX, hop * 0.32 + popY, p.baseZ);
      p.torso.rotation.x = -0.08;
      p.torso.rotation.z = Math.sin(clock * 8 + i) * 0.1;
      p.head.rotation.x = -0.15;
      p.armL.rotation.x = -2.75 + Math.sin(clock * 12 + i) * 0.25;
      p.armR.rotation.x = -2.75 - Math.sin(clock * 12 + i) * 0.25;
      p.armL.rotation.z = 0.25;
      p.armR.rotation.z = -0.25;
      p.legL.rotation.x = -0.2 * hop;
      p.legR.rotation.x = 0.2 * hop;
      p.longyi.rotation.x = 0;
      continue;
    }

    if (isLoser) {
      p.root.position.set(p.baseX, -0.06 + popY, p.baseZ);
      p.torso.rotation.x = 0.35 + Math.sin(clock * 2.5 + i) * 0.04;
      p.torso.rotation.z = 0;
      p.head.rotation.x = 0.25;
      p.armL.rotation.x = -0.25;
      p.armR.rotation.x = -0.25;
      p.armL.rotation.z = -0.05;
      p.armR.rotation.z = 0.05;
      p.legL.rotation.x = -0.1;
      p.legR.rotation.x = 0.12;
      p.longyi.rotation.x = 0.1;
      continue;
    }

    // Active pulling cycle
    const heave = hPulse * 0.38 + twitch;
    const lean = 0.34 + 0.16 * cycle + heave + strainBob;
    const crouch = 0.05 + 0.05 * Math.max(0, cycle) + hPulse * 0.07;
    const shuffle = Math.sin(idxPhase * 2.0) * 0.16;

    p.root.position.set(p.baseX, -crouch + popY, p.baseZ);
    p.torso.rotation.x = -lean;
    p.torso.rotation.z = Math.sin(idxPhase) * 0.06;
    p.head.rotation.x = lean * 0.68;

    const armBend = -1.22 + lean - 0.14 * cycle - heave * 0.3;
    p.armL.rotation.x = armBend;
    p.armR.rotation.x = armBend + 0.08;
    p.armL.rotation.z = -0.22;
    p.armR.rotation.z = 0.22;

    p.legL.rotation.x = -0.46 + shuffle - heave * 0.18;
    p.legR.rotation.x = 0.06 - shuffle - heave * 0.12;
    p.longyi.rotation.x = -lean * 0.25;
  }
}

function updateRope(dt) {
  if (glowTimer > 0) {
    glowTimer = Math.max(0, glowTimer - dt);
    matRope.emissiveIntensity = 0.75 + 0.5 * Math.sin(clock * 14);
  } else {
    matRope.emissiveIntensity = 0;
  }

  let creak = 0;
  if (creakTimer > 0) {
    creakTimer = Math.max(0, creakTimer - dt);
    creak = Math.min(1, creakTimer * 2.5);
  }

  const tension = Math.min(1, 0.35 + dpSmooth * 0.4 + creak * 0.5);
  const sag = 0.08 * (1 - tension);
  const totalLen = 6.5;
  for (let i = 0; i < ropeSegs; i++) {
    const u = (i + 0.5) / ropeSegs;
    const x = -totalLen * 0.5 + u * totalLen;
    const norm = (u - 0.5) * 2;
    const vibY = creak * Math.sin(clock * 46 + i * 1.1) * 0.045;
    const vibZ = creak * Math.cos(clock * 38 + i * 0.9) * 0.035;
    const y = 0.92 - sag * (1 - norm * norm) + vibY;
    const slope = 2 * sag * norm / (totalLen * 0.5);

    tmpObj.position.set(x, y, vibZ);
    tmpObj.rotation.set(0, 0, Math.atan(slope));
    tmpObj.scale.set(1, 1 + (glowTimer > 0 ? 0.18 : 0), 1 + (glowTimer > 0 ? 0.18 : 0));
    tmpObj.updateMatrix();
    ropeMesh.setMatrixAt(i, tmpObj.matrix);
  }
  ropeMesh.instanceMatrix.needsUpdate = true;

  ribbonKnot.position.y = 0.92 - sag + creak * Math.sin(clock * 44) * 0.04;
  ribbonTail.position.y = ribbonKnot.position.y - 0.24;
  ribbonTail.rotation.z = Math.sin(clock * 7.5) * 0.18 + dpSmooth * 0.12;
  ribbonTail.rotation.x = Math.sin(clock * 5.2) * 0.16;
}

function updateAmbient(dt, S) {
  if (crowdBoost > 0) crowdBoost = Math.max(0, crowdBoost - dt * 0.8);
  const cheer = (S.over ? 1.4 : 0) + crowdBoost;

  for (let i = 0; i < crowdTotal; i++) {
    const c = crowdData[i];
    const b = Math.abs(Math.sin(clock * (c.spd + cheer * 1.6) + c.phase)) * (0.09 + cheer * 0.07);
    tmpObj.position.set(c.x, c.y + b, c.z);
    tmpObj.rotation.set(0, 0, Math.sin(clock * 2.5 + c.phase) * 0.06);
    tmpObj.scale.set(1, 1, 1);
    tmpObj.updateMatrix();
    crowdBodies.setMatrixAt(i, tmpObj.matrix);

    tmpObj.position.set(c.x, c.y + 0.44 + b, c.z);
    tmpObj.rotation.set(0, 0, 0);
    tmpObj.updateMatrix();
    crowdHeads.setMatrixAt(i, tmpObj.matrix);
  }
  crowdBodies.instanceMatrix.needsUpdate = true;
  crowdHeads.instanceMatrix.needsUpdate = true;

  // Waving flags
  for (let i = 0; i < totalFlags; i++) {
    const fm = flagMeta[i];
    tmpObj.position.set(fm.x, fm.y, fm.z);
    tmpObj.rotation.set(Math.sin(clock * 4.4 + fm.phase) * 0.42, 0, fm.rz);
    tmpObj.scale.set(1, 1, 1);
    tmpObj.updateMatrix();
    flagsMesh.setMatrixAt(i, tmpObj.matrix);
  }
  flagsMesh.instanceMatrix.needsUpdate = true;

  // Swaying palm fronds
  let pfi = 0;
  for (let p = 0; p < palms.length; p++) {
    const top = palmTops[p];
    const sway = Math.sin(clock * 1.6 + p * 1.5) * 0.08;
    for (let f = 0; f < frondsPerPalm; f++) {
      const ang = (f / frondsPerPalm) * Math.PI * 2 + p * 0.4;
      tmpObj.position.set(top.x + Math.cos(ang) * 1.15, top.y - 0.15, top.z + Math.sin(ang) * 1.15);
      tmpObj.rotation.set(0, -ang, -1.25 + sway + Math.sin(clock * 2.2 + f) * 0.06);
      tmpObj.scale.set(1, 1, 0.25);
      tmpObj.updateMatrix();
      palmFronds.setMatrixAt(pfi++, tmpObj.matrix);
    }
  }
  palmFronds.instanceMatrix.needsUpdate = true;

  // Dust particles
  for (let i = 0; i < dustMax; i++) {
    const d = dustPool[i];
    if (!d.active) {
      tmpObj.position.set(0, -20, 0);
      tmpObj.scale.set(0.001, 0.001, 0.001);
      tmpObj.updateMatrix();
      dustMesh.setMatrixAt(i, tmpObj.matrix);
      continue;
    }
    d.life -= dt;
    if (d.life <= 0) {
      d.active = false;
      tmpObj.position.set(0, -20, 0);
      tmpObj.scale.set(0.001, 0.001, 0.001);
      tmpObj.updateMatrix();
      dustMesh.setMatrixAt(i, tmpObj.matrix);
      continue;
    }
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;
    d.vy -= 1.6 * dt;
    const u = d.life / d.maxLife;
    const sc = d.sz * (1.35 - u * 0.65) * Math.min(1, u * 3);
    tmpObj.position.set(d.x, Math.max(0.05, d.y), d.z);
    tmpObj.rotation.set(0, 0, 0);
    tmpObj.scale.setScalar(sc);
    tmpObj.updateMatrix();
    dustMesh.setMatrixAt(i, tmpObj.matrix);
  }
  dustMesh.instanceMatrix.needsUpdate = true;
}

const game = {
  scene: scene,
  camera: camera,

  update: function(dt, S) {
    dt = Math.min(Math.max(dt || 0, 0), 0.05);
    clock += dt;

    const pVal = Math.max(-1, Math.min(1, S.p || 0));
    const rawDp = Math.abs(pVal - prevP) / Math.max(dt, 0.005);
    prevP = pVal;
    dpSmooth += (Math.min(rawDp, 4.0) - dpSmooth) * Math.min(1, dt * 8);

    if (resetEase > 0) resetEase = Math.max(0, resetEase - dt);
    if (standTimer > 0) standTimer = Math.max(0, standTimer - dt);

    const targetX = pVal * 1.6;
    const lerpRate = resetEase > 0 ? 5.5 : 14.0;
    asmX += (targetX - asmX) * Math.min(1, dt * lerpRate);

    let shakeX = 0;
    let shakeY = 0;
    if (shakeTimer > 0) {
      shakeTimer = Math.max(0, shakeTimer - dt);
      const mag = (shakeTimer / 1.2) * 0.28;
      shakeX = Math.sin(clock * 58) * mag;
      shakeY = Math.cos(clock * 67) * mag * 0.85;
    }
    assembly.position.set(asmX + shakeX * 0.5, 0, 0);
    camera.position.set(camBase.x + shakeX, camBase.y + shakeY, camBase.z);
    camera.lookAt(camLook);

    surge.red = Math.max(0, surge.red - dt * 1.2);
    surge.blue = Math.max(0, surge.blue - dt * 1.2);

    const baseSpd = S.running ? 3.2 : 1.6;
    phaseR += dt * (baseSpd + dpSmooth * 5.5 + surge.red * 2.4);
    phaseB += dt * (baseSpd + dpSmooth * 5.5 + surge.blue * 2.4);

    animateTeam(redTeam, 'red', phaseR, dt, S);
    animateTeam(blueTeam, 'blue', phaseB, dt, S);
    updateRope(dt);
    updateAmbient(dt, S);
  },

  onJoin: function(team) {
    const key = team === 'blue' ? 'blue' : 'red';
    const arr = key === 'red' ? redTeam : blueTeam;
    const idx = Math.min(joinIdx[key], 4);
    joinIdx[key]++;
    arr[idx].popTimer = 0.65;
    spawnDust(asmX + arr[idx].baseX, 0.12, arr[idx].baseZ, 4, 0.35);
  },

  onGift: function(team, tier) {
    const key = team === 'blue' ? 'blue' : 'red';
    const opp = key === 'red' ? 'blue' : 'red';
    const arr = key === 'red' ? redTeam : blueTeam;
    const oppArr = opp === 'red' ? redTeam : blueTeam;

    if (tier === 1) {
      heaveDur[key] = 0.55;
      heaveTimer[key] = 0.55;
      heaveAmp[key] = 1.0;
      heaveCount[key] = 1;
      creakTimer = Math.max(creakTimer, 0.55);
      surge[key] = Math.min(2.5, surge[key] + 0.9);
      crowdBoost = Math.max(crowdBoost, 0.8);
    } else if (tier === 2) {
      heaveDur[key] = 0.72;
      heaveTimer[key] = 0.72;
      heaveAmp[key] = 1.45;
      heaveCount[key] = 1;
      creakTimer = Math.max(creakTimer, 0.75);
      surge[key] = Math.min(2.5, surge[key] + 1.4);
      crowdBoost = Math.max(crowdBoost, 1.3);
      for (let i = 0; i < 5; i++) {
        spawnDust(asmX + arr[i].baseX, 0.1, arr[i].baseZ, 3, 0.35);
      }
    } else if (tier === 3) {
      glowTimer = 5.0;
      heaveDur[key] = 1.35;
      heaveTimer[key] = 1.35;
      heaveAmp[key] = 1.55;
      heaveCount[key] = 2;
      creakTimer = Math.max(creakTimer, 1.35);
      surge[key] = Math.min(2.5, surge[key] + 2.0);
      crowdBoost = Math.max(crowdBoost, 2.0);
      for (let i = 0; i < 5; i++) {
        spawnDust(asmX + arr[i].baseX, 0.1, arr[i].baseZ, 3, 0.4);
      }
    } else {
      shakeTimer = 1.2;
      fallTimer[opp] = 1.55;
      heaveDur[key] = 0.9;
      heaveTimer[key] = 0.9;
      heaveAmp[key] = 1.65;
      heaveCount[key] = 1;
      creakTimer = Math.max(creakTimer, 1.2);
      surge[key] = Math.min(2.5, surge[key] + 2.2);
      crowdBoost = Math.max(crowdBoost, 2.6);
      spawnDust(asmX + oppArr[0].baseX, 0.2, oppArr[0].baseZ, 16, 1.1);
      spawnDust(asmX + arr[0].baseX, 0.15, arr[0].baseZ, 8, 0.9);
    }
  },

  onLike: function(team) {
    const key = team === 'blue' ? 'blue' : 'red';
    const arr = key === 'red' ? redTeam : blueTeam;
    surge[key] = Math.min(2.5, surge[key] + 0.45);
    likeTwitch[key] = 0.25;
    spawnDust(asmX + arr[0].baseX, 0.08, arr[0].baseZ, 3, 0.3);
  },

  reset: function() {
    resetEase = 0.9;
    standTimer = 0.7;
    prevP = 0;
    dpSmooth = 0;
    glowTimer = 0;
    creakTimer = 0;
    shakeTimer = 0;
    crowdBoost = 0;
    surge.red = 0;
    surge.blue = 0;
    heaveTimer.red = 0;
    heaveTimer.blue = 0;
    likeTwitch.red = 0;
    likeTwitch.blue = 0;
    fallTimer.red = 0;
    fallTimer.blue = 0;
    joinIdx.red = 0;
    joinIdx.blue = 0;
    matRope.emissiveIntensity = 0;
    for (let i = 0; i < 5; i++) {
      redTeam[i].popTimer = 0;
      blueTeam[i].popTimer = 0;
    }
    for (let i = 0; i < dustMax; i++) {
      dustPool[i].active = false;
    }
  }
};

updateRope(0);
updateAmbient(0, { over: false });
return game;

} };

var FXC = ['#ffd54d','#ff5a8a','#4da3ff','#7dff8a','#ff9d2e','#ffffff'];

      { transform:'translate(0,0) rotate(0deg)', opacity:1 },

function num(n){ return String(n).replace(/\d/g, function(c){ return '၀၁၂၃၄၅၆၇၈၉'[+c]; }); }
// ---------- game numbers ----------

    if (CFG.metric==='bal'){ ['red','blue'].forEach(function(tm){ var k=tm==='red'?'balR':'balB'; if (S.t-lastHit[tm]>2.5) S[k]=Math.min(100, S[k]+dt*2.2); }); }
    if (timeLeft<=0 && CFG.metric!=='goal'){ var w=null;
      if(CFG.metric==='p') w = S.p===0?null:(S.p>0?'red':'blue');

      else if(CFG.metric==='hp') w = S.hpR===S.hpB?null:(S.hpR>S.hpB?'red':'blue');
      else if(CFG.metric==='bal') w = S.balR===S.balB?null:(S.balR>S.balB?'red':'blue');
      if (w) endRound(w); else { timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); }
    }
    if (timeLeft<=0 && CFG.metric==='goal') winCheck();
    winCheck();
    var mm = Math.max(0, Math.ceil(timeLeft)); $('tm').textContent = Math.floor(mm/60)+':'+('0'+(mm%60)).slice(-2);
    if ((frame._s||0) < S.t-0.25){ frame._s = S.t; syncHud(); }
  }
  if (game){ game.update(dt, S); renderer.render(game.scene, game.camera); }
}
resize(); applyNames(); syncHud(); requestAnimationFrame(frame);
})();
</script>
</body></html>
