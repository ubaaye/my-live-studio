 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 8px #0004;text-shadow:0 1px 2px #000}

body.standalone #sideR,body.standalone #sideB{top:252px}
#gEdit{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.13);border:1px solid #ffffff59;border-radius:8px;
 padding:3px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

 border:1px solid #ffffff59;border-radius:16px;padding:16px;width:84%;max-width:320px;color:#fff;box-shadow:0 10px 34px #0007}

 color:#fff;font-size:15px;-webkit-user-select:text;user-select:text;outline:none}
#tedit .row{display:flex;gap:8px;margin-top:14px}
#tedit button{flex:1;padding:9px;border-radius:9px;border:1px solid #ffffff59;background:rgba(255,255,255,.13);
 color:#fff;font-size:13.5px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

<script>window.GAME3D = {};</script>
<script>
GAME3D['pillow'] = { create: function(THREE) { const T = THREE; const scene = new T.Scene(); const skyCol = 0xf8cb8e; scene.background = new T.Color(skyCol); scene.fog = new T.Fog(skyCol, 15, 36);



const camera = new T.PerspectiveCamera(55, 0.5625, 0.2, 60);
camera.position.set(0, 3.4, 8.2);
camera.lookAt(0, 1.7, -0.3);

const hemi = new T.HemisphereLight(0xfff5dc, 0x8b6e4b, 0.95);
scene.add(hemi);

const dirLight = new T.DirectionalLight(0xfff0c8, 1.35);
dirLight.position.set(4.5, 11.0, 6.5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.left = -4.6;
dirLight.shadow.camera.right = 4.6;
dirLight.shadow.camera.top = 5.6;
dirLight.shadow.camera.bottom = -3.6;
dirLight.shadow.camera.near = 1.0;
dirLight.shadow.camera.far = 22.0;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

function stdMat(color, rough, extra) {
  const cfg = { color: color, roughness: rough !== undefined ? rough : 0.82, metalness: 0.02 };
  if (extra) {
    for (const k in extra) cfg[k] = extra[k];
  }
  return new T.MeshStandardMaterial(cfg);
}

const M = {
  water: stdMat(0x1f8ac9, 0.18, { metalness: 0.12 }),
  sand: stdMat(0xd9a667, 0.88),
  sandDark: stdMat(0xba8548, 0.88),
  bamboo: stdMat(0xbba64e, 0.78),
  bambooDark: stdMat(0x7d6c2c, 0.82),
  wood: stdMat(0x9a6438, 0.85),
  woodDark: stdMat(0x6e4424, 0.88),
  roof: stdMat(0xc83a2b, 0.82),
  gold: stdMat(0xf4bc3a, 0.75),
  bannerRed: stdMat(0xd62839, 0.82),
  trunk: stdMat(0x825a36, 0.88),
  frond: stdMat(0x3a8f3e, 0.82),
  rope: stdMat(0x5a4630, 0.9),
  skin: stdMat(0xdc9e70, 0.8),
  eye: stdMat(0x1c1412, 0.75),
  thanaka: stdMat(0xf6eaab, 0.85),
  redTop: stdMat(0xe63946, 0.8),
  redLongyi: stdMat(0x8f1d28, 0.85, { side: T.DoubleSide }),
  blueTop: stdMat(0x1d78e6, 0.8),
  blueLongyi: stdMat(0x10438a, 0.85, { side: T.DoubleSide }),
  pillow: stdMat(0xfbf7ef, 0.88),
  feather: stdMat(0xffffff, 0.85, { side: T.DoubleSide }),
  drop: stdMat(0xe4f9ff, 0.22),
  crowd: [
    stdMat(0xe85d75, 0.84),
    stdMat(0xf4a236, 0.84),
    stdMat(0x2fa87b, 0.84),
    stdMat(0x9b5de5, 0.84),
    stdMat(0x2892d7, 0.84),
    stdMat(0xf26444, 0.84)
  ],
  pennant: [
    stdMat(0xe63946, 0.82),
    stdMat(0xf4c430, 0.82),
    stdMat(0x18a999, 0.82),
    stdMat(0xd9387a, 0.82),
    stdMat(0xf27d24, 0.82)
  ]
};

function makePillowGeo() {
  const g = new T.BoxGeometry(0.62, 0.48, 0.34, 4, 4, 4);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const nx = x / 0.31;
    const ny = y / 0.24;
    const nz = z / 0.17;
    const r2 = nx * nx + ny * ny;
    const puff = 1 + 0.34 * Math.max(0, 1 - r2 * 0.55);
    const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    const k = 0.72 + 0.28 / Math.max(1, len);
    pos.setXYZ(i, x * k, y * k, z * k * puff);
  }
  g.computeVertexNormals();
  return g;
}

const G = {
  head: new T.SphereGeometry(0.22, 14, 12),
  eye: new T.SphereGeometry(0.032, 7, 6),
  thanaka: new T.CylinderGeometry(0.06, 0.06, 0.012, 10),
  gaung: new T.TorusGeometry(0.205, 0.052, 8, 16),
  torso: new T.BoxGeometry(0.44, 0.6, 0.28),
  longyi: new T.CylinderGeometry(0.22, 0.28, 0.52, 12, 1, true),
  limb: new T.CapsuleGeometry(0.072, 0.42, 4, 8),
  leg: new T.CapsuleGeometry(0.082, 0.5, 4, 8),
  pillow: makePillowGeo(),
  trim: new T.BoxGeometry(0.64, 0.09, 0.39),
  crowdBody: new T.CylinderGeometry(0.16, 0.22, 0.58, 8),
  crowdHead: new T.SphereGeometry(0.16, 8, 7),
  pennant: new T.ConeGeometry(0.24, 0.44, 3),
  frond: new T.ConeGeometry(0.38, 2.35, 4),
  ring: new T.RingGeometry(0.18, 0.29, 20),
  drop: new T.SphereGeometry(0.11, 7, 6),
  feather: new T.PlaneGeometry(0.2, 0.1)
};

const LOG_Y = 1.45;
const LOG_R = 0.22;
const STAND_Y = LOG_Y + LOG_R;

// Pond and banks
const water = new T.Mesh(new T.PlaneGeometry(24, 16), M.water);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0, 2.2);
water.receiveShadow = true;
scene.add(water);

const farBank = new T.Mesh(new T.BoxGeometry(24, 0.9, 13), M.sand);
farBank.position.set(0, -0.15, -10.5);
farBank.receiveShadow = true;
scene.add(farBank);

const sideMoundGeo = new T.BoxGeometry(5.5, 1.1, 6.5);
const leftBank = new T.Mesh(sideMoundGeo, M.sandDark);
leftBank.position.set(-5.8, 0.05, -2.5);
leftBank.receiveShadow = true;
scene.add(leftBank);

const rightBank = new T.Mesh(sideMoundGeo, M.sandDark);
rightBank.position.set(5.8, 0.05, -2.5);
rightBank.receiveShadow = true;
scene.add(rightBank);

// Main bamboo log and supports
const logMesh = new T.Mesh(new T.CylinderGeometry(LOG_R, LOG_R, 8.2, 16), M.bamboo);
logMesh.rotation.z = Math.PI / 2;
logMesh.position.set(0, LOG_Y, 0);
logMesh.castShadow = true;
logMesh.receiveShadow = true;
scene.add(logMesh);

const nodeGeo = new T.TorusGeometry(LOG_R + 0.012, 0.025, 6, 16);
for (let i = 0; i < 2; i++) {
  const node = new T.Mesh(nodeGeo, M.bambooDark);
  node.rotation.y = Math.PI / 2;
  node.position.set(i === 0 ? -1.45 : 1.45, LOG_Y, 0);
  scene.add(node);
}

const postGeo = new T.CylinderGeometry(0.085, 0.1, 2.5, 8);
const supportX = [-2.75, 2.75];
for (let i = 0; i < 2; i++) {
  const sx = supportX[i];
  const p1 = new T.Mesh(postGeo, M.bambooDark);
  p1.position.set(sx, 0.72, -0.22);
  p1.rotation.x = 0.28;
  scene.add(p1);
  const p2 = new T.Mesh(postGeo, M.bambooDark);
  p2.position.set(sx, 0.72, 0.22);
  p2.rotation.x = -0.28;
  scene.add(p2);
}

// Bamboo fence on far bank
const fencePostGeo = new T.CylinderGeometry(0.07, 0.08, 1.35, 7);
const fenceXs = [-3.2, 0, 3.2];
for (let i = 0; i < 3; i++) {
  const fp = new T.Mesh(fencePostGeo, M.bambooDark);
  fp.position.set(fenceXs[i], 0.9, -4.6);
  scene.add(fp);
}
const fenceRailGeo = new T.CylinderGeometry(0.055, 0.055, 8.6, 7);
for (let i = 0; i < 2; i++) {
  const fr = new T.Mesh(fenceRailGeo, M.bamboo);
  fr.rotation.z = Math.PI / 2;
  fr.position.set(0, 0.72 + i * 0.48, -4.6);
  scene.add(fr);
}

// Tiered stands
const step1 = new T.Mesh(new T.BoxGeometry(7.6, 0.6, 1.0), M.wood);
step1.position.set(0, 0.6, -5.65);
scene.add(step1);

const step2 = new T.Mesh(new T.BoxGeometry(7.6, 1.25, 1.0), M.woodDark);
step2.position.set(0, 0.92, -6.6);
scene.add(step2);

const backBoard = new T.Mesh(new T.BoxGeometry(7.8, 1.1, 0.16), M.wood);
backBoard.position.set(0, 2.05, -7.15);
scene.add(backBoard);

// Fair pavilions and banners
const pavPoleGeo = new T.CylinderGeometry(0.09, 0.1, 3.8, 7);
const pavRoofGeo = new T.ConeGeometry(1.75, 1.35, 4);
const pavTrimGeo = new T.BoxGeometry(2.5, 0.22, 2.5);
const pavXs = [-2.9, 2.9];
for (let i = 0; i < 2; i++) {
  const px = pavXs[i];
  const poleL = new T.Mesh(pavPoleGeo, M.bambooDark);
  poleL.position.set(px - 0.85, 2.2, -7.2);
  scene.add(poleL);
  const poleR = new T.Mesh(pavPoleGeo, M.bambooDark);
  poleR.position.set(px + 0.85, 2.2, -7.2);
  scene.add(poleR);
  const roof = new T.Mesh(pavRoofGeo, M.roof);
  roof.position.set(px, 4.75, -7.2);
  roof.rotation.y = Math.PI / 4;
  scene.add(roof);
  const trim = new T.Mesh(pavTrimGeo, M.gold);
  trim.position.set(px, 4.08, -7.2);
  scene.add(trim);
}

const bannerGeo = new T.BoxGeometry(0.52, 1.55, 0.08);
for (let i = 0; i < 2; i++) {
  const b = new T.Mesh(bannerGeo, i === 0 ? M.bannerRed : M.gold);
  b.position.set(i === 0 ? -0.95 : 0.95, 2.75, -7.02);
  scene.add(b);
}

// Crowd on stands
const crowd = [];
const crowdCoords = [
  [-2.35, 1.18, -5.6, 'red'],
  [-0.85, 1.18, -5.6, 'red'],
  [0.85, 1.18, -5.6, 'blue'],
  [2.35, 1.18, -5.6, 'blue'],
  [-1.75, 1.82, -6.55, 'red'],
  [-0.45, 1.82, -6.55, 'red'],
  [0.45, 1.82, -6.55, 'blue'],
  [1.75, 1.82, -6.55, 'blue']
];
for (let i = 0; i < crowdCoords.length; i++) {
  const c = crowdCoords[i];
  const g = new T.Group();
  const body = new T.Mesh(G.crowdBody, M.crowd[i % M.crowd.length]);
  body.position.y = 0.29;
  g.add(body);
  const head = new T.Mesh(G.crowdHead, M.skin);
  head.position.y = 0.72;
  g.add(head);
  g.position.set(c[0], c[1], c[2]);
  scene.add(g);
  crowd.push({ g: g, baseY: c[1], phase: i * 1.17, side: c[3] });
}

// Palm trees
const palms = [];
const trunkGeo = new T.CylinderGeometry(0.13, 0.24, 6.2, 7);
const palmSpecs = [
  { x: -3.7, z: -8.3, tilt: 0.14 },
  { x: 3.7, z: -8.3, tilt: -0.14 }
];
for (let i = 0; i < 2; i++) {
  const sp = palmSpecs[i];
  const pg = new T.Group();
  pg.position.set(sp.x, 0.2, sp.z);
  pg.rotation.z = sp.tilt;
  const trunk = new T.Mesh(trunkGeo, M.trunk);
  trunk.position.y = 3.1;
  pg.add(trunk);
  const crown = new T.Group();
  crown.position.y = 6.15;
  pg.add(crown);
  const frondAngles = [0.2, 1.75, 3.35, 4.9];
  for (let f = 0; f < 4; f++) {
    const fg = new T.Group();
    fg.rotation.y = frondAngles[f];
    const fm = new T.Mesh(G.frond, M.frond);
    fm.scale.set(1.0, 1.0, 0.24);
    fm.position.set(1.05, -0.15, 0);
    fm.rotation.z = -1.25;
    fg.add(fm);
    crown.add(fg);
  }
  scene.add(pg);
  palms.push({ crown: crown, phase: i * 2.1 });
}

// Water rings pool
const rings = [];
for (let i = 0; i < 6; i++) {
  const rMat = new T.MeshBasicMaterial({
    color: 0xdff7ff,
    transparent: true,
    opacity: 0,
    depthWrite: false
  });
  const rm = new T.Mesh(G.ring, rMat);
  rm.rotation.x = -Math.PI / 2;
  rm.visible = false;
  scene.add(rm);
  rings.push({ mesh: rm, mat: rMat, active: false, t: 0, dur: 1, maxS: 2, baseOp: 0.5 });
}

function spawnRing(x, z, maxS, dur, op) {
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (!r.active) {
      r.active = true;
      r.t = 0;
      r.dur = dur;
      r.maxS = maxS;
      r.baseOp = op;
      r.mesh.position.set(x, 0.03, z);
      r.mesh.scale.set(0.3, 0.3, 1);
      r.mat.opacity = op;
      r.mesh.visible = true;
      return;
    }
  }
}

// Splash droplets pool
const drops = [];
for (let i = 0; i < 8; i++) {
  const dm = new T.Mesh(G.drop, M.drop);
  dm.visible = false;
  scene.add(dm);
  drops.push({ mesh: dm, active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 1 });
}

function spawnSplash(x, z) {
  spawnRing(x, z, 3.6, 1.05, 0.85);
  spawnRing(x, z, 2.3, 0.72, 0.7);
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i];
    const ang = (i / drops.length) * Math.PI * 2 + (i % 2) * 0.25;
    const spd = 1.4 + (i % 3) * 0.65;
    d.active = true;
    d.x = x;
    d.y = 0.15;
    d.z = z;
    d.vx = Math.cos(ang) * spd;
    d.vy = 3.8 + (i % 4) * 0.65;
    d.vz = Math.sin(ang) * spd;
    d.s = 0.85 + (i % 3) * 0.25;
    d.mesh.scale.set(d.s, d.s, d.s);
    d.mesh.position.set(d.x, d.y, d.z);
    d.mesh.visible = true;
  }
}

function spawnDrip(x, y, z) {
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i];
    if (!d.active) {
      d.active = true;
      d.x = x + (Math.random() - 0.5) * 0.35;
      d.y = y;
      d.z = z + (Math.random() - 0.5) * 0.25;
      d.vx = 0;
      d.vy = -0.3;
      d.vz = 0;
      d.s = 0.42;
      d.mesh.scale.set(0.42, 0.55, 0.42);
      d.mesh.position.set(d.x, d.y, d.z);
      d.mesh.visible = true;
      return;
    }
  }
}

  feathers.push({

  });

function spawnFeathers(x, y, z, count, spread, tornado) {
  let spawned = 0;
  for (let i = 0; i < feathers.length && spawned < count; i++) {
    const f = feathers[i];
    if (!f.active || count >= 12) {
      f.active = true;
      f.mode = tornado ? 1 : 0;
      f.life = 0;
      f.maxLife = tornado ? 2.1 : (1.35 + (i % 4) * 0.22);
      f.cx = x;
      f.cz = z;
      f.ang = (spawned / Math.max(1, count)) * Math.PI * 2;
      f.rad = 0.35 + (spawned % 3) * 0.28;
      if (tornado) {
        f.x = x + Math.cos(f.ang) * f.rad;
        f.y = y - 0.4 + (spawned / count) * 1.4;
        f.z = z + Math.sin(f.ang) * f.rad;
        f.vx = 0;
        f.vy = 0;
        f.vz = 0;
      } else {
        f.x = x + (Math.random() - 0.5) * 0.35;
        f.y = y + (Math.random() - 0.5) * 0.3;
        f.z = z + (Math.random() - 0.5) * 0.35;
        f.vx = (Math.random() - 0.5) * spread * 2.2;
        f.vy = 1.4 + Math.random() * spread * 1.4;
        f.vz = (Math.random() - 0.5) * spread * 1.8;
      }
      f.mesh.scale.set(1, 1, 1);
      f.mesh.position.set(f.x, f.y, f.z);
      f.mesh.visible = true;
      spawned++;
    }
  }
}

let elapsed = 0;
let ambientRingTimer = 0.4;
let cheerR = 0;
let cheerB = 0;

function getFighter(team) {
  return team === 'blue' ? blueF : redF;
}

function getOther(f) {
  return f === redF ? blueF : redF;
}

function startAction(f, tier) {
  f.actTier = tier;
  f.actT = 0;
  f.hitStage = 0;
  if (tier === 1) f.actDur = 0.56;
  else if (tier === 2) f.actDur = 0.96;
  else if (tier === 3) f.actDur = 0.98;
  else f.actDur = 1.6;
}

function triggerImpact(attacker, tier) {
  const opp = getOther(attacker);
  const midX = (attacker.root.position.x + opp.root.position.x) * 0.5;
  const midY = STAND_Y + 1.25;
  if (tier === 1) {
    opp.hitTimer = 0.52;
    opp.hitAmp = 0.46;
    spawnFeathers(midX, midY, 0.1, 4, 1.3, false);
  } else if (tier === 2) {
    opp.hitTimer = 0.72;
    opp.hitAmp = 0.74;
    spawnFeathers(midX, midY, 0.1, 6, 1.8, false);
  } else if (tier === 3) {
    opp.hitTimer = 1.05;
    opp.hitAmp = 1.05;
    spawnFeathers(midX, midY + 0.15, 0.15, 14, 2.7, false);
    if (attacker.team === 'red') cheerR = 1.2;
    else cheerB = 1.2;
  } else {
    opp.extremeTimer = 1.5;
    opp.hitTimer = 0.6;
    opp.hitAmp = 0.9;
    spawnFeathers(0, STAND_Y + 0.9, 0, 14, 2.5, true);
    cheerR = 1.4;
    cheerB = 1.4;
  }
}

function updateFighter(f, dt, bal, hp, shiftX, isOver, isWinner, isLoser) {
  const targetX = f.baseX + shiftX;

  // Check fall trigger
  if (f.state === 'log') {
    if (bal <= 0 || (isOver && isLoser)) {
      f.state = 'falling';
      f.fallTimer = 0;
      f.splashed = false;
      f.actTier = 0;
      f.qLen = 0;
      f.extremeTimer = 0;
      f.fallSide = f.team === 'red' ? 1 : 1;
    }
  }

  if (f.state === 'falling') {
    f.fallTimer += dt;
    const u = Math.min(1, f.fallTimer / 0.46);
    f.root.position.x = targetX + f.dir * (-0.35 * u);
    f.root.position.y = STAND_Y + 0.55 * u - 2.35 * u * u;
    f.root.position.z = 1.45 * u;
    f.body.position.set(0, 0, 0);
    f.body.rotation.set(0.3 * u, 0, -f.dir * 2.1 * u);
    f.torso.rotation.set(-0.2, 0, 0);
    f.armL.rotation.set(-2.4, 0, -0.7);
    f.armR.rotation.set(-2.4, 0, 0.7);
    f.legL.rotation.set(0.6 * Math.sin(f.fallTimer * 18), 0, 0);
    f.legR.rotation.set(-0.6 * Math.sin(f.fallTimer * 18), 0, 0);
    f.pillowPivot.scale.set(1, 1, 1);
    f.pillowPivot.position.set(0, 0.5, 0.45);
    if (u >= 1) {
      if (!f.splashed) {
        f.splashed = true;
        spawnSplash(f.root.position.x, f.root.position.z);
      }
      f.state = 'splash';
    }
    return;
  }

  if (f.state === 'splash') {
    f.fallTimer += dt;
    const t = f.fallTimer - 0.46;
    f.root.position.y = -0.35 + Math.sin(t * 11) * 0.12;
    f.body.rotation.set(0, 0, Math.sin(t * 9) * 0.25);
    f.armL.rotation.set(-1.6 + Math.sin(t * 16) * 0.7, 0, -0.8);
    f.armR.rotation.set(-1.6 - Math.sin(t * 16) * 0.7, 0, 0.8);
    f.legL.rotation.set(Math.sin(t * 14) * 0.5, 0, 0);
    f.legR.rotation.set(-Math.sin(t * 14) * 0.5, 0, 0);
    if (f.fallTimer >= 1.05) {
      f.state = 'climb';
      f.dripTimer = 0;
    }
    return;
  }

  if (f.state === 'climb') {
    f.fallTimer += dt;
    const cU = Math.min(1, (f.fallTimer - 1.05) / 0.85);
    f.root.position.x = f.baseX * 1.15;
    f.root.position.z = 1.45 + (-4.45 - 1.45) * cU;
    f.root.position.y = -0.35 + (0.35 - (-0.35)) * cU;
    f.body.rotation.set(0.28 * (1 - cU), 0, Math.sin(elapsed * 6) * 0.08);
    f.torso.rotation.set(0.2, 0, 0);
    f.head.rotation.set(0.25, 0, Math.sin(elapsed * 5) * 0.1);
    f.armL.rotation.set(-0.5 + Math.sin(elapsed * 8) * 0.25, 0, -0.2);
    f.armR.rotation.set(-0.5 - Math.sin(elapsed * 8) * 0.25, 0, 0.2);
    f.legL.rotation.set(Math.sin(elapsed * 8) * 0.3 * (1 - cU), 0, 0);
    f.legR.rotation.set(-Math.sin(elapsed * 8) * 0.3 * (1 - cU), 0, 0);
    f.pillowPivot.position.set(0, 0.22, 0.42);
    f.pillowPivot.rotation.set(0.3, 0, 0);

    f.dripTimer += dt;
    if (f.dripTimer > 0.26) {
      f.dripTimer = 0;
      spawnDrip(f.root.position.x, f.root.position.y + 1.05, f.root.position.z);
    }

    if (!isOver && ((f.fallTimer >= 2.5 && bal > 20) || (f.fallTimer >= 1.65 && bal > 50))) {
      f.state = 'hop';
      f.hopT = 0;
      f.hopStartX = f.root.position.x;
      f.hopStartY = f.root.position.y;
      f.hopStartZ = f.root.position.z;
    }
    return;
  }

  if (f.state === 'hop') {
    f.hopT += dt / 0.38;
    const u = Math.min(1, f.hopT);
    f.root.position.x = f.hopStartX + (targetX - f.hopStartX) * u;
    f.root.position.z = f.hopStartZ * (1 - u);
    f.root.position.y = f.hopStartY + (STAND_Y - f.hopStartY) * u + Math.sin(u * Math.PI) * 1.45;
    f.body.rotation.set(0, 0, 0);
    f.torso.rotation.set(0, 0, 0);
    f.armL.rotation.set(-1.3, 0, -0.2);
    f.armR.rotation.set(-1.3, 0, 0.2);
    f.legL.rotation.set(-0.45 * Math.sin(u * Math.PI), 0, 0);
    f.legR.rotation.set(-0.45 * Math.sin(u * Math.PI), 0, 0);
    if (u >= 1) {
      f.state = 'log';
      f.fallTimer = 0;
    }
    return;
  }

  // Standing on the log
  f.root.position.x += (targetX - f.root.position.x) * Math.min(1, dt * 7);
  f.root.position.y = STAND_Y;
  f.root.position.z = 0;

  // Pop queued gift action
  if (f.actTier === 0 && f.qLen > 0 && !isOver) {
    const nextTier = f.queue[0];
    for (let i = 0; i < f.qLen - 1; i++) f.queue[i] = f.queue[i + 1];
    f.qLen--;
    startAction(f, nextTier);
  }

  const balFrac = Math.max(0, Math.min(1, bal / 100));
  const wobbleAmp = 0.045 + (1 - balFrac) * (1 - balFrac) * 0.44;
  const wobbleSpd = 3.2 + (1 - balFrac) * 5.2;
  f.wobblePhase += dt * wobbleSpd;

  const breathSpd = 3.0 + (1 - Math.max(0, Math.min(1, hp / 100))) * 2.5;
  const breath = Math.sin(elapsed * breathSpd + (f === redF ? 0 : 1.5));

  let bodyRoll = Math.sin(f.wobblePhase) * wobbleAmp;
  let bodyPitch = Math.cos(f.wobblePhase * 0.7) * wobbleAmp * 0.22;
  let bodyYaw = 0;
  let bodyY = Math.abs(breath) * 0.03;

  let torsoPitch = 0.06 + breath * 0.04;
  let torsoYaw = 0;
  let torsoRoll = 0;
  let headPitch = 0;
  let headYaw = 0;
  let headRoll = -bodyRoll * 0.45;

  let armLX = -1.12;
  let armLZ = -0.22;
  let armRX = -1.12;
  let armRZ = 0.22;
  let legLX = -0.08;
  let legRX = 0.08;

  let pilX = 0;
  let pilY = 0.42 + breath * 0.03;
  let pilZ = 0.44;
  let pilRX = 0;
  let pilRZ = 0;
  let pilScale = 1.0;

  // Hit wobble recoil
  if (f.hitTimer > 0) {
    f.hitTimer = Math.max(0, f.hitTimer - dt);
    const hOsc = Math.sin(f.hitTimer * 28) * f.hitAmp * (f.hitTimer / 0.8);
    torsoPitch -= Math.abs(hOsc) * 0.45;
    headPitch -= hOsc * 0.65;
    headRoll += hOsc * 0.55;
    bodyRoll += hOsc * 0.32;
  }

  // Windmill arms when balance < 35
  if (bal < 35 && f.actTier === 0 && !isOver) {
    const panic = (35 - bal) / 35;
    const mill = elapsed * (11 + panic * 6);
    armLX = mill;
    armLZ = -1.15;
    armRX = -mill + 1.2;
    armRZ = 1.15;
    pilX = 0.35;
    pilY = 0.35 + Math.sin(mill) * 0.18;
    pilZ = 0.32;
    pilRZ = Math.cos(mill) * 0.7;
    legLX = Math.sin(mill * 0.5) * 0.25;
    legRX = -legLX;
  }

  // Extreme near-fall teeter from T4 cyclone
  if (f.extremeTimer > 0) {
    f.extremeTimer = Math.max(0, f.extremeTimer - dt);
    const ex = Math.min(1, f.extremeTimer * 2);
    const spin = elapsed * 16;
    bodyRoll = (0.48 + Math.sin(elapsed * 11) * 0.2) * ex;
    bodyPitch = Math.cos(elapsed * 9) * 0.18 * ex;
    bodyY = Math.abs(Math.sin(elapsed * 12)) * 0.12 * ex;
    legLX = -1.15 * ex;
    legRX = 0.15;
    armLX = spin;
    armLZ = -1.3;
    armRX = -spin;
    armRZ = 1.3;
    headRoll = Math.sin(elapsed * 18) * 0.45 * ex;
    pilX = 0.38;
    pilY = 0.45;
    pilZ = 0.25;
    pilRZ = Math.sin(spin) * 0.9;
  }

  // Taunt from onLike
  if (f.tauntTimer > 0 && f.actTier === 0 && f.extremeTimer <= 0) {
    f.tauntTimer = Math.max(0, f.tauntTimer - dt);
    const tu = Math.sin((f.tauntTimer / 0.65) * Math.PI);
    const wiggle = Math.sin(elapsed * 22);
    torsoRoll = wiggle * 0.22 * tu;
    torsoYaw = wiggle * 0.24 * tu;
    headPitch = -0.18 * tu;
    armLX = -2.35;
    armLZ = -0.18;
    armRX = -2.35;
    armRZ = 0.18;
    pilY = 0.92 + Math.abs(wiggle) * 0.1 * tu;
    pilZ = 0.2;
    pilRX = -0.35;
  }

  // Victory cheer
  if (isOver && isWinner) {
    const bounce = Math.abs(Math.sin(elapsed * 7.5));
    bodyY = bounce * 0.28;
    bodyRoll = Math.sin(elapsed * 3.75) * 0.08;
    armLX = -2.55;
    armLZ = -0.25;
    armRX = -2.55;
    armRZ = 0.25;
    pilY = 0.98 + bounce * 0.1;
    pilZ = 0.18;
    headPitch = -0.2;
  }

  // Gift attacks
  if (f.actTier > 0) {
    f.actT += dt;
    const p = Math.min(1, f.actT / f.actDur);
    if (f.actTier === 1) {
      if (p < 0.38) {
        const u = p / 0.38;
        torsoYaw = -0.68 * u;
        torsoPitch = -0.18 * u;
        pilX = 0.22 * u;
        pilY = 0.58;
        pilZ = 0.26;
        armLX = -1.55;
        armRX = -1.35;
      } else if (p < 0.64) {
        const u = (p - 0.38) / 0.26;
        torsoYaw = -0.68 + 1.48 * u;
        torsoPitch = -0.18 + 0.56 * u;
        pilX = 0.22 - 0.38 * u;
        pilY = 0.58 - 0.14 * u;
        pilZ = 0.26 + 0.58 * u;
        pilRX = 0.65 * u;
        armLX = -1.2;
        armRX = -1.2;
        if (f.hitStage === 0 && p >= 0.49) {
          f.hitStage = 1;
          triggerImpact(f, 1);
        }
      } else {
        const u = (p - 0.64) / 0.36;
        torsoYaw = 0.8 * (1 - u);
        torsoPitch = 0.38 * (1 - u);
        pilZ = 0.84 - 0.4 * u;
        pilRX = 0.65 * (1 - u);
      }
    } else if (f.actTier === 2) {
      const half = p < 0.5 ? 0 : 1;
      const lp = half === 0 ? p * 2 : (p - 0.5) * 2;
      const sgn = half === 0 ? 1 : -1;
      if (lp < 0.4) {
        const u = lp / 0.4;
        torsoYaw = -0.78 * sgn * u;
        torsoPitch = -0.2 * u;
        pilX = 0.28 * sgn * u;
        pilY = 0.62;
        pilZ = 0.24;
        armLX = -1.5;
        armRX = -1.5;
      } else if (lp < 0.72) {
        const u = (lp - 0.4) / 0.32;
        torsoYaw = (-0.78 + 1.65 * u) * sgn;
        torsoPitch = -0.2 + 0.62 * u;
        pilX = (0.28 - 0.5 * u) * sgn;
        pilY = 0.46;
        pilZ = 0.24 + 0.66 * u;
        pilRX = 0.72 * u;
        if (half === 0 && f.hitStage === 0 && lp >= 0.52) {
          f.hitStage = 1;
          triggerImpact(f, 2);
        } else if (half === 1 && f.hitStage === 1 && lp >= 0.52) {
          f.hitStage = 2;
          triggerImpact(f, 2);
        }
      } else {
        const u = (lp - 0.72) / 0.28;
        torsoYaw = 0.87 * sgn * (1 - u);
        torsoPitch = 0.42 * (1 - u);
        pilZ = 0.9 - 0.46 * u;
      }
    } else if (f.actTier === 3) {
      if (p < 0.42) {
        const u = p / 0.42;
        pilScale = 1.0 + 0.8 * u;
        bodyY = Math.sin(u * Math.PI * 0.5) * 0.22;
        torsoPitch = -0.35 * u;
        armLX = -2.45;
        armRX = -2.45;
        pilY = 0.42 + 0.68 * u;
        pilZ = 0.44 - 0.26 * u;
        pilRX = -0.55 * u;
      } else if (p < 0.66) {
        const u = (p - 0.42) / 0.24;
        pilScale = 1.8;
        bodyY = 0.22 * (1 - u);
        torsoPitch = -0.35 + 0.85 * u;
        armLX = -2.45 + 1.55 * u;
        armRX = -2.45 + 1.55 * u;
        pilY = 1.1 - 0.72 * u;
        pilZ = 0.18 + 0.82 * u;
        pilRX = -0.55 + 1.45 * u;
        if (f.hitStage === 0 && p >= 0.52) {
          f.hitStage = 1;
          triggerImpact(f, 3);
        }
      } else {
        const u = (p - 0.66) / 0.34;
        pilScale = 1.8 - 0.8 * u;
        torsoPitch = 0.5 * (1 - u);
        pilY = 0.38 + 0.04 * u;
        pilZ = 1.0 - 0.56 * u;
        pilRX = 0.9 * (1 - u);
      }
    } else {
      // Tier 4 cyclone spin
      const spinEase = p < 0.85 ? p / 0.85 : 1;
      bodyYaw = f.dir * spinEase * Math.PI * 6;
      bodyY = Math.sin(p * Math.PI) * 0.24;
      pilScale = 1.0 + 0.35 * Math.sin(p * Math.PI);
      armLX = -1.45;
      armLZ = -0.35;
      armRX = -1.45;
      armRZ = 0.35;
      pilY = 0.52;
      pilZ = 0.76;
      pilRX = 0.35;
      if (f.hitStage === 0 && p >= 0.22) {
        f.hitStage = 1;
        triggerImpact(f, 4);
      }
    }
    if (p >= 1) f.actTier = 0;
  }

  f.body.position.set(0, bodyY, 0);
  f.body.rotation.set(bodyPitch, bodyYaw, bodyRoll);
  f.torso.rotation.set(torsoPitch, torsoYaw, torsoRoll);
  f.head.rotation.set(headPitch, headYaw, headRoll);
  f.armL.rotation.set(armLX, 0, armLZ);
  f.armR.rotation.set(armRX, 0, armRZ);
  f.legL.rotation.set(legLX, 0, 0);
  f.legR.rotation.set(legRX, 0, 0);
  f.pillowPivot.position.set(pilX, pilY, pilZ);
  f.pillowPivot.rotation.set(pilRX, 0, pilRZ);
  f.pillowPivot.scale.set(pilScale, pilScale, pilScale);
}

function reset() {
  elapsed = 0;
  cheerR = 0;
  cheerB = 0;
  for (let i = 0; i < 2; i++) {
    const f = fighters[i];
    f.state = 'log';
    f.fallTimer = 0;
    f.splashed = false;
    f.actTier = 0;
    f.actT = 0;
    f.qLen = 0;
    f.hitTimer = 0;
    f.extremeTimer = 0;
    f.tauntTimer = 0;
    f.root.position.set(f.baseX, STAND_Y, 0);
    f.body.position.set(0, 0, 0);
    f.body.rotation.set(0, 0, 0);
    f.torso.rotation.set(0, 0, 0);
    f.head.rotation.set(0, 0, 0);
    f.armL.rotation.set(-1.12, 0, -0.22);
    f.armR.rotation.set(-1.12, 0, 0.22);
    f.legL.rotation.set(-0.08, 0, 0);
    f.legR.rotation.set(0.08, 0, 0);
    f.pillowPivot.position.set(0, 0.42, 0.44);
    f.pillowPivot.rotation.set(0, 0, 0);
    f.pillowPivot.scale.set(1, 1, 1);
  }
  for (let i = 0; i < feathers.length; i++) {
    feathers[i].active = false;
    feathers[i].mesh.visible = false;
  }
  for (let i = 0; i < drops.length; i++) {
    drops[i].active = false;
    drops[i].mesh.visible = false;
  }
  for (let i = 0; i < rings.length; i++) {
    rings[i].active = false;
    rings[i].mesh.visible = false;
  }
}

reset();

return {
  scene: scene,
  camera: camera,
  update: function(dt, S) {
    dt = Math.min(Math.max(dt || 0, 0), 0.05);
    elapsed += dt;
    const st = S || {};
    const pVal = typeof st.p === 'number' ? Math.max(-1, Math.min(1, st.p)) : 0;
    const balR = typeof st.balR === 'number' ? st.balR : 100;
    const balB = typeof st.balB === 'number' ? st.balB : 100;
    const hpR = typeof st.hpR === 'number' ? st.hpR : 100;
    const hpB = typeof st.hpB === 'number' ? st.hpB : 100;
    const isOver = Boolean(st.over);
    const winner = st.winner || '';

    const shiftX = pVal * 0.42;
    updateFighter(redF, dt, balR, hpR, shiftX, isOver, winner === 'red', winner === 'blue');
    updateFighter(blueF, dt, balB, hpB, shiftX, isOver, winner === 'blue', winner === 'red');

    // Ambient pond ripples
    water.position.y = Math.sin(elapsed * 2.1) * 0.025;
    ambientRingTimer -= dt;
    if (ambientRingTimer <= 0) {
      ambientRingTimer = 0.85 + Math.random() * 0.7;
      spawnRing((Math.random() - 0.5) * 4.4, -2.0 + Math.random() * 6.0, 1.7, 1.4, 0.36);
    }

    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      if (!r.active) continue;
      r.t += dt;
      const u = r.t / r.dur;
      if (u >= 1) {
        r.active = false;
        r.mesh.visible = false;
      } else {
        const sc = 0.3 + u * r.maxS;
        r.mesh.scale.set(sc, sc, 1);
        r.mat.opacity = r.baseOp * (1 - u);
      }
    }

    // Splash droplets
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      if (!d.active) continue;
      d.vy -= 12.5 * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.z += d.vz * dt;
      d.mesh.position.set(d.x, d.y, d.z);
      if (d.y < -0.05) {
        d.active = false;
        d.mesh.visible = false;
      }
    }

    // Feathers
    for (let i = 0; i < feathers.length; i++) {
      const f = feathers[i];
      if (!f.active) continue;
      f.life += dt;
      const u = f.life / f.maxLife;
      if (u >= 1 || f.y < 0.05) {
        f.active = false;
        f.mesh.visible = false;
        continue;
      }
      if (f.mode === 1) {
        f.ang += dt * 9.5;
        f.rad += dt * 0.65;
        f.x = f.cx + Math.cos(f.ang) * f.rad;
        f.z = f.cz + Math.sin(f.ang) * f.rad;
        f.y += dt * 1.45;
        if (f.life > 1.05) {
          f.mode = 0;
          f.vx = -Math.sin(f.ang) * 1.1;
          f.vy = 0.3;
          f.vz = Math.cos(f.ang) * 1.1;
        }
      } else {
        f.vx *= (1 - dt * 2.4);
        f.vz *= (1 - dt * 2.4);
        f.vy = Math.max(-0.95, f.vy - 3.6 * dt);
        f.x += (f.vx + Math.sin(elapsed * 6.5 + f.phase) * 0.55) * dt;
        f.y += f.vy * dt;
        f.z += (f.vz + Math.cos(elapsed * 5.2 + f.phase) * 0.35) * dt;
      }
      f.mesh.position.set(f.x, f.y, f.z);
      f.mesh.rotation.set(
        elapsed * 4.2 + f.phase,
        elapsed * 3.1 + f.phase,
        Math.sin(elapsed * 5.5 + f.phase) * 1.1
      );
      const sc = u > 0.72 ? Math.max(0.01, (1 - u) / 0.28) : 1;
      f.mesh.scale.set(sc, sc, sc);
    }

    // Crowd, palms, pennants
    cheerR = Math.max(0, cheerR - dt * 1.2);
    cheerB = Math.max(0, cheerB - dt * 1.2);
    for (let i = 0; i < crowd.length; i++) {
      const c = crowd[i];
      const boost = c.side === 'red' ? cheerR : cheerB;
      const spd = 4.2 + boost * 6.5;
      const amp = 0.055 + boost * 0.14;
      c.g.position.y = c.baseY + Math.abs(Math.sin(elapsed * spd + c.phase)) * amp;
    }
    for (let i = 0; i < palms.length; i++) {
      const pm = palms[i];
      pm.crown.rotation.z = Math.sin(elapsed * 1.6 + pm.phase) * 0.06;
      pm.crown.rotation.x = Math.cos(elapsed * 1.3 + pm.phase) * 0.04;
    }
    for (let i = 0; i < pennants.length; i++) {
      const pn = pennants[i];
      pn.mesh.rotation.x = Math.PI + Math.sin(elapsed * 4.5 + pn.phase) * 0.26;
    }
  },
  onJoin: function(team) {
    if (team === 'blue') cheerB = Math.max(cheerB, 0.7);
    else cheerR = Math.max(cheerR, 0.7);
  },
  onGift: function(team, tier) {
    const f = getFighter(team);
    const t = Math.max(1, Math.min(4, tier || 1));
    if (team === 'blue') cheerB = Math.max(cheerB, 0.6 + t * 0.2);
    else cheerR = Math.max(cheerR, 0.6 + t * 0.2);
    if (f.state !== 'log') return;
    if (f.actTier === 0) {
      startAction(f, t);
    } else if (f.qLen < 4) {
      f.queue[f.qLen++] = t;
    }
  },
  onLike: function(team) {
    const f = getFighter(team);
    if (team === 'blue') cheerB = Math.max(cheerB, 0.5);
    else cheerR = Math.max(cheerR, 0.5);
    if (f.state === 'log' && f.actTier === 0) {
      f.tauntTimer = 0.65;
    }
  },
  reset: reset
};

} };

<script>
(function(){
"use strict";
var CFG = {"id": "pillow", "metric": "bal", "guide": [["Gift 1–99", "ခေါင်းအုံး ရိုက်"], ["Gift 100–499", "နှစ်ချက် တွဲ ရိုက်"], ["Gift 500–999", "ခေါင်းအုံး အကြီး"], ["Gift 1000+", "မုန်တိုင်း လှည့် ရိုက်"]], "btn": ["နှစ်ချက်ရိုက်", "ခေါင်းအုံးအကြီး"], "climb": null};
var $ = function(id){ return document.getElementById(id); };
// ---------- team names (editable, saved on this device) ----------
var TN = { red: 'အနီ', blue: 'အပြာ' };
try { TN.red = localStorage.getItem('nlo_team_red') || TN.red; TN.blue = localStorage.getItem('nlo_team_blue') || TN.blue; } catch(e){}
function tn(t){ return t==='red' ? TN.red : TN.blue; }
function applyNames(){
  $('nmR').textContent = '🔴 ' + TN.red; $('nmB').textContent = '🔵 ' + TN.blue;
  $('howtoTx').textContent = 'မန့် ၁ = ' + TN.red + ' · မန့် ၂ = ' + TN.blue + ' join — Gift ပို့ရင် စမယ်';
}
$('gEdit').addEventListener('click', function(e){ e.stopPropagation(); $('tnR').value = TN.red; $('tnB').value = TN.blue; $('tedit').classList.add('show'); });
$('tnCancel').addEventListener('click', function(){ $('tedit').classList.remove('show'); });
$('tnSave').addEventListener('click', function(){
  var r = $('tnR').value.trim(), b = $('tnB').value.trim();
  if (r) TN.red = r.slice(0,24); if (b) TN.blue = b.slice(0,24);
  try { localStorage.setItem('nlo_team_red', TN.red); localStorage.setItem('nlo_team_blue', TN.blue); } catch(e){}
  applyNames(); $('tedit').classList.remove('show'); tick('✎ အသင်းနာမည်များ ပြောင်းပြီ — ' + TN.red + ' / ' + TN.blue);
});
// ---------- guide ----------
CFG.guide.forEach(function(g){ var d=document.createElement('div'); d.innerHTML='<b>'+g[0]+'</b> — '+g[1]; $('gRows').appendChild(d); });
$('gTog').addEventListener('click', function(e){ e.stopPropagation(); $('guide').classList.toggle('closed'); $('gTog').textContent = $('guide').classList.contains('closed') ? '▸' : '▾'; });
// ---------- state ----------
var S = { p:0, hpR:100, hpB:100, hR:0, hB:0, balR:100, balB:100, scoreR:0, scoreB:0, t:0, running:false, over:false, winner:null };
var M = { red:{members:0, gifts:0, power:0, names:[]}, blue:{members:0, gifts:0, power:0, names:[]} };
var round = 1, timeLeft = 90, goldUntil = {red:0, blue:0}, lastHit = {red:-9, blue:-9};
var game = null;
try { game = GAME3D[CFG.id].create(THREE); } catch(e){ showPop('Error', String(e).slice(0,80)); }
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
function resize(){ var w=innerWidth, h=innerHeight; renderer.setSize(w,h); if(game){ game.camera.aspect=w/h; game.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);
// ---------- helpers ----------
function tierOf(coins){ return coins>=1000?4 : coins>=500?3 : coins>=100?2 : 1; }
var GC = { red:{}, blue:{} };
var GIFT_EMOJI = [['rose','🌹'],['finger','🫰'],['heart','❤️'],['love','💗'],['crown','👑'],['lion','🦁'],['whale','🐳'],['rocket','🚀'],['car','🏎️'],['money','💸'],['star','⭐'],['tiktok','🎶'],['flower','🌸'],['diamond','💎'],['ring','💍'],['cake','🎂'],['beer','🍺'],['coffee','☕']];
function giftEmoji(name){ var s=(name||'').toLowerCase(); for (var i=0;i<GIFT_EMOJI.length;i++) if (s.indexOf(GIFT_EMOJI[i][0])>=0) return GIFT_EMOJI[i][1]; return '🎁'; }
function renderGifts(team){
  var box = $(team==='red' ? 'giftsR' : 'giftsB');
  var items = Object.keys(GC[team]).map(function(k){ return [k, GC[team][k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,4);
  box.innerHTML = '';
  items.forEach(function(it){ var d=document.createElement('div'); d.className='grow';
    d.innerHTML = '<span>'+giftEmoji(it[0])+'</span><span class="n"></span><span class="c">×'+num(it[1])+'</span>';
    d.querySelector('.n').textContent = it[0]; box.appendChild(d); });
  box.style.display = items.length ? 'flex' : 'none';
}
// ---------- members: everyone in the LIVE is a viewer; join = team member (no limit) ----------
var MEMBERS = { red: [], blue: [] };
function mOther(team){ return team==='red' ? 'blue' : 'red'; }
function mHas(team, name){ return MEMBERS[team].indexOf(name) >= 0; }
function mAdd(team, name){ var o = mOther(team); var i = MEMBERS[o].indexOf(name); if (i>=0) MEMBERS[o].splice(i,1); if (!mHas(team, name)) MEMBERS[team].push(name); }
function renderSide(team){ renderGifts(team); }
function showPop(big, sub, ms){ $('popBig').textContent=big; $('popSub').textContent=sub||''; var p=$('popup'); p.classList.add('show'); clearTimeout(showPop._t); showPop._t=setTimeout(function(){ p.classList.remove('show'); }, ms||2100); }
var FXC = ['#ffd54d','#ff5a8a','#4da3ff','#7dff8a','#ff9d2e','#ffffff'];
function burst(team, tier){
  var box = $('fx'); var n = [0,0,14,24,42][tier]; if (!n) return;
  var x0 = team==='red' ? innerWidth*0.24 : innerWidth*0.76;
  for (var i=0;i<n;i++){
    var d = document.createElement('div'); d.className='cf';
    d.style.background = FXC[i % FXC.length];
    d.style.left = (x0 + (Math.random()-0.5)*innerWidth*0.36) + 'px';
    d.style.top = (innerHeight*0.16 + Math.random()*30) + 'px';
    box.appendChild(d);
    var dx = (Math.random()-0.5)*120, dy = innerHeight*(0.28+Math.random()*0.3), rot = (Math.random()-0.5)*540;
    var anim = d.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)', opacity:0.15 }
    ], { duration: 950+Math.random()*650, easing:'cubic-bezier(.2,.7,.3,1)' });
    (function(el, a){ a.onfinish = function(){ el.remove(); }; })(d, anim);
  }
  if (tier>=4){
    var f = $('flash'); f.style.borderColor = team==='red' ? '#ff4d7e' : '#3fa9ff';
    f.animate([{opacity:0},{opacity:0.85, offset:0.25},{opacity:0}], { duration: 900, easing:'ease-out' });
  }
}
function tick(txt){ var d=document.createElement('div'); d.textContent=txt; var box=$('ticker'); box.appendChild(d); while(box.children.length>4) box.removeChild(box.firstChild); setTimeout(function(){ d.style.opacity='0.35'; }, 6000); setTimeout(function(){ d.remove(); }, 9000); }
function num(n){ return String(n).replace(/\d/g, function(c){ return '၀၁၂၃၄၅၆၇၈၉'[+c]; }); }
// ---------- game numbers ----------
function applyGift(team, tier, name, giftName){
  var foe = team==='red' ? 'blue' : 'red';
  M[team].gifts++; M[team].power += tier;
  GC[team][giftName] = (GC[team][giftName]||0) + 1; renderGifts(team);
  if (game) game.onGift(team, tier, name);
  var feat = CFG.guide[tier-1][1];
  if (CFG.metric==='p'){ S.p += (team==='red'?1:-1) * [0,.10,.22,.40,.70][tier]; }
  else if (CFG.metric==='h'){ if(team==='red') S.hR=Math.min(1,S.hR+[0,.03,.07,.13,.22][tier]); else S.hB=Math.min(1,S.hB+[0,.03,.07,.13,.22][tier]);
    if (tier===2){ if(foe==='red') S.hR=Math.max(0,S.hR-.04); else S.hB=Math.max(0,S.hB-.04); } }
  else if (CFG.metric==='hp'){ var dmg=[0,4,9,16,30][tier]; if(foe==='red') S.hpR=Math.max(0,S.hpR-dmg); else S.hpB=Math.max(0,S.hpB-dmg); lastHit[foe]=S.t; }
  else if (CFG.metric==='bal'){ var bd=[0,6,13,22,40][tier]; if(foe==='red') S.balR=Math.max(0,S.balR-bd); else S.balB=Math.max(0,S.balB-bd); lastHit[foe]=S.t; }
  else if (CFG.metric==='goal'){ S.p += (team==='red'?1:-1) * [0,.12,.26,.45,.85][tier]; if(tier===3) goldUntil[team]=S.t+5; if(tier===4 && Math.abs(S.p)>0.55){ goal(team); } }
  showPop(tn(team)+' — '+feat, name+' က '+giftName+' ပို့တယ်', tier>=4 ? 2600 : tier>=3 ? 2100 : 1500);
  burst(team, tier);
  tick('🎁 '+name+' → '+tn(team)+' · '+feat);
  syncHud();
}
function goal(team){ if(team==='red') S.scoreR++; else S.scoreB++; showPop('ဂိုး!!!', tn(team)+' ဂိုး ဝင်တယ်'); S.p=0; if(game) game.reset(); syncHud(); }
function winCheck(){
  if (S.over) return;
  var w=null;
  if (CFG.metric==='p' && Math.abs(S.p)>=1) w = S.p>0?'red':'blue';
  else if (CFG.metric==='h'){ if(S.hR>=1) w='red'; else if(S.hB>=1) w='blue'; }
  else if (CFG.metric==='hp'){ if(S.hpR<=0) w='blue'; else if(S.hpB<=0) w='red'; }
  else if (CFG.metric==='bal'){ if(S.balR<=0) w='blue'; else if(S.balB<=0) w='red'; }
  else if (CFG.metric==='goal' && timeLeft<=0){ w = S.scoreR===S.scoreB ? null : (S.scoreR>S.scoreB?'red':'blue'); if(!w){ timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); return; } }
  if (w) endRound(w);
}
function endRound(w){ S.over=true; S.winner=w; S.running=false; if(w==='red') M.red.wins=(M.red.wins||0)+1; else M.blue.wins=(M.blue.wins||0)+1;
  showPop('🏆 '+tn(w)+' အနိုင်ရ!', 'ပွဲစဉ် '+num(round)+' ပြီးပြီ — နောက် ပွဲစဉ် မကြာမီ');
  setTimeout(newRound, 6000); syncHud(); }
function newRound(){ round++;
  S.p=0; S.hpR=S.hpB=100; S.hR=S.hB=0; S.balR=S.balB=100; S.t=0; S.over=false; S.winner=null; S.running=true; timeLeft=90; if(game) game.reset(); $('rd').textContent=num(round); syncHud(); }
function syncHud(){
  $('pR').textContent=num(MEMBERS.red.length); $('pB').textContent=num(MEMBERS.blue.length);
  $('gR').textContent=num(M.red.gifts); $('gB').textContent=num(M.blue.gifts);
  $('sc').textContent = num(M.red.wins||0)+' — '+num(M.blue.wins||0);
  var pctR=50, pctB=50;
  if (CFG.metric==='p'){ pctR=50+S.p*50; pctB=100-pctR; }
  else if (CFG.metric==='h'){ pctR=S.hR*100; pctB=S.hB*100; }
  else if (CFG.metric==='hp'){ pctR=S.hpR; pctB=S.hpB; }
  else if (CFG.metric==='bal'){ pctR=S.balR; pctB=S.balB; }
  else if (CFG.metric==='goal'){ pctR=50+S.p*50; pctB=100-pctR; $('sc').textContent=num(S.scoreR)+' — '+num(S.scoreB); }
  $('bR').style.width=pctR+'%'; $('bB').style.width=pctB+'%';
  var vsR = pctR;
  if (CFG.metric!=='p' && CFG.metric!=='goal'){ var tot = pctR+pctB; vsR = tot>0 ? pctR/tot*100 : 50; }
  $('vsR').style.width=vsR+'%'; $('vsB').style.width=(100-vsR)+'%';
  $('vsL').textContent=num(Math.round(vsR))+'%'; $('vsRp').textContent=num(Math.round(100-vsR))+'%';
}
// ---------- events ----------
function onEvent(ev){
  if (!ev || !ev.kind) return;
  var team = ev.team==='blue' ? 'blue' : 'red';
  if (ev.kind==='join'){ var jn = ev.name||'Viewer'; var jo = mOther(team); var was = mHas(team, jn);
    mAdd(team, jn);
    if (!was) tick('👋 '+jn+' → '+tn(team)+' ဝင်ပြီ');
    if(game) game.onJoin(team); renderSide(team); renderSide(jo); }
  else if (ev.kind==='gift'){ var gn = ev.name||'Viewer';
    if (!mHas(team, gn)){ mAdd(team, gn); renderSide(mOther(team)); }
    renderSide(team);
    applyGift(team, tierOf(ev.coins||1), gn, ev.gift||'Gift'); }
  else if (ev.kind==='like'){ if(game) game.onLike(team); var tr = (M.red.power<M.blue.power)?'red':(M.blue.power<M.red.power?'blue':null); if(tr && CFG.metric==='p') S.p += (tr==='red'?1:-1)*0.02; }
  else if (ev.kind==='chat'){ tick('💬 '+ev.name+': '+(ev.text||'').slice(0,40)); }
  syncHud();
}
addEventListener('message', function(e){ var d=e.data; if(d && d.nlo===1) onEvent(d); });
if (parent && parent!==window) parent.postMessage({nlo:1, kind:'ready', game:CFG.id}, '*');
// ---------- demo (standalone debug) ----------
if (window.parent===window){
  document.body.classList.add('standalone');
  $('demoR').classList.add('show'); $('demoB').classList.add('show');
  var names=['Aung Aung','May May','Ko Ko','Thiri','Zaw Zaw','Nilar'];
  var demoDefs=[
   ['demoR','Join',function(){ onEvent({kind:'join',team:'red',name:names[Math.random()*6|0]}); }],
   ['demoB','Join',function(){ onEvent({kind:'join',team:'blue',name:names[Math.random()*6|0]}); }]
  ];
  if (CFG.climb){
    demoDefs.push(['demoR',CFG.climb,function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Heart',coins:99}); }]);
    demoDefs.push(['demoB',CFG.climb,function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Heart',coins:99}); }]);
  }
  demoDefs.push(['demoR',CFG.btn[0],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoR',CFG.btn[1],function(){ onEvent({kind:'gift',team:'red',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.push(['demoB',CFG.btn[0],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Rose',coins:199}); }]);
  demoDefs.push(['demoB',CFG.btn[1],function(){ onEvent({kind:'gift',team:'blue',name:'Fan',gift:'Crown',coins:599}); }]);
  demoDefs.forEach(function(b){ var btn=document.createElement('button'); btn.textContent=b[1]; btn.addEventListener('click', b[2]); $(b[0]).appendChild(btn); });
}
// ---------- loop ----------
S.running = true;
var last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  if (S.running && !S.over){
    S.t += dt; timeLeft -= dt;
    if (CFG.metric==='bal'){ ['red','blue'].forEach(function(tm){ var k=tm==='red'?'balR':'balB'; if (S.t-lastHit[tm]>2.5) S[k]=Math.min(100, S[k]+dt*2.2); }); }
    if (timeLeft<=0 && CFG.metric!=='goal'){ var w=null;
      if(CFG.metric==='p') w = S.p===0?null:(S.p>0?'red':'blue');
      else if(CFG.metric==='h') w = S.hR===S.hB?null:(S.hR>S.hB?'red':'blue');
      else if(CFG.metric==='hp') w = S.hpR===S.hpB?null:(S.hpR>S.hpB?'red':'blue');
      else if(CFG.metric==='bal') w = S.balR===S.balB?null:(S.balR>S.balB?'red':'blue');
      if (w) endRound(w); else { timeLeft=30; tick('အချိန်စေ့ — သရေ! နောက်ထပ် ၃၀ စက္ကန့်'); }
    }
    if (timeLeft<=0 && CFG.metric==='goal') winCheck();
    winCheck();
    var mm = Math.max(0, Math.ceil(timeLeft)); $('tm').textContent = Math.floor(mm/60)+':'+('0'+(mm%60)).slice(-2);
    if ((frame._s||0) < S.t-0.25){ frame._s = S.t; syncHud(); }
  }
  if (game){ game.update(dt, S); renderer.render(game.scene, game.camera); }
}
resize(); applyNames(); syncHud(); requestAnimationFrame(frame);
})();
</script>
