<script src="three.min.js"></script>
<script>window.GAME3D = {};</script>
<script>
/* Pillow fight — 2D festival scene (user-supplied design, 2026-11-28).
   The scene is drawn on an offscreen 2D canvas (450x800 logical, 2x backing)
   and shown through a CanvasTexture on a fullscreen quad, so the standard
   NLO wrapper (HUD, guide, popups, postMessage, demo) works unchanged.
   Balance numbers live in the wrapper state S (balR/balB); this module only
   mirrors them for wobble/knock-off and plays the strike animations:
   T1 single hit, T2 double hit, T3 giant pillow, T4 storm barrage. */
GAME3D['pillow'] = { create: function(THREE) {
  var T = THREE;
  var LW = 450, LH = 800, DPR = 2;
  var cv = document.createElement('canvas');
  cv.width = LW * DPR; cv.height = LH * DPR;
  var ctx = cv.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var viewW = LW, viewH = LH;

  var tex = new T.CanvasTexture(cv);
  if ('colorSpace' in tex && T.SRGBColorSpace) tex.colorSpace = T.SRGBColorSpace;
  tex.generateMipmaps = false;
  tex.minFilter = T.LinearFilter;
  var scene = new T.Scene();
  var camera = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var quad = new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial({ map: tex }));
  scene.add(quad);

  var COMBAT = { WINDUP_TIME: 0.17, SWING_TIME: 0.14, RECOVER_TIME: 0.24, HITSTUN_TIME: 0.28 };

  var G = {
    time: 0, shakeMag: 0, poleFlex: 0, poleFlexVel: 0, crowdExcitement: 0,
    fluffParticles: [], strawParticles: [], impactBursts: [], popups: [],
    crowd: [], flagColors: ['#ef4444', '#facc15', '#3b82f6', '#22c55e', '#ffffff', '#f97316'],
    overPlayed: false
  };

  function createPlayer(team, facing) {
    return {
      team: team, facing: facing,
      balance: 100,
      state: 'idle', stateTimer: 0, strikeCd: 0, hasHitThisSwing: false,
      queue: 0, heavy: false, pillowScale: 1,
      tilt: 0, tiltVel: 0, wobblePhase: team === 'red' ? 0 : Math.PI * 0.7,
      fallX: 0, fallY: 0, fallVx: 0, fallVy: 0, fallRot: 0, fallRotVel: 0, landedInStraw: false,
      tagName: '', tagUntil: 0
    };
  }
  var L = createPlayer('red', 1);    // left fighter = red team
  var R = createPlayer('blue', -1);  // right fighter = blue team
  function fighter(team) { return team === 'red' ? L : R; }
  function foeOf(pl) { return pl === L ? R : L; }

  (function initCrowd() {
    var shirtColors = ['#334155', '#475569', '#1e293b', '#3f3f46', '#292524', '#1e3a5f', '#4c1d3d'];
    for (var i = 0; i < 26; i++) {
      G.crowd.push({
        xNorm: (i + 0.5) / 26 + (Math.random() - 0.5) * 0.025,
        scale: 0.78 + Math.random() * 0.34,
        phase: Math.random() * Math.PI * 2,
        color: shirtColors[i % shirtColors.length],
        armsUp: Math.random() > 0.55
      });
    }
  })();

  function getStageMetrics() {
    var s = Math.max(0.62, Math.min(Math.min(viewW / 440, viewH / 760), 1.45));
    var centerX = viewW * 0.5;
    var poleY = viewH * 0.54;
    var poleHalfLen = Math.min(viewW * 0.44, 290 * s);
    return { s: s, centerX: centerX, poleY: poleY, poleHalfLen: poleHalfLen,
             strawY: poleY + 128 * s, p1X: centerX - 66 * s, p2X: centerX + 66 * s, isPortrait: true };
  }
  function baseXOf(pl, m) { return pl === L ? m.p1X : m.p2X; }

  /* ---------------- particles & popups ---------------- */
  function spawnFluff(x, y, count) {
    count = count || 16;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2, speed = 45 + Math.random() * 175;
      G.fluffParticles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 40,
        size: 4 + Math.random() * 6, rot: Math.random() * Math.PI * 2, rotVel: (Math.random() - 0.5) * 6,
        life: 0.75 + Math.random() * 0.65, maxLife: 1.4, isFeather: Math.random() > 0.65 });
    }
    if (G.fluffParticles.length > 420) G.fluffParticles.splice(0, G.fluffParticles.length - 420);
  }
  function spawnStrawSplash(x, y, count) {
    count = count || 26;
    for (var i = 0; i < count; i++) {
      var angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7, speed = 90 + Math.random() * 230;
      G.strawParticles.push({ x: x + (Math.random() - 0.5) * 45, y: y + (Math.random() - 0.5) * 12,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        len: 10 + Math.random() * 14, rot: Math.random() * Math.PI * 2, rotVel: (Math.random() - 0.5) * 11,
        life: 0.7 + Math.random() * 0.55, maxLife: 1.25, color: Math.random() > 0.4 ? '#f59e0b' : '#fde047' });
    }
  }
  function spawnImpactBurst(x, y, color) {
    G.impactBursts.push({ x: x, y: y, radius: 10, maxRadius: 56, life: 0.22, maxLife: 0.22, color: color || '#fef08a' });
  }
  function spawnPopup(x, y, text, color, stroke) {
    G.popups.push({ x: x, y: y, vy: -55, text: text, color: color || '#fef08a', stroke: stroke || '#7c2d12', life: 0.95, maxLife: 0.95 });
    if (G.popups.length > 6) G.popups.shift();
  }

  /* ---------------- combat (visual only; balance owned by wrapper) ---------------- */
  function triggerStrike(pl) {
    if (pl.state === 'falling' || pl.state === 'fallen') return;
    if (pl.strikeCd > 0) return;
    if (pl.state !== 'idle' && pl.state !== 'recover') return;
    pl.state = 'windup';
    pl.stateTimer = COMBAT.WINDUP_TIME;
    pl.strikeCd = 0.34;
    pl.hasHitThisSwing = false;
    pl.tiltVel -= pl.facing * 2.1;
  }
  function queueStrikes(pl, n, heavy) {
    pl.queue = Math.min(6, pl.queue + n);
    if (heavy) { pl.heavy = true; pl.pillowScale = 1.75; }
  }
  function knockOffPole(loser, winner) {
    var m = getStageMetrics();
    loser.state = 'falling';
    loser.landedInStraw = false;
    loser.fallX = baseXOf(loser, m);
    loser.fallY = m.poleY;
    loser.fallVx = -loser.facing * (120 + Math.random() * 55) * m.s;
    loser.fallVy = -190 * m.s;
    loser.fallRot = loser.tilt;
    loser.fallRotVel = -loser.facing * (7.5 + Math.random() * 3);
    loser.queue = 0;
    if (winner) { winner.state = 'victory'; winner.stateTimer = 5; }
    G.crowdExcitement = 1.0;
    G.shakeMag = 10;
  }
  function visualHit(attacker, defender) {
    var m = getStageMetrics();
    var midX = m.centerX, hitY = m.poleY - 62 * m.s;
    var heavy = attacker.heavy;
    // simultaneous swing = pillow clash
    if (defender.state === 'swing' && !defender.hasHitThisSwing) {
      defender.hasHitThisSwing = true;
      attacker.tiltVel -= attacker.facing * 4.5;
      defender.tiltVel -= defender.facing * 4.5;
      G.shakeMag = 7; G.poleFlexVel += 120;
      spawnFluff(midX, hitY, 22);
      spawnImpactBurst(midX, hitY, '#ffffff');
      spawnPopup(midX, hitY - 26 * m.s, 'ဒုန်း!', '#ffffff', '#1e293b');
      return;
    }
    defender.state = 'hitstun';
    defender.stateTimer = COMBAT.HITSTUN_TIME;
    defender.tiltVel -= defender.facing * (heavy ? 9.2 : 6.6);
    G.shakeMag = heavy ? 11 : 6.5;
    G.poleFlexVel += heavy ? 185 : 120;
    G.crowdExcitement = Math.min(1, G.crowdExcitement + (heavy ? 0.85 : 0.45));
    var defX = baseXOf(defender, m);
    spawnFluff(defX - defender.facing * 12 * m.s, hitY, heavy ? 30 : 16);
    spawnImpactBurst(defX - defender.facing * 10 * m.s, hitY, heavy ? '#fde047' : '#ffffff');
    spawnPopup(defX, hitY - 28 * m.s, heavy ? 'ဖောင်း! ပြင်းတယ်!' : 'ဖောင်!', heavy ? '#fde047' : '#ffffff', '#991b1b');
    if (defender.balance <= 0) knockOffPole(defender, attacker);
  }

  function updatePlayer(pl, dt) {
    var m = getStageMetrics();
    if (pl.strikeCd > 0) pl.strikeCd = Math.max(0, pl.strikeCd - dt);

    if (pl.state === 'falling') {
      pl.fallVy += 920 * m.s * dt;
      pl.fallX += pl.fallVx * dt;
      pl.fallY += pl.fallVy * dt;
      pl.fallRot += pl.fallRotVel * dt;
      if (pl.fallY >= m.strawY - 8 * m.s && !pl.landedInStraw) {
        pl.fallY = m.strawY - 8 * m.s;
        pl.fallX = Math.max(56, Math.min(viewW - 56, pl.fallX));
        pl.landedInStraw = true;
        pl.state = 'fallen';
        spawnStrawSplash(pl.fallX, m.strawY, 32);
        G.shakeMag = 8;
      }
      return;
    }
    if (pl.state === 'fallen') return;

    if (pl.state === 'windup') {
      pl.stateTimer -= dt;
      if (pl.stateTimer <= 0) {
        pl.state = 'swing';
        pl.stateTimer = COMBAT.SWING_TIME;
        pl.tiltVel += pl.facing * 4.4;
      }
    } else if (pl.state === 'swing') {
      pl.stateTimer -= dt;
      if (!pl.hasHitThisSwing && pl.stateTimer <= COMBAT.SWING_TIME * 0.65) {
        pl.hasHitThisSwing = true;
        visualHit(pl, foeOf(pl));
      }
      if (pl.stateTimer <= 0 && pl.state === 'swing') {
        pl.state = 'recover';
        pl.stateTimer = COMBAT.RECOVER_TIME;
        if (pl.heavy) { pl.heavy = false; pl.pillowScale = 1; }
      }
    } else if (pl.state === 'recover' || pl.state === 'hitstun') {
      pl.stateTimer -= dt;
      if (pl.stateTimer <= 0) pl.state = 'idle';
    } else if (pl.state === 'victory') {
      pl.stateTimer -= dt;
      if (pl.stateTimer <= 0 && !G.overPlayed) pl.state = 'idle';
    }

    // start the next queued strike
    if ((pl.state === 'idle' || pl.state === 'recover') && pl.queue > 0 && pl.strikeCd <= 0) {
      pl.queue--;
      triggerStrike(pl);
    }

    // spring-damper balance wobble on the bamboo pole
    var instability = (100 - Math.max(0, pl.balance)) / 100;
    pl.wobblePhase += dt * (2.8 + instability * 5.2);
    var targetTilt = Math.sin(pl.wobblePhase) * (0.045 + instability * 0.24);
    if (pl.state === 'windup') targetTilt = -pl.facing * 0.22;
    else if (pl.state === 'swing') targetTilt = pl.facing * 0.30;
    else if (pl.state === 'victory') targetTilt = Math.sin(G.time * 7) * 0.1;
    var acc = (targetTilt - pl.tilt) * 36 - pl.tiltVel * 6.2;
    pl.tiltVel += acc * dt;
    pl.tilt += pl.tiltVel * dt;
    pl.tilt = Math.max(-0.85, Math.min(0.85, pl.tilt));
  }

  function updateParticles(dt) {
    var i, f;
    for (i = G.fluffParticles.length - 1; i >= 0; i--) {
      f = G.fluffParticles[i];
      f.life -= dt;
      if (f.life <= 0) { G.fluffParticles.splice(i, 1); continue; }
      f.vx *= 0.94;
      f.vy = f.vy * 0.94 + 38 * dt;
      f.x += f.vx * dt + Math.sin(G.time * 5 + i) * 14 * dt;
      f.y += f.vy * dt;
      f.rot += f.rotVel * dt;
    }
    for (i = G.strawParticles.length - 1; i >= 0; i--) {
      var st = G.strawParticles[i];
      st.life -= dt;
      if (st.life <= 0) { G.strawParticles.splice(i, 1); continue; }
      st.vy += 580 * dt;
      st.x += st.vx * dt;
      st.y += st.vy * dt;
      st.rot += st.rotVel * dt;
    }
    for (i = G.impactBursts.length - 1; i >= 0; i--) {
      var b = G.impactBursts[i];
      b.life -= dt;
      if (b.life <= 0) { G.impactBursts.splice(i, 1); continue; }
      var t = 1 - b.life / b.maxLife;
      b.radius = 12 + (b.maxRadius - 12) * t;
    }
    for (i = G.popups.length - 1; i >= 0; i--) {
      var pop = G.popups[i];
      pop.life -= dt;
      if (pop.life <= 0) { G.popups.splice(i, 1); continue; }
      pop.y += pop.vy * dt;
      pop.vy *= 0.94;
    }
  }

  /* ---------------- drawing (adapted from the user's 2D design) ---------------- */
  function drawSkyAndSun() {
    var skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
    skyGrad.addColorStop(0, '#38bdf8');
    skyGrad.addColorStop(0.45, '#bae6fd');
    skyGrad.addColorStop(0.75, '#fef3c7');
    skyGrad.addColorStop(1, '#fde68a');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, viewW, viewH);
    var sunX = viewW * 0.82, sunY = viewH * 0.17;
    var sunGlow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 130);
    sunGlow.addColorStop(0, 'rgba(255, 251, 210, 0.95)');
    sunGlow.addColorStop(0.35, 'rgba(253, 224, 71, 0.45)');
    sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 130, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    for (var i = 0; i < 3; i++) {
      var cx = ((G.time * (9 + i * 3) + i * 320) % (viewW + 200)) - 100;
      var cy = viewH * (0.14 + i * 0.07);
      ctx.beginPath();
      ctx.arc(cx, cy, 24, 0, Math.PI * 2);
      ctx.arc(cx + 22, cy - 8, 28, 0, Math.PI * 2);
      ctx.arc(cx + 46, cy, 22, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPalmTree(baseX, baseY, scale, leanDir) {
    ctx.save();
    ctx.translate(baseX, baseY);
    var sway = Math.sin(G.time * 1.4 + baseX * 0.01) * 8 * scale;
    var topX = leanDir * 32 * scale + sway;
    var topY = -210 * scale;
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 14 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(leanDir * 14 * scale, -105 * scale, topX, topY);
    ctx.stroke();
    var frondAngles = [-2.6, -2.1, -1.5, -0.9, -0.4, 0.25];
    frondAngles.forEach(function(ang, idx) {
      var fSway = Math.sin(G.time * 2.1 + idx) * 0.06;
      ctx.save();
      ctx.translate(topX, topY);
      ctx.rotate(ang + fSway);
      ctx.fillStyle = idx % 2 === 0 ? '#15803d' : '#16a34a';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(38 * scale, -18 * scale, 78 * scale, 8 * scale);
      ctx.quadraticCurveTo(36 * scale, 4 * scale, 0, 6 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }

  function drawBuntingFlags(m) {
    function drawString(x1, y1, x2, y2, sag, flagCount) {
      var wind = Math.sin(G.time * 2.6 + y1 * 0.02) * 6;
      ctx.strokeStyle = 'rgba(71, 85, 105, 0.65)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + sag + wind, x2, y2);
      ctx.stroke();
      for (var i = 1; i < flagCount; i++) {
        var t = i / flagCount, omt = 1 - t;
        var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 + sag + wind;
        var px = omt * omt * x1 + 2 * omt * t * cx + t * t * x2;
        var py = omt * omt * y1 + 2 * omt * t * cy + t * t * y2;
        var fw = 12 * m.s, fh = 18 * m.s;
        var flutter = Math.sin(G.time * 5 + i * 0.9) * 3;
        ctx.fillStyle = G.flagColors[i % G.flagColors.length];
        ctx.beginPath();
        ctx.moveTo(px - fw * 0.5, py);
        ctx.lineTo(px + fw * 0.5, py);
        ctx.lineTo(px + flutter, py + fh);
        ctx.closePath();
        ctx.fill();
      }
    }
    drawString(-10, viewH * 0.11, viewW * 0.55, viewH * 0.17, 36 * m.s, 14);
    drawString(viewW * 0.45, viewH * 0.16, viewW + 10, viewH * 0.10, 34 * m.s, 14);
  }

  function drawBackgroundAndCrowd(m) {
    var horizonY = m.poleY + 42 * m.s;
    ctx.fillStyle = '#86efac';
    ctx.beginPath();
    ctx.moveTo(0, viewH);
    ctx.lineTo(0, horizonY - 26 * m.s);
    ctx.quadraticCurveTo(viewW * 0.25, horizonY - 58 * m.s, viewW * 0.5, horizonY - 30 * m.s);
    ctx.quadraticCurveTo(viewW * 0.78, horizonY - 62 * m.s, viewW, horizonY - 22 * m.s);
    ctx.lineTo(viewW, viewH);
    ctx.closePath();
    ctx.fill();
    drawPalmTree(viewW * 0.08, horizonY + 12 * m.s, m.s * 0.92, 1);
    drawPalmTree(viewW * 0.92, horizonY + 12 * m.s, m.s * 0.95, -1);
    var crowdBaseY = m.poleY + 76 * m.s;
    G.crowd.forEach(function(person) {
      var px = person.xNorm * viewW;
      var ps = person.scale * m.s;
      var jumpAmp = (3 + G.crowdExcitement * 16) * ps;
      var jump = Math.abs(Math.sin(G.time * (3.2 + G.crowdExcitement * 7) + person.phase)) * jumpAmp;
      var py = crowdBaseY - jump;
      ctx.fillStyle = person.color;
      ctx.globalAlpha = 0.72;
      ctx.beginPath();
      ctx.roundRect(px - 12 * ps, py - 24 * ps, 24 * ps, 38 * ps, 10 * ps);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px, py - 34 * ps, 9.5 * ps, 0, Math.PI * 2);
      ctx.fill();
      if (person.armsUp || G.crowdExcitement > 0.25) {
        ctx.strokeStyle = person.color;
        ctx.lineWidth = 4.5 * ps;
        ctx.lineCap = 'round';
        var wave = Math.sin(G.time * 10 + person.phase) * 5 * ps;
        ctx.beginPath();
        ctx.moveTo(px - 10 * ps, py - 18 * ps);
        ctx.lineTo(px - 19 * ps, py - 36 * ps + wave);
        ctx.moveTo(px + 10 * ps, py - 18 * ps);
        ctx.lineTo(px + 19 * ps, py - 36 * ps - wave);
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
    var groundGrad = ctx.createLinearGradient(0, m.poleY + 60 * m.s, 0, viewH);
    groundGrad.addColorStop(0, '#d97706');
    groundGrad.addColorStop(0.25, '#b45309');
    groundGrad.addColorStop(1, '#78350f');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, m.poleY + 72 * m.s, viewW, viewH - (m.poleY + 72 * m.s));
  }

  function drawGoldenRiceStraw(m) {
    var y = m.strawY;
    var moundW = m.poleHalfLen * 1.18;
    var strawGrad = ctx.createLinearGradient(0, y - 34 * m.s, 0, y + 60 * m.s);
    strawGrad.addColorStop(0, '#fde047');
    strawGrad.addColorStop(0.45, '#f59e0b');
    strawGrad.addColorStop(1, '#b45309');
    ctx.fillStyle = strawGrad;
    ctx.beginPath();
    ctx.moveTo(m.centerX - moundW, y + 55 * m.s);
    ctx.quadraticCurveTo(m.centerX - moundW * 0.55, y - 38 * m.s, m.centerX, y - 24 * m.s);
    ctx.quadraticCurveTo(m.centerX + moundW * 0.55, y - 38 * m.s, m.centerX + moundW, y + 55 * m.s);
    ctx.closePath();
    ctx.fill();
    ctx.lineCap = 'round';
    for (var i = -14; i <= 14; i++) {
      var sx = m.centerX + (i / 14) * (moundW * 0.85);
      var sy = y - 6 * m.s + (Math.abs(i % 3) * 7 * m.s);
      ctx.strokeStyle = i % 2 === 0 ? '#fef08a' : '#d97706';
      ctx.lineWidth = 2.4 * m.s;
      ctx.beginPath();
      ctx.moveTo(sx - 10 * m.s, sy + 4 * m.s);
      ctx.lineTo(sx + 10 * m.s, sy - 4 * m.s);
      ctx.stroke();
    }
  }

  function drawBambooStage(m) {
    var leftX = m.centerX - m.poleHalfLen;
    var rightX = m.centerX + m.poleHalfLen;
    var poleY = m.poleY;
    var flex = G.poleFlex * 0.14 * m.s;
    var footY = m.strawY + 26 * m.s;
    function drawAFrame(x) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#3f6212';
      ctx.lineWidth = 11 * m.s;
      ctx.beginPath();
      ctx.moveTo(x, poleY - 12 * m.s);
      ctx.lineTo(x - 28 * m.s, footY);
      ctx.stroke();
      ctx.strokeStyle = '#4d7c0f';
      ctx.lineWidth = 11 * m.s;
      ctx.beginPath();
      ctx.moveTo(x, poleY - 12 * m.s);
      ctx.lineTo(x + 28 * m.s, footY);
      ctx.stroke();
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 4.5 * m.s;
      ctx.beginPath();
      ctx.moveTo(x - 10 * m.s, poleY - 6 * m.s);
      ctx.lineTo(x + 10 * m.s, poleY + 6 * m.s);
      ctx.moveTo(x + 10 * m.s, poleY - 6 * m.s);
      ctx.lineTo(x - 10 * m.s, poleY + 6 * m.s);
      ctx.stroke();
    }
    drawAFrame(leftX + 16 * m.s);
    drawAFrame(rightX - 16 * m.s);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#15803d';
    ctx.lineWidth = 22 * m.s;
    ctx.beginPath();
    ctx.moveTo(leftX, poleY);
    ctx.quadraticCurveTo(m.centerX, poleY + flex, rightX, poleY);
    ctx.stroke();
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 6 * m.s;
    ctx.beginPath();
    ctx.moveTo(leftX + 6 * m.s, poleY - 5 * m.s);
    ctx.quadraticCurveTo(m.centerX, poleY - 5 * m.s + flex, rightX - 6 * m.s, poleY - 5 * m.s);
    ctx.stroke();
    var segments = 7;
    for (var i = 1; i < segments; i++) {
      var t = i / segments;
      var nx = leftX + (rightX - leftX) * t;
      var ny = poleY + 2 * (1 - t) * t * flex;
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 2.6 * m.s;
      ctx.beginPath();
      ctx.moveTo(nx, ny - 10 * m.s);
      ctx.lineTo(nx, ny + 10 * m.s);
      ctx.stroke();
    }
  }

  function drawCharacter(pl, m) {
    var s = m.s;
    var isRed = pl.team === 'red';
    var flexOffset = G.poleFlex * 0.08 * s;
    var baseX = baseXOf(pl, m);
    var baseY = m.poleY + flexOffset;
    var rot = pl.tilt;
    if (pl.state === 'falling' || pl.state === 'fallen') {
      baseX = pl.fallX;
      baseY = pl.fallY;
      rot = pl.fallRot;
    }
    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.rotate(rot);
    ctx.scale(pl.facing, 1);

    var shirtColor = isRed ? '#dc2626' : '#2563eb';
    var shirtShadow = isRed ? '#b91c1c' : '#1d4ed8';
    var longyiBase = isRed ? '#6b2737' : '#1e3a5f';
    var longyiStripe = isRed ? '#f59e0b' : '#60a5fa';
    var pillowBg = isRed ? '#fef2f2' : '#eff6ff';
    var pillowPattern = isRed ? '#ef4444' : '#3b82f6';
    var skin = '#d99a6c';
    var skinDark = '#b87a4e';

    // back dangling leg
    var legSwing = Math.sin(pl.wobblePhase * 1.2) * 5 * s;
    ctx.strokeStyle = skinDark;
    ctx.lineWidth = 10 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4 * s, 6 * s);
    ctx.lineTo(-10 * s + legSwing, 34 * s);
    ctx.stroke();

    // back arm (tucked behind back; flails when falling)
    ctx.strokeStyle = skinDark;
    ctx.lineWidth = 8.5 * s;
    ctx.beginPath();
    if (pl.state === 'falling' || pl.state === 'fallen') {
      ctx.moveTo(-10 * s, -48 * s);
      ctx.lineTo(-34 * s, -72 * s);
    } else {
      ctx.moveTo(-10 * s, -46 * s);
      ctx.quadraticCurveTo(-24 * s, -30 * s, -12 * s, -16 * s);
    }
    ctx.stroke();

    // longyi
    ctx.fillStyle = longyiBase;
    ctx.beginPath();
    ctx.roundRect(-20 * s, -18 * s, 40 * s, 28 * s, 10 * s);
    ctx.fill();
    ctx.strokeStyle = longyiStripe;
    ctx.lineWidth = 2 * s;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.moveTo(-16 * s, -10 * s); ctx.lineTo(16 * s, -10 * s);
    ctx.moveTo(-16 * s, -2 * s);  ctx.lineTo(16 * s, -2 * s);
    ctx.moveTo(-6 * s, -16 * s);  ctx.lineTo(-6 * s, 8 * s);
    ctx.moveTo(6 * s, -16 * s);   ctx.lineTo(6 * s, 8 * s);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // front dangling leg
    ctx.strokeStyle = skin;
    ctx.lineWidth = 11 * s;
    ctx.beginPath();
    ctx.moveTo(5 * s, 4 * s);
    ctx.lineTo(12 * s - legSwing, 32 * s);
    ctx.lineTo(4 * s - legSwing, 48 * s);
    ctx.stroke();

    // torso
    ctx.fillStyle = shirtColor;
    ctx.beginPath();
    ctx.roundRect(-18 * s, -62 * s, 36 * s, 48 * s, 12 * s);
    ctx.fill();
    ctx.fillStyle = shirtShadow;
    ctx.beginPath();
    ctx.roundRect(-18 * s, -62 * s, 10 * s, 48 * s, 8 * s);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.arc(2 * s, -61 * s, 7 * s, 0.1, Math.PI - 0.1);
    ctx.stroke();

    // head & face
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(2 * s, -80 * s, 17 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1e1b18';
    ctx.beginPath();
    ctx.arc(0 * s, -84 * s, 17.5 * s, Math.PI * 0.92, Math.PI * 2.02);
    ctx.quadraticCurveTo(10 * s, -94 * s, -14 * s, -82 * s);
    ctx.fill();
    ctx.fillStyle = '#1e1b18';
    ctx.strokeStyle = '#1e1b18';
    ctx.lineWidth = 2 * s;
    if (pl.state === 'hitstun' || pl.state === 'falling' || pl.state === 'fallen') {
      ctx.beginPath();
      ctx.moveTo(6 * s, -85 * s); ctx.lineTo(12 * s, -79 * s);
      ctx.moveTo(12 * s, -85 * s); ctx.lineTo(6 * s, -79 * s);
      ctx.stroke();
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.arc(10 * s, -71 * s, 4 * s, 0, Math.PI * 2);
      ctx.fill();
    } else if (pl.state === 'windup' || pl.state === 'swing') {
      ctx.beginPath();
      ctx.arc(9 * s, -82 * s, 2.5 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(5 * s, -88 * s); ctx.lineTo(14 * s, -85 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(9 * s, -73 * s, 4 * s, 0, Math.PI);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(9 * s, -82 * s, 2.5 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(9 * s, -75 * s, 4.5 * s, 0.15, Math.PI * 0.85);
      ctx.stroke();
    }

    // front arm + pillow
    var armAngle = -0.35;
    if (pl.state === 'windup') {
      var tw = 1 - pl.stateTimer / COMBAT.WINDUP_TIME;
      armAngle = -0.35 - tw * 1.45;
    } else if (pl.state === 'swing') {
      var ts = 1 - pl.stateTimer / COMBAT.SWING_TIME;
      armAngle = -1.8 + ts * 2.55;
    } else if (pl.state === 'recover') {
      var tr = 1 - pl.stateTimer / COMBAT.RECOVER_TIME;
      armAngle = 0.75 - tr * 1.1;
    } else if (pl.state === 'victory') {
      armAngle = -1.7 + Math.sin(G.time * 12) * 0.25;
    } else if (pl.state === 'falling') {
      armAngle = -2.2;
    }
    ctx.save();
    ctx.translate(6 * s, -48 * s);
    ctx.rotate(armAngle);
    ctx.strokeStyle = skin;
    ctx.lineWidth = 9 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(28 * s, 0);
    ctx.stroke();
    ctx.save();
    ctx.translate(28 * s, 0);
    ctx.rotate(0.18);
    ctx.scale(pl.pillowScale, pl.pillowScale);
    ctx.fillStyle = pillowBg;
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.roundRect(-6 * s, -19 * s, 44 * s, 32 * s, 12 * s);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = pillowPattern;
    ctx.lineWidth = 3 * s;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(6 * s, -16 * s);  ctx.lineTo(6 * s, 10 * s);
    ctx.moveTo(18 * s, -16 * s); ctx.lineTo(18 * s, 10 * s);
    ctx.moveTo(30 * s, -16 * s); ctx.lineTo(30 * s, 10 * s);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (pl.state === 'swing') {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 6 * s;
      ctx.beginPath();
      ctx.arc(-20 * s, 0, 48 * s, -0.7, 0.1);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
    ctx.restore();
  }

  function drawEffects(m) {
    G.impactBursts.forEach(function(b) {
      var alpha = b.life / b.maxLife;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.strokeStyle = b.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 4 * m.s;
      for (var i = 0; i < 8; i++) {
        var ang = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * b.radius * 0.45, Math.sin(ang) * b.radius * 0.45);
        ctx.lineTo(Math.cos(ang) * b.radius, Math.sin(ang) * b.radius);
        ctx.stroke();
      }
      ctx.restore();
    });
    G.fluffParticles.forEach(function(f) {
      var alpha = Math.min(1, f.life / 0.35);
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      if (f.isFeather) {
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size * 1.4, f.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, f.size * 0.7, 0, Math.PI * 2);
        ctx.arc(f.size * 0.4, -f.size * 0.2, f.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    G.strawParticles.forEach(function(st) {
      var alpha = Math.min(1, st.life / 0.3);
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.rot);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = st.color;
      ctx.lineWidth = 3 * m.s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-st.len * 0.5, 0);
      ctx.lineTo(st.len * 0.5, 0);
      ctx.stroke();
      ctx.restore();
    });
    G.popups.forEach(function(pop) {
      var t = 1 - pop.life / pop.maxLife;
      var scale = t < 0.18 ? 0.6 + (t / 0.18) * 0.55 : 1.05;
      var alpha = pop.life < 0.25 ? pop.life / 0.25 : 1;
      ctx.save();
      ctx.translate(pop.x, pop.y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.font = '800 ' + Math.round(20 * m.s) + 'px "Noto Sans Myanmar", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5 * m.s;
      ctx.strokeStyle = pop.stroke;
      ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, 0, 0);
      ctx.restore();
    });
  }

  function drawNameTag(pl, m) {
    if (!pl.tagName || G.time > pl.tagUntil) return;
    if (pl.state === 'falling' || pl.state === 'fallen') return;
    var x = baseXOf(pl, m);
    var y = m.poleY - 128 * m.s;
    ctx.save();
    ctx.font = '700 ' + Math.round(13 * m.s) + 'px "Noto Sans Myanmar", system-ui, sans-serif';
    var w = ctx.measureText(pl.tagName).width + 18 * m.s;
    var h = 21 * m.s;
    ctx.fillStyle = 'rgba(10, 12, 24, 0.72)';
    ctx.strokeStyle = pl.team === 'red' ? '#ff4d7e' : '#3fa9ff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pl.tagName, x, y + 1);
    ctx.restore();
  }

  function render() {
    var m = getStageMetrics();
    ctx.save();
    if (G.shakeMag > 0.2) {
      ctx.translate((Math.random() - 0.5) * G.shakeMag * 2, (Math.random() - 0.5) * G.shakeMag * 2);
    }
    drawSkyAndSun();
    drawBackgroundAndCrowd(m);
    drawBuntingFlags(m);
    drawGoldenRiceStraw(m);
    drawBambooStage(m);
    if (L.state === 'swing') { drawCharacter(R, m); drawCharacter(L, m); }
    else { drawCharacter(L, m); drawCharacter(R, m); }
    drawEffects(m);
    drawNameTag(L, m);
    drawNameTag(R, m);
    ctx.restore();
  }

  /* ---------------- wrapper interface ---------------- */
  function reset() {
    var rp = L.wobblePhase, bp = R.wobblePhase;
    L = createPlayer('red', 1);
    R = createPlayer('blue', -1);
    L.wobblePhase = rp; R.wobblePhase = bp;
    G.fluffParticles = []; G.strawParticles = []; G.impactBursts = []; G.popups = [];
    G.poleFlex = 0; G.poleFlexVel = 0; G.overPlayed = false;
  }

  function update(dt, S) {
    G.time += dt;
    // mirror wrapper balance for wobble + knock-off
    L.balance = S.balR;
    R.balance = S.balB;
    // round end: knock-off if a balance hit zero, else winner bounce
    if (S.over && !G.overPlayed) {
      G.overPlayed = true;
      var loser = S.winner === 'red' ? R : L;
      var winner = S.winner === 'red' ? L : R;
      if (loser.balance <= 0 && loser.state !== 'falling' && loser.state !== 'fallen') {
        knockOffPole(loser, winner);
      } else if (winner.state !== 'falling' && winner.state !== 'fallen') {
        winner.state = 'victory';
        winner.stateTimer = 5;
        G.crowdExcitement = 1.0;
      }
    }
    if (!S.over && G.overPlayed) G.overPlayed = false;

    var poleAcc = -G.poleFlex * 95 - G.poleFlexVel * 8.5;
    G.poleFlexVel += poleAcc * dt;
    G.poleFlex += G.poleFlexVel * dt;
    if (G.shakeMag > 0) G.shakeMag = Math.max(0, G.shakeMag - 32 * dt);
    if (G.crowdExcitement > 0) G.crowdExcitement = Math.max(0, G.crowdExcitement - 0.65 * dt);

    updatePlayer(L, dt);
    updatePlayer(R, dt);
    updateParticles(dt);
    render();
    tex.needsUpdate = true;
  }

  return {
    scene: scene,
    camera: camera,
    update: update,
    onJoin: function(team) {
      G.crowdExcitement = Math.min(1, G.crowdExcitement + 0.45);
      var f = fighter(team);
      if (f.state === 'idle') { f.state = 'victory'; f.stateTimer = 0.7; }
    },
    onGift: function(team, tier, name) {
      var f = fighter(team);
      f.tagName = name || '';
      f.tagUntil = G.time + 1.6;
      if (tier === 1) queueStrikes(f, 1, false);
      else if (tier === 2) queueStrikes(f, 2, false);
      else if (tier === 3) queueStrikes(f, 1, true);
      else { queueStrikes(f, 4, false); G.crowdExcitement = 1.0; }
    },
    onLike: function(team) {
      G.crowdExcitement = Math.min(1, G.crowdExcitement + 0.3);
    },
    reset: reset
  };
} };
